{% extends "base.html" %}
{% block title %}Change password · Nornament{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Choose a new password</h1>
  <p class="muted">Your login was imported and still carries its old password. Set a new one to continue.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Save</button>
  </form>
</div>
{% endblock %}
