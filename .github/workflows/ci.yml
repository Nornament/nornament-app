name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Partial unique indexes and the generated margin column are part of
        # what is under test, so the suite needs a real Postgres.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nornament
          POSTGRES_USER: nornament
          POSTGRES_PASSWORD: nornament
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nornament"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: nornament
      POSTGRES_USER: nornament
      POSTGRES_PASSWORD: nornament
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Django checks
        run: |
          python manage.py check
          DJANGO_DEBUG=0 python manage.py check --deploy --fail-level ERROR
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
