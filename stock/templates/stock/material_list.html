{% extends "base.html" %}
{% block title %}Materials · Nornament{% endblock %}
{% block content %}
<h1>Materials</h1>
<form class="card row" method="get">
  <div>
    <label for="q">Search</label>
    <input id="q" type="search" name="q" value="{{ q }}"
           hx-get="{% url 'stock:material_list' %}" hx-target="#material-rows" hx-trigger="keyup changed delay:300ms">
  </div>
  <div class="tight"><button>Search</button></div>
</form>
<div id="material-rows">{% include "stock/_material_rows.html" %}</div>
{% endblock %}
