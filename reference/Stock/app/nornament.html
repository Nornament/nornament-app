/* ═══════════════ Physical stock count ═══════════════
   A count is a row on the server now, not a list of strings in this tab.
   It survives a reload, a flat battery, and a second person joining on
   another phone. countDraft — which lost everything the moment you left
   the page — is gone. */
let COUNT = null;      // the open count, exactly as the server reports it
let COUNTS = [];       // header rows from api.stock_count
let LASTSCAN = null;   // verdict of the most recent scan, for the banner
let SCANSOUND = true;

async function loadCounts(){
  if(!TOKEN) return;
  COUNTS = await sbFetch('stock_count?select=*&order=started_at.desc&limit=40');
}

const VERD = {
  FOUND:     ['good','Found',        'where the books say it is'],
  ELSEWHERE: ['warn','Elsewhere',    ''],
  NOT_STOCK: ['warn','Not in stock', ''],
  ALREADY:   ['mute','Already counted',''],
  UNKNOWN:   ['crit','Unknown code', ''],
  ERROR:     ['crit','Not recorded', '']
};

/* a scan you have to look at is a scan you cannot do quickly. two tones:
   one for a clean hit, one for anything that needs a human. */
let AC = null;
function scanTone(ok){
  if(!SCANSOUND) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.value = ok ? 1180 : 320;
    g.gain.setValueAtTime(.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.13, AC.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+(ok?.09:.22));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(ok?.1:.24));
  }catch(e){ /* no audio, no problem */ }
}

function pgCount(){
  return (COUNT && COUNT.status==='OPEN') ? countFloor() : countStart();
}

/* ── picking a location ─────────────────────────────────────────────── */
function countStart(){
  const expectedAt = code => DB.jewels.filter(j =>
      j.loc===code && ['IN_STOCK','RESERVED'].includes(j.state)).length;
  const locs = Object.entries(DB.locations);
  const total = locs.reduce((n,[k]) => n + expectedAt(k), 0);
  const open = COUNTS.filter(c => c.status==='OPEN');
  const done = COUNTS.filter(c => c.status==='CLOSED');

  return `<div class="card">
    <h3>Physical stock count</h3>
    <p class="hint">Two different things: what the system believes is on the shelf, and what
    someone actually found there. This is the second one. Pick a location, scan every piece you
    can physically pick up, and the variance falls out of the difference.</p>

    <div class="lcgrid">
      ${locs.map(([code,name])=>{
        const o = open.find(c => c.location===code);
        const n = expectedAt(code);
        return `<button class="loccard${o?' resume':''}" data-startloc="${code}">
          <span class="lcname">${name}</span>
          <span class="lccode">${code}</span>
          <span class="lcn">${n} piece${n===1?'':'s'} on the books here</span>
          ${o ? `<span class="chip c-warn">in progress · ${o.scans} scanned</span>`
              : `<span class="dim" style="font-size:11.5px">start a count →</span>`}
        </button>`}).join('')}
    </div>

    ${total===0 ? `<div class="note" style="margin-top:14px">
      No piece is recorded at any location yet — every one is still <b>not received</b>.
      A count will run, but it will expect nothing and flag everything you scan as unexpected.
      Receive the stock into a location first and the variance becomes meaningful.</div>` : ''}

    ${done.length ? `<div style="margin-top:26px"><h3>Past counts</h3>
      <table><thead><tr><th>Ref</th><th>Location</th><th class="num">Expected</th>
        <th class="num">Found</th><th class="num">Missing</th><th class="num">Unexpected</th>
        <th>Closed</th><th>By</th></tr></thead><tbody>
      ${done.map(c=>{ const r=c.result||{};
        return `<tr data-openresult="${c.count_id}" style="cursor:pointer">
        <td class="code">${c.count_ref}</td><td>${c.location_name}</td>
        <td class="num dim">${r.expected??'—'}</td>
        <td class="num">${r.found??'—'}</td>
        <td class="num">${r.missing?`<span class="chip c-crit">${r.missing}</span>`:0}</td>
        <td class="num">${r.unexpected?`<span class="chip c-warn">${r.unexpected}</span>`:0}</td>
        <td class="dim">${(c.closed_at||'').slice(0,10)}</td>
        <td class="dim">${c.counted_by||'—'}</td></tr>`}).join('')}
      </tbody></table></div>` : ''}
  </div>`;
}

/* ── the counting floor ─────────────────────────────────────────────── */
function countFloor(){
  const c = COUNT;
  return `<div class="card">
    <div class="spread">
      <div><h3>${c.location_name}
        <span class="code" style="font-size:12px;color:var(--muted);font-weight:400">${c.count_ref}</span></h3>
        <p class="hint" style="margin:0">Started ${(c.started_at||'').slice(0,16).replace('T',' ')}
        by ${c.counted_by||'—'}. Saved on the server — you can close this and come back.</p></div>
      <div class="row">
        <button class="btn" id="soundtog" title="Beep on each scan">Sound ${SCANSOUND?'on':'off'}</button>
        <button class="btn" id="countcancel">Abandon</button>
        <button class="btn primary" id="countfinish">Finish &amp; show variance</button>
      </div>
    </div>

    <div class="scanbar">
      <input id="scanin" placeholder="Scan a tag, or type a jewel code and press Enter"
             autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="scango">Add</button>
    </div>
    <div id="cverdict">${verdictBanner()}</div>
    <div id="cpanel">${countPanel()}</div>
  </div>`;
}

function verdictBanner(){
  if(!LASTSCAN) return '';
  const v = LASTSCAN.verdict;
  const [cls,label,fallback] = VERD[v] || ['mute',v,''];
  return `<div class="vbanner vb-${cls}">
    <span class="vcode">${LASTSCAN.code||'—'}</span>
    <b class="vsay">${label}</b>
    <span class="vsay" style="opacity:.85">${LASTSCAN.note||fallback}</span>
  </div>`;
}

function tcard(label, val, cls){
  return `<div class="tcard${cls?' '+cls:''}"><span class="tl">${label}</span><span class="tv">${val}</span></div>`;
}

function countPanel(){
  const c = COUNT;
  const pct = c.expected ? Math.min(100, Math.round(100*c.found/c.expected)) : 0;
  const miss = c.missing_list || [], unex = c.unexpected_list || [], rec = c.recent || [];
  return `
  <div class="ctally">
    ${tcard('On the books here', c.expected, '')}
    ${tcard('Found',        c.found,      c.found?'good':'')}
    ${tcard('Still missing',c.missing,    c.missing?'crit':'')}
    ${tcard('Unexpected',   c.unexpected, c.unexpected?'warn':'')}
  </div>
  <div class="cbar"><span style="width:${pct}%"></span></div>
  <p class="hint" style="margin:7px 0 0">${c.expected
      ? `${c.found} of ${c.expected} accounted for${c.unexpected?`, plus ${c.unexpected} that should not be here`:''}.`
      : `Nothing is recorded at ${c.location}, so everything scanned reads as unexpected.`}</p>

  <div style="margin-top:18px">
    <h4 style="margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)">
      Last ${rec.length} scanned</h4>
    <div class="cscroll">${rec.length ? rec.map(r=>{
      const cls = r.verdict==='FOUND' ? 'p-good' : (r.verdict==='NOT_STOCK'||r.verdict==='ELSEWHERE') ? 'p-warn' : '';
      return `<span class="cpill ${cls}"><span class="pc">${r.code}</span>
        ${r.note?`<span class="pn">${r.note}</span>`:''}
        <button class="x" data-unscan="${r.code}" title="Undo this scan">×</button></span>`}).join('')
      : '<span class="dim" style="font-size:13px">Nothing scanned yet. The box above is already focused — start scanning.</span>'}</div>
  </div>

  <div class="ccols">
    <div><h4>Not found yet · ${miss.length}</h4>
      <div class="cscroll">${miss.length ? miss.map(m=>
        `<span class="cpill"><span class="pc">${m}</span></span>`).join('')
        : '<span class="dim" style="font-size:13px">Nothing outstanding.</span>'}</div></div>
    <div><h4>Should not be here · ${unex.length}</h4>
      <div class="cscroll">${unex.length ? unex.map(u=>
        `<span class="cpill p-warn"><span class="pc">${u.code}</span>
          <span class="pn">${u.note||''}</span></span>`).join('')
        : '<span class="dim" style="font-size:13px">Nothing unexpected.</span>'}</div></div>
  </div>`;
}

/* ── actions ────────────────────────────────────────────────────────── */
function focusScan(){
  const el = document.getElementById('scanin');
  if(el){ el.focus(); el.select(); }
}
function paintCount(){
  const p = document.getElementById('cpanel');   if(p) p.innerHTML = countPanel();
  const v = document.getElementById('cverdict'); if(v) v.innerHTML = verdictBanner();
  wireCountPanel();
}
function wireCountPanel(){
  document.querySelectorAll('#cpanel [data-unscan]').forEach(b =>
    b.onclick = () => undoScan(b.dataset.unscan));
}

async function beginCount(code){
  if(!LIVE){ toast('Stock counts need a live connection.', true); return; }
  try{
    COUNT = await sbRpc('open_count', {p:{location:code}});
    LASTSCAN = null;
    await loadCounts();
    render(); focusScan();
  }catch(e){ toast('Could not start the count. '+e.message, true); }
}

async function doScan(){
  const el = document.getElementById('scanin');
  if(!el) return;
  const raw = (el.value||'').trim();
  if(!raw){ el.focus(); return; }
  el.value = ''; el.disabled = true;
  try{
    const r = await sbRpc('scan_piece', {p:{count_id:COUNT.count_id, code:raw}});
    LASTSCAN = {verdict:r.verdict, code:r.code, note:r.note};
    if(r.state) COUNT = r.state;
    scanTone(r.verdict === 'FOUND');
  }catch(e){
    LASTSCAN = {verdict:'ERROR', code:raw.toUpperCase(), note:e.message};
    scanTone(false);
  }
  el.disabled = false;
  paintCount(); focusScan();
}

async function undoScan(code){
  try{
    COUNT = await sbRpc('unscan_piece', {p:{count_id:COUNT.count_id, code}});
    LASTSCAN = null;
    paintCount(); focusScan();
  }catch(e){ toast('Could not undo that. '+e.message, true); }
}

async function abandonCount(){
  if(!confirm('Abandon this count? Every scan on it is discarded and nothing is recorded.')) return;
  try{
    await sbRpc('close_count', {p:{count_id:COUNT.count_id, cancel:true}});
    COUNT = null; LASTSCAN = null;
    await loadCounts(); render();
    toast('Count abandoned.');
  }catch(e){ toast('Could not abandon it. '+e.message, true); }
}

async function finishCount(){
  const c = COUNT;
  if(c.missing && !confirm(
      `${c.missing} piece${c.missing===1?' is':'s are'} still unaccounted for. `
    + `Closing now records ${c.missing===1?'it':'them'} as missing. Close anyway?`)) return;
  let res;
  try{ res = await sbRpc('close_count', {p:{count_id:c.count_id}}); }
  catch(e){ toast('Could not close the count. '+e.message, true); return; }
  COUNT = null; LASTSCAN = null;
  try{ await loadCounts(); }catch(e){}
  render();
  countResultModal(res);
}

function countResultModal(r){
  const miss = r.missing_list || [], unex = r.unexpected_list || [];
  const clean = !miss.length && !unex.length;
  openModal(`
   <header><h3>${r.count_ref} — ${r.location_name}</h3>
     <p>${clean
        ? 'Everything the books expected here was on the shelf, and nothing else was.'
        : 'Every discrepancy falls out of one comparison: what the system expected at this location, against what was actually scanned.'}</p></header>
   <div class="content">
     <div class="ctally">

function pgReports(){
  const live=DB.jewels.filter(isLive);

  live.forEach(j=>{const k=j.loc||'—';(byLoc[k]=byLoc[k]||{n:0,v:0,un:0});

function doRepair(code){
  const j=DB.jewels.find(x=>x.code===code);
  const lineNo=+document.getElementById('rrm').value;
  const rmPcs=+document.getElementById('rrmpcs').value, rmQty=+document.getElementById('rrmqty').value;
  const addM=document.getElementById('radd').value;
  const addPcs=+document.getElementById('raddpcs').value, addQty=+document.getElementById('raddqty').value;
  const fault=document.getElementById('rfault').value||'Unspecified fault';
  const labour=+document.getElementById('rlab').value||0;
  const home=j.loc, today=new Date().toISOString().slice(0,10);

  const prev=curBom(j);
  const newLines=prev.lines.map(l=>({...l}));
  const tgt=newLines.find(l=>l.no===lineNo);
  if(tgt){ tgt.pcs=(tgt.pcs||0)-rmPcs; tgt.qty=+((tgt.qty||0)-rmQty).toFixed(4); }
  // Only the reduced line may drop out — and never a derived line such as
  // MAKING, whose qty is null by design and would otherwise read as zero.
  let lines=newLines.filter(l=>
    !(l.no===lineNo && l.basis==='BY_QTY' && (l.qty||0)<=0 && (l.pcs||0)<=0));

  const match=lines.find(l=>l.m===addM&&(l.band||'')==='');
  if(match){ match.pcs=(match.pcs||0)+addPcs; match.qty=+((match.qty||0)+addQty).toFixed(4); }
  else lines.push({no:Math.max(...lines.map(l=>l.no))+1,m:addM,band:'',pcs:addPcs,
                   qty:addQty,uom:DB.materials[addM].uom,basis:'BY_QTY'});

  const nv=j.ver+1;
  j.boms.push({v:nv,reason:'REPAIR',note:`Repair job RJ-${String(DB.nextRepair).padStart(4,'0')} — ${fault}`,
               when:today,lines});
  j.ver=nv;
  j.moves.push({t:'REPAIR_OUT',from:home,to:'WS1',state:'IN_REPAIR',when:today,by:role.toLowerCase(),why:fault});
  j.moves.push({t:'REPAIR_IN',from:'WS1',to:home,state:'IN_STOCK',when:today,by:role.toLowerCase(),why:'Repair completed'});
  j.state='IN_STOCK'; j.loc=home;
  DB.repairs.push({job:'RJ-'+String(DB.nextRepair).padStart(4,'0'),code,fault,from:nv-1,to:nv,
                   status:'DONE',labour,when:today});
  DB.nextRepair++;

  closeModal();
  const before=costBom(j,j.boms.find(b=>b.v===nv-1)), after=costed(j);
  detailTab='history'; render();
  toast(`<b>${code} repaired.</b> BOM forked v${nv-1} → v${nv}.
    ${can('cost')?`Cost ${inr(before.cost)} → ${inr(after.cost)}. v${nv-1} still reads ${inr(before.cost)}.`
    :'The old version is preserved.'}`);
}

function doMelt(code){
  const j=DB.jewels.find(x=>x.code===code);
  const reason=(document.getElementById('mreason').value||'').trim();
  if(!can('melt')){toast(`<b>Refused.</b> User role <b>${ROLES[role].name}</b> is not authorised to melt. Admin only.`,1);return;}
  if(reason.length<10){toast('<b>Refused.</b> A melt reason of at least 10 characters is required.',1);return;}
  if(!isLive(j)){toast(`<b>Refused.</b> ${code} is already ${j.state}.`,1);return;}
  const today=new Date().toISOString().slice(0,10);
  DB.melts.push({code,reason,cost:costed(j).cost,when:today,by:role.toLowerCase()});
  j.moves.push({t:'MELT',from:j.loc,to:null,state:'MELTED',when:today,by:role.toLowerCase(),why:reason});
  j.state='MELTED'; j.loc=null; j.disposed=today;
  audit('MELT',code,reason); closeModal(); page='melt'; sel=null; render();
  toast(`<b>${code} melted.</b> It is now terminal — any further movement will be refused.`);
}

function doLink(fromCode,toCode,kind){
  const A=DB.jewels.find(x=>x.code===fromCode), B=DB.jewels.find(x=>x.code===toCode);
  if(!A||!B) return;
  if(A.linked.some(l=>l.code===toCode)){toast('Already linked.',1);return;}
  A.linked.push({code:toCode,kind}); B.linked.push({code:fromCode,kind});
  toast(`<b>${fromCode} ↔ ${toCode}</b> linked as “${kind}”. It shows on both pieces.`);
}
function doUnlink(fromCode,toCode){
  const A=DB.jewels.find(x=>x.code===fromCode), B=DB.jewels.find(x=>x.code===toCode);
  if(A) A.linked=A.linked.filter(l=>l.code!==toCode);
  if(B) B.linked=B.linked.filter(l=>l.code!==fromCode);
  toast(`Link removed from both ${fromCode} and ${toCode}.`);
}

const IMPORT_COLS=['jewel_code','style_code','design_name','category','karat','colour',
  'gross_wt_gm','location','material','size_band','pcs','qty','uom'];

/* Deliberately contains four realistic errors so the validator has work to do. */
const SAMPLE_PASTE = [
 'ER00501,ER00135,Emerald floral polki earring,Earrings,14K,Yellow,10.544,MUM,G14K,,,9.55,GM',
 'ER00501,ER00135,Emerald floral polki earring,Earrings,14K,Yellow,10.544,MUM,FPL,+24-36,16,4.97,CT',
 'ER00501,ER00135,Emerald floral polki earring,Earrings,14K,Yellow,10.544,MUM,MAKING,,,,GM',
 'RG00610,RG00088,Solitaire halo ring,Rings,18K,White,6.100,KOL,G14K,,,5.20,CT',
 'RG00610,RG00088,Solitaire halo ring,Rings,18K,White,6.100,KOL,DTBFGH VS-SI,-2BG,30,0.58,CT',
 'NK00701,NK00510,Emerald choker,Necklaces,18K,Yellow,42.000,KOL,UNOBTANIUM,,2,3.00,CT',
 'ER00123,ER00135,Emerald floral polki earring,Earrings,14K,Yellow,12.370,MUM,G14K,,,9.51,GM',
 'BC00905,BC00701,Peacock brooch,Brooch,18K,Yellow,9.176,MUM,G14K,,,9.00,GM',
 'BC00905,BC00701,Peacock brooch,Brooch,18K,Yellow,9.176,MUM,DRKL SI-I,+2,8,0.88,CT'
].join('\n');

let importRows=null;
function validateImport(text){
  const rows=text.split('\n').map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const c=line.split(',').map(x=>x.trim());
    const r={} ; IMPORT_COLS.forEach((k,ix)=>r[k]=c[ix]??'');
    r._line=i+1; r._errors=[];
    if(!r.jewel_code) r._errors.push('jewel_code missing');
    if(DB.jewels.some(j=>j.code===r.jewel_code)) r._errors.push('jewel_code already exists');
    if(!DB.materials[r.material]) r._errors.push(`unknown material “${r.material}”`);
    else {
      const cls=DB.materials[r.material].cls;
      if(cls==='METAL' && r.uom!=='GM') r._errors.push(`metal must be GM, got ${r.uom}`);
      if(['DIAMOND','POLKI'].includes(cls) && !['CT','PCS'].includes(r.uom))
        r._errors.push(`${cls.toLowerCase()} must be CT, got ${r.uom}`);
    }
    if(!['14K','18K','22K','24K'].includes(r.karat)) r._errors.push(`unknown karat ${r.karat}`);
    if(!DB.locations[r.location]) r._errors.push(`unknown location ${r.location}`);
    return r;
  });
  // piece-level check: does the breakup reconcile to the stated gross weight?
  const byCode={};
  rows.forEach(r=>{ (byCode[r.jewel_code]=byCode[r.jewel_code]||[]).push(r); });
  Object.entries(byCode).forEach(([code,rs])=>{
    const g=+rs[0].gross_wt_gm||0;
    let w=0, ok=true;
    rs.forEach(r=>{ const m=DB.materials[r.material]; if(!m){ok=false;return}
      if(m.cls==='LABOUR') return;
      w += (+r.qty||0)*(GRAMS[r.uom]??0); });
    if(ok){ const d=Math.abs(g-w);
      if(d>0.05) rs.forEach(r=>r._errors.push(
        `breakup is ${w.toFixed(3)} g but gross weight says ${g.toFixed(3)} g (off by ${d.toFixed(3)})`)); }
  });
  return rows;
}

  karat:['karat','purity','metal_purity','kt'],
  colour:['metal_colour','metal_color','colour','color'],
  quality:['diamond_quality','quality'],
  gross_wt:['gross_wt_gm','gross_wt','gross_weight','grosswt','weight','gwt'],
  location:['location','loc','branch','showroom'],
  received_on:['received_on','receiveddate','received','date','fg_date'],
  huid:['huid','hallmark_id'], size:['size','size_label'],
  length_mm:['length_mm','length'], breadth_mm:['breadth_mm','breadth','width_mm','width'],
  height_mm:['height_mm','height','depth_mm'], remarks:['remarks','remark','notes','note'],
};
const UP_LINE = {
  jewel_code:['jewel_code','jewelcode','jewel','code','sku'],
  line_no:['line_no','line','sr','sr_no','srno'],
  material:['material_code','materialcode','material','item_code','item'],
  size_band:['size_band','sizeband','band','sieve'],
  pcs:['pcs','pieces','nos','qty_pcs'],
  qty:['qty','quantity','qty_value','weight','wt'],
  uom:['uom','unit','units'], basis:['basis','charged_on','charge_basis'],
  cost_rate:['cost_rate','costrate','rate','cost'], remarks:['remarks','remark','notes','note'],
};
function upHeader(grid, aliases){
  for(let r=0;r<Math.min(grid.length,15);r++){
    const cells=(grid[r]||[]).map(unorm);
    if(aliases.some(a=>cells.includes(a))) return r;
  } return -1;
}
function upMap(cells, hdr, spec){
  const out={};
  for(const [k,al] of Object.entries(spec)){
    const i=hdr.findIndex(h=>al.includes(h));
    if(i>=0){ const v=cells[i];
      out[k]=(v===null||v===undefined||String(v).trim()==='')?null:String(v).trim(); }
  } return out;
}
function upDate(v){
  if(!v) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d=new Date(v); return isNaN(d)?null:d.toISOString().slice(0,10);
}
/* ═══════════════ Reading a Gati export directly ═══════════════
   Their stock export is one wide row per piece: a block of piece
   columns, then one diamond line, one gold line, one stone line
   side by side. It is not reshaped by hand — the file is read as
   it comes out of Gati.

   Important: that layout can only carry ONE line of each kind. A
   piece with three diamond sizes still shows one. So after building
   the lines we add them up and compare with Gati's own Cost Price.
   If they do not agree, the bill of materials is marked a summary
   and the piece says so, instead of quietly claiming a cost that is
   too low. */
const GATI_MARKERS = ['jewelcode','item_name_diamond','style_no'];
function isGati(hdr){
  const h = hdr.map(unorm);
  return h.includes('jewelcode') && (h.includes('item_name_diamond')||h.includes('item_name_gold'));
}
/* the same heading appears several times in a Gati sheet (three "Cost Rate"
   columns, for example), so columns are taken by position within a block */
function gatiIndex(hdr){
  const h=hdr.map(unorm), at=(name,from=0)=>{ for(let i=from;i<h.length;i++) if(h[i]===name) return i; return -1; };
  const dStart = at('item_name_diamond')-1, gStart = at('item_name_gold')-1, sStart = at('stone');
  return {
    jewel:at('jewelcode'), style:at('style_no'), cat:at('category'), sub:at('sub_category'),
    loc:at('location_name'), inw:at('inw_date'), manuf:at('manuf_name'), coll:at('collection'),
    isize:at('item_size'), remarks:at('remarks'), misc:at('misc_remarks'),
    d:{code:dStart, name:dStart+1, quality:dStart+4, gsize:dStart+5, size:dStart+6,
       pcs:dStart+9, wt:dStart+10, crate:dStart+12, srate:dStart+13, cost:dStart+14, sale:dStart+15},
    g:{code:gStart, name:gStart+1, gross:gStart+2, net:gStart+3, pure:gStart+5,
       crate:gStart+7, srate:gStart+8, cost:gStart+9, sale:gStart+10},
    s:{code:sStart, name:sStart+1, pcs:sStart+2, wt:sStart+3, crate:sStart+5,
       srate:sStart+6, cost:sStart+7, sale:sStart+8},
    costPrice:at('cost_price'), salePrice:at('sale_price'),
    costMaking:at('cost_making_amt'), saleMaking:at('sale_making_amt'),
    gqly:at('g_qly'), tag:at('tagprice'), totNet:at('tot_net_wt'), jewelId:at('jewelid'),
    ecName:at('item_name',at('g_qly')), ecAmt:at('amt'),
  };
}
const gnum = v => { const n=parseFloat(String(v??'').replace(/,/g,'')); return isFinite(n)?n:0; };
function gatiKarat(qly, code){
  const raw = String(qly||'').trim() || String(code||'').replace(/^G/i,'');
  const m = raw.match(/(\d{2,3})\s*(K|KT)?/i);
  if(!m) return null;
  const n = m[1];
  if(['9','10','14','18','20','21','22','23','24'].includes(n)) return n+'K';
  if(n==='925') return '925';
  return null;
}
function parseGati(grid, hdrRow, fileName){
  const hdr=grid[hdrRow]||[], X=gatiIndex(hdr);
  const cell=(row,i)=> (i>=0 && row[i]!==null && row[i]!==undefined) ? String(row[i]).trim() : '';
  const pieces=[], byCode={}, problems=[];
  const flag=(rec,msg)=>{ if(rec)(rec._problems=rec._problems||[]).push(msg); problems.push(msg); };
  let lineCount=0, summaryCount=0;

  for(let r=hdrRow+1;r<grid.length;r++){
    const row=grid[r]||[]; const code=cell(row,X.jewel).toUpperCase();
    if(!code) continue;
    if(byCode[code]){
      problems.push(`${code} appears on more than one row. Gati exported it twice — only the first was kept.`);
      continue;
    }
    const karat = gatiKarat(cell(row,X.gqly), cell(row,X.g.code));
    const p = {
      jewel_code:code,
      style_code:(cell(row,X.style)||code).toUpperCase(),
      category:cell(row,X.cat), sub_category:cell(row,X.sub),
      collection:cell(row,X.coll), size:cell(row,X.isize),
      location:cell(row,X.loc)||null,
      received_on:upDate(cell(row,X.inw)),
      vendor:cell(row,X.manuf)||null,
      quality:cell(row,X.d.quality)||null,
      karat, gross_wt:gnum(row[X.g.gross])||null,
      remarks:[cell(row,X.remarks),cell(row,X.misc)].filter(Boolean).join(' · ')||null,
      src_system:'GATI', src_ref:cell(row,X.jewelId)||null,
      src_cost_price:gnum(row[X.costPrice])||null,
      src_sale_price:gnum(row[X.salePrice])||null,
      src_tag_price:gnum(row[X.tag])||null,
      src_net_wt_gm:gnum(row[X.totNet])||null,
      lines:[]
    };
    if(!karat && cell(row,X.gqly))
      flag(p, `${code}: metal quality "${cell(row,X.gqly)}" is not a karat this system knows, so the karat was left blank. Everything else still comes in.`);

    const push = (blk, cls, uom) => {
      const mcode=cell(row,blk.code), wt=gnum(row[blk.wt!==undefined?blk.wt:blk.net]);
      const pcs=blk.pcs!==undefined?gnum(row[blk.pcs]):0;
      if(!mcode || (wt<=0 && pcs<=0)) return;
      const L={material:mcode, material_name:cell(row,blk.name)||mcode,
               material_class:cls, uom, qty:wt||null};
      if(pcs>0) L.pcs=pcs;
      const cr=gnum(row[blk.crate]), sr=gnum(row[blk.srate]);
      if(cr>0) L.cost_rate=cr;
      if(sr>0 && cls!=='METAL') L.sale_rate=sr;
      if(blk===X.d){ const band=cell(row,blk.size)||cell(row,blk.gsize);
                     if(band && band!=='0') L.size_band=band; }
      p.lines.push(L); lineCount++;
    };
    push(X.d,'DIAMOND','CT');
    if(gnum(row[X.g.net])>0){
      p.lines.push({material:cell(row,X.g.code)||'G', material_name:cell(row,X.g.name)||'Gold',
        material_class:'METAL', uom:'GM', qty:gnum(row[X.g.net]),
        cost_rate:gnum(row[X.g.crate])||null});
      lineCount++;
    }
    push(X.s,'COLOUR_STONE','CT');

    const net = gnum(row[X.totNet]) || gnum(row[X.g.net]);
    const cmk = gnum(row[X.costMaking]), smk = gnum(row[X.saleMaking]);
    if(net>0 && (cmk>0||smk>0)){
      p.lines.push({material:'MAKING', material_name:'Making Charge', material_class:'LABOUR',
        uom:'GM', basis:'BY_NET_METAL_WT',
        cost_rate:cmk>0?+(cmk/net).toFixed(4):null, sale_rate:smk>0?+(smk/net).toFixed(4):null});
      lineCount++;
    }

    /* does the sheet's own breakup add up to the sheet's own cost? */
    const shown = gnum(row[X.d.cost]) + gnum(row[X.g.cost]) + gnum(row[X.s.cost]) + cmk;
    const cp = gnum(row[X.costPrice]);
    p.bom_is_summary = !(cp>0 && Math.abs(shown-cp) <= 1);
    if(p.bom_is_summary && cp>0){
      p._short = cp - shown;
      summaryCount++;
    }
    byCode[code]=p; pieces.push(p);
  }

  /* reference checks — materials are registered automatically, so the only
     things that can still refuse a row are category, karat and location */
  const cats=new Set((REF.category||[]).flatMap(c=>[c.code.toUpperCase(),c.label.toUpperCase(),
                     c.label.toUpperCase().replace(/S$/,'')]));
  const locs=new Set((REF.location||[]).flatMap(l=>[l.code.toUpperCase(),l.label.toUpperCase()]));
  const known=new Set(DB.jewels.map(j=>j.code));
  const sty =new Set((REF.style||[]).map(x=>x.code));
  pieces.forEach(p=>{
    if(p.location && !locs.has(p.location.toUpperCase())){
      flag(p,`${p.jewel_code}: location "${p.location}" is not one of ${(REF.location||[]).map(l=>l.code).join(', ')}.`);
    }
    const isNew=!known.has(p.jewel_code);
    const catOk = p.category && cats.has(p.category.toUpperCase().replace(/S$/,''));
    if(isNew && !sty.has(p.style_code) && !catOk)
      flag(p,`${p.jewel_code}: design ${p.style_code} is new and its category "${p.category||'(blank)'}" is not one of yours.`);
  });
  return {fileName, pieces, lineCount, problems, sheet:'Gati export', gati:true, summaryCount};
}

function parseWorkbook(buf, fileName){
  const wb=XLSX.read(buf,{type:'array'});
  const pick=w=>wb.SheetNames.find(n=>unorm(n).includes(w));
  /* a Gati export is recognised on its own and read as it comes */
  for(const nm of wb.SheetNames){
    const grid=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:null,blankrows:false});
    for(let r=0;r<Math.min(grid.length,12);r++){
      if(isGati((grid[r]||[]).map(x=>x??''))) return parseGati(grid, r, fileName);
    }
  }
  const pS=pick('piece')||wb.SheetNames[0], lS=pick('bom')||pick('material');
  const pg=XLSX.utils.sheet_to_json(wb.Sheets[pS],{header:1,raw:false,defval:null,blankrows:false});
  const ph=upHeader(pg,UP_PIECE.jewel_code);
  if(ph<0) throw new Error(`No "jewel_code" column found on sheet "${pS}".`);
  const phdr=(pg[ph]||[]).map(unorm);

  const problems=[], byCode={}, pieces=[];
  const flag=(rec,msg)=>{ if(rec)(rec._problems=rec._problems||[]).push(msg); problems.push(msg); };
  for(let r=ph+1;r<pg.length;r++){
    const rec=upMap(pg[r]||[],phdr,UP_PIECE);
    if(!rec.jewel_code) continue;
    if(String(rec.remarks||'').toLowerCase().startsWith('example row')) continue;
    rec.jewel_code=rec.jewel_code.toUpperCase();
    if(byCode[rec.jewel_code]){
      problems.push(`${rec.jewel_code} appears more than once on the pieces sheet. One jewel code is one physical piece — only the first row was kept.`);
      continue;
    }
    rec.received_on=upDate(rec.received_on); rec.lines=[];
    byCode[rec.jewel_code]=rec; pieces.push(rec);
  }
  let lineCount=0;
  if(lS){
    const lg=XLSX.utils.sheet_to_json(wb.Sheets[lS],{header:1,raw:false,defval:null,blankrows:false});
    const lh=upHeader(lg,UP_LINE.jewel_code);
    if(lh>=0){ const lhdr=(lg[lh]||[]).map(unorm);
      for(let r=lh+1;r<lg.length;r++){
        const rec=upMap(lg[r]||[],lhdr,UP_LINE);
        if(!rec.jewel_code||!rec.material) continue;
        const code=rec.jewel_code.toUpperCase();
        if(!byCode[code]){ problems.push(`${code} has materials on the "${lS}" sheet but no row on the pieces sheet, so they have nowhere to go.`); continue; }
        const L={material:rec.material.toUpperCase()};
        ['size_band','pcs','qty','remarks'].forEach(k=>{ if(rec[k]) L[k]=rec[k]; });
        if(rec.uom) L.uom=rec.uom.toUpperCase();
        if(rec.basis) L.basis=rec.basis.toUpperCase();
        if(rec.cost_rate) L.cost_rate=rec.cost_rate;
        byCode[code].lines.push(L); lineCount++;
      }
    }
  }
  const mats=new Set((REF.material||[]).map(m=>m.code));
  const cats=new Set((REF.category||[]).flatMap(c=>[c.code.toUpperCase(),c.label.toUpperCase()]));
  const locs=new Set((REF.location||[]).flatMap(l=>[l.code.toUpperCase(),l.label.toUpperCase()]));
  const kars=new Set((REF.karat||[]).map(k=>k.code));
  const sty =new Set((REF.style||[]).map(x=>x.code));
  const known=new Set(DB.jewels.map(j=>j.code));
  pieces.forEach(p=>{
    if(p.karat && !kars.has(p.karat.toUpperCase()))
      flag(p,`${p.jewel_code}: karat "${p.karat}" is not set up. Known: ${[...kars].join(', ')}.`);
    if(p.location && !locs.has(p.location.toUpperCase()))
      flag(p,`${p.jewel_code}: location "${p.location}" is not one of ${(REF.location||[]).map(l=>l.code).join(', ')}.`);
    const isNew=!known.has(p.jewel_code);
    if(isNew && !(p.style_code&&sty.has(p.style_code.toUpperCase()))
             && !(p.category&&cats.has(p.category.toUpperCase())))
      flag(p,`${p.jewel_code}: the design "${p.style_code||'—'}" is new, so it needs a category. "${p.category||'(blank)'}" is not one of yours.`);
    p.lines.forEach((l,i)=>{ if(!mats.has(l.material))
      flag(p,`${p.jewel_code} line ${i+1}: material "${l.material}" is not in your material master. The whole piece is refused rather than entered with a line missing, which would give it a wrong cost.`); });
  });
  return {fileName, pieces, lineCount, problems, sheet:pS};
}
function upVerdict(p){
  if(p._problems&&p._problems.length) return {k:'bad',t:'Will be refused'};
  const cur=DB.jewels.find(x=>x.code===p.jewel_code);
  if(!cur) return {k:'new',t:'New piece'};
  const will=[];
  if(p.karat && (!cur.purity||cur._missing.includes('Karat'))) will.push('karat');
  if(p.gross_wt && !cur.grossWt) will.push('gross weight');
  if(p.lines.length && !curBom(cur).lines.length) will.push('materials');
  if(p.location && cur.state==='NOT_RECEIVED') will.push('receive into '+p.location.toUpperCase());
  return will.length?{k:'fill',t:'Fill in: '+will.join(', ')}:{k:'same',t:'Already has all of this'};
}
function takeWorkbook(f){
  const rd=new FileReader();
  rd.onload=e=>{
    try{ upFile=parseWorkbook(new Uint8Array(e.target.result), f.name); upReport=null;
      if(!upFile.pieces.length) throw new Error('No rows with a jewel code were found.');
      render();
    }catch(err){ upFile=null; render(); toast('Could not read that file. '+err.message, true); }
  };
  rd.readAsArrayBuffer(f);
}
async function runUpload(overwrite){
  const send=upFile.pieces.filter(p=>!(p._problems&&p._problems.length));
  const rows=[], agg={added:0,filled:0,unchanged:0,rejected:0};
  upFile.pieces.filter(p=>p._problems&&p._problems.length).forEach(p=>{
    rows.push({jewel_code:p.jewel_code,action:'rejected',error:p._problems.join(' ')}); agg.rejected++; });
  const B=25;
  for(let i=0;i<send.length;i+=B){
    const chunk=send.slice(i,i+B).map(p=>{
      const o={}; Object.entries(p).forEach(([k,v])=>{
        if(v!==null&&v!==undefined&&v!==''&&!k.startsWith('_')) o[k]=v; });
      o.lines=p.lines; return o; });
    const rep=await sbRpc('import_pieces',{p:chunk, p_mode: overwrite?'overwrite':'fill'});
    agg.added+=rep.added; agg.filled+=rep.filled; agg.unchanged+=rep.unchanged;
    agg.rejected+=rep.rejected; rows.push(...rep.rows);
  }
  upReport={...agg, rows}; upFile=null;
  await liveRefresh();
  toast(`Upload done — <b>${agg.added} added</b>, ${agg.filled} filled in, `
      + `${agg.unchanged} unchanged, ${agg.rejected} refused.`);
}

function download(name,text){

/* =====================================================================
   MINIMAL XLSX WRITER — a real .xlsx is a zip of XML. No CDN, no
   dependency, works offline. Strings are written inline; text columns
   are forced to string type so ER00123 can never become a date.
   ===================================================================== */
const CRC=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};})();
const enc=str=>new TextEncoder().encode(str);
function zipStore(files){          // files: [{name, data:Uint8Array}]
  const parts=[],central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const nb=enc(f.name), crc=CRC(f.data), sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off += lh.length+nb.length+sz;
  });
  const cs=central.reduce((a,b)=>a+b.length,0);
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  const all=[...parts,...central,eocd];
  const total=all.reduce((a,b)=>a+b.length,0);
  const out=new Uint8Array(total); let p=0;
  all.forEach(b=>{out.set(b,p);p+=b.length});
  return out;
}
const xesc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                       .replace(/"/g,'&quot;').replace(/\x00-\x08|\x0B|\x0C|\x0E-\x1F/g,'');
const colName=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;};
/* cell: number | string | {link:url,text:label} */
function sheetXml(rows){
  const body=rows.map((row,r)=>{
    const cells=row.map((c,i)=>{
      const ref=colName(i)+(r+1);
      if(c==null||c==='') return '';
      if(typeof c==='object'&&c.link)
        return `<c r="${ref}" t="str"><f>HYPERLINK("${xesc(c.link)}","${xesc(c.text||'open')}")</f></c>`;
      if(typeof c==='number'&&isFinite(c)) return `<c r="${ref}"><v>${c}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(c)}</t></is></c>`;
    }).join('');
    return `<row r="${r+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetData>${body}</sheetData></worksheet>`;
}
function writeXlsx(sheets){        // sheets: [{name, rows}]
  const f=[];
  const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`;
  f.push({name:'[Content_Types].xml',data:enc(types)});
  f.push({name:'_rels/.rels',data:enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

/* =====================================================================
   MEDIA REGISTRY
   The join key is media_id, and it is baked into the FILENAME.
   URLs are signed and expire — joining an Excel back to files on a URL
   is how a media library gets orphaned. Filename + checksum survive.
   ===================================================================== */
const KINDS=[['PHOTO','FRONT',1,'jpg'],['PHOTO','SIDE',2,'jpg'],['PHOTO','ON_MODEL',3,'jpg'],
             ['VIDEO','SPIN_360',4,'mp4'],['CAD','RENDER',5,'3dm'],['CERTIFICATE','SCAN',6,'pdf']];
const BUCKET='https://media.nornament.live';
/* media_id must be GLOBALLY unique and never reused. An id derived from a
   hash of the jewel code collides — and a collision silently attaches one
   piece's photographs to another. Ids are issued from one sequence. */
let MEDIA_SEQ=0, MEDIA_IDX={};
function mediaFor(j){
  if(MEDIA_IDX[j.code]) return MEDIA_IDX[j.code];
  const base=[...j.code].reduce((a,c)=>a+c.charCodeAt(0),0);
  const out=KINDS.map(([kind,angle,rank,ext],i)=>{
    const id='M'+String(++MEDIA_SEQ).padStart(6,'0');
    const sha=((base*(i+13)*2654435761)>>>0).toString(16).padStart(8,'0').slice(0,12);
    const file=`${j.code}__${kind}__r${rank}__${id}.${ext}`;
    const mb=kind==='VIDEO'?110+(base%40):kind==='CAD'?70+(base%50):18+(base%14);
    return {media_id:id,jewel_code:j.code,kind,view_angle:angle,rank,file_name:file,
      sha256:sha,size_mb:mb,
      original:`${BUCKET}/original/${j.code}/${file}?sig=EXPIRES-7D`,
      card:`${BUCKET}/card/${j.code}/${id}.webp`,
      thumb:`${BUCKET}/thumb/${j.code}/${id}.webp`,
      uploaded_by:'graphic1',uploaded_at:j.received};
  });
  MEDIA_IDX[j.code]=out; return out;
}
const allMedia=()=>DB.jewels.flatMap(mediaFor);
/* guard: if this ever fires, the join key is broken */
function assertMediaUnique(){
  const ids=allMedia().map(m=>m.media_id);
  return {total:ids.length, unique:new Set(ids).size, ok:new Set(ids).size===ids.length};
}

/* ---------- reconnect: match a folder listing back to the registry ---------- */
let relinkResult=null;
function relink(text){
  const reg={}; allMedia().forEach(x=>{reg[x.media_id]=x});
  const byName={}; allMedia().forEach(x=>{byName[x.file_name]=x});
  const seen=new Set();
  const rows=text.split('\n').map(l=>l.trim()).filter(Boolean).map(name=>{
    const idm=name.match(/__(M\d{6})\./);
    let hit=null,how='';
    if(idm&&reg[idm[1]]){hit=reg[idm[1]];how='media_id in filename';}
    else if(byName[name]){hit=byName[name];how='exact filename';}
    if(hit) seen.add(hit.media_id);
    return {name,hit,how,
      renamed: hit && hit.file_name!==name,
      status: hit ? (hit.file_name===name?'MATCHED':'MATCHED (renamed)') : 'ORPHAN'};
  });
  const missing=allMedia().filter(x=>!seen.has(x.media_id));
  return {rows,missing};
}
const SAMPLE_FILES=()=>{
  const all=allMedia().slice(0,6).map(x=>x.file_name);
  return [
    all[0],
    all[1].replace(/^/,'copy of '),                    // renamed by someone — still matches on media_id
    all[2],
    'IMG_4471.jpg',                                    // orphan: no media_id anywhere
    all[4]
  ].join('\n');
};

  if(!date){toast('A date is required.',1);return}
  if(!who){toast('A customer name is required — it is your fallback if the code is wrong.',1);return}

        expected — the receipt date is when it was imported, not when it was made.
        <label style="display:flex;gap:9px;align-items:flex-start;margin-top:10px;cursor:pointer">
          <input type="checkbox" id="ps-ack" style="margin-top:3px">
          <span>Back-date the receipt to ${date} as well, and mark it estimated.</span></label></div>`;
      toast('The sale predates the receipt — confirm how to handle it.',1); return;
    }
    j.received=date;
    const rec=j.moves.find(m=>m.t==='RECEIPT');
    if(rec){ rec.when=date; rec.why='Receipt back-dated to match a recorded past sale (estimated)'; }
  }

  j.sales.push({date,who,phone:(g('ps-phone').value||'').trim(),
    custCode:(g('ps-cust').value||'').trim(),
    crm:(g('ps-cust').value||'').trim()?'UNLINKED':'NO_CODE',
    price, cost: costRaw===''?null:+costRaw, loc:g('ps-loc').value, source:src});
  j.sales.sort((a,b)=>a.date.localeCompare(b.date));

  const close=g('ps-close');
  if(close&&close.checked){
    j.moves.push({t:'SALE',from:j.loc,to:null,state:'SOLD',when:date,by:role.toLowerCase(),
      why:`Back-dated sale entry (${SALE_SOURCE[src][1]})`});
    j.moves.sort((a,b)=>a.when.localeCompare(b.when));
    j.state='SOLD'; j.loc=null; j.disposed=date;
  }
  audit('PAST_SALE_ADDED',code,`${date} · ${who} · ${inr(price)} · ${SALE_SOURCE[src][1]}`);
  closeModal(); detailTab='history'; render();
  toast(`Past sale recorded on ${code}${src==='MEMORY'?' — flagged <b>unverified</b>':''}.`);
}

  const j=DB.jewels.find(x=>x.code===code), s=j.sales[idx];
  openModal(`
   <header><h3>Reverse a sale entry — ${code}</h3>

       <textarea id="rv-why" rows="3" placeholder="e.g. Entered against the wrong jewel code — the piece sold was ER00125."></textarea></div>
     <div class="note">If this sale is what closed the piece, reversing it puts ${code} back
       <b>in stock</b> at ${DB.locations[s.loc]||'its last location'}, and the movement ledger will show
       both the sale and its reversal. The gap is the point — a piece that briefly showed as sold
       and came back is a fact someone may need to explain.</div>

   <footer><button class="btn" onclick="closeModal()">Cancel</button>

function doReverse(code,idx){
  const j=DB.jewels.find(x=>x.code===code), s=j.sales[idx];
  const why=(document.getElementById('rv-why').value||'').trim();
  if(why.length<10){toast('A reason of at least 10 characters is required.',1);return}
  const today=new Date().toISOString().slice(0,10);

  s.reversed=true; s.reversedOn=today; s.reversedBy=role.toLowerCase(); s.reversedWhy=why;
  j.sales.push({date:today,who:s.who,phone:s.phone,custCode:s.custCode,crm:s.crm,
    price:-s.price, cost:s.cost==null?null:-s.cost, loc:s.loc,
    source:s.source, isReversal:true, of:s.date, why});

  if(j.state==='SOLD'){
    j.moves.push({t:'SALE_RETURN',from:null,to:s.loc,state:'IN_STOCK',when:today,
      by:role.toLowerCase(),why:`Reversal of sale dated ${s.date} — ${why}`});
    j.state='IN_STOCK'; j.loc=s.loc; j.disposed=null;
  }
  audit('SALE_REVERSED',code,`Sale of ${inr(s.price)} dated ${s.date} reversed — ${why}`);
  closeModal(); render();
  toast(`<b>Reversal written.</b> The original entry is still on ${code}, marked reversed.`);
}

/* ---------------------------------------------------------------------
   EXPORT AUDIT — who, when, from where, and WHAT WAS IN IT.
   --------------------------------------------------------------------- */
function logExport(kind,sheets,note){
  const id='EXP-'+String(++EXPORT_SEQ).padStart(4,'0')+'-'+
    Math.abs([...(role+kind)].reduce((a,c)=>a*31+c.charCodeAt(0),7)%9973).toString(36).toUpperCase();
  const rows=sheets.reduce((n,s)=>n+Math.max(0,s.rows.length-1),0);
  audit('EXPORT',kind,note||'',{exportId:id,rows,
    sheets:sheets.map(s=>`${s.name} (${s.rows.length-1})`).join(', '),
    includedCost:can('cost')?'YES':'no', includedMargin:can('margin')?'YES':'no'});
  return id;
}
function pgAudit(){
  const f=AUDIT;
  return `
  <div class="card">
    <div class="spread"><div><h3>Audit log</h3>
      <p class="hint" style="margin:0">Append only. Nothing here can be edited or deleted from the
        interface — including by you.</p></div>
      <button class="btn" id="exp-audit">⇩ Export the log</button></div>
    ${f.length?`<table style="margin-top:12px"><thead><tr><th>When</th><th>Who</th><th>Action</th>
      <th>On</th><th>Detail</th><th>From</th></tr></thead><tbody>
    ${f.map(a=>`<tr>
      <td class="dim mono" style="font-size:12px">${a.ts}</td>
      <td>${a.user}<br><span class="dim" style="font-size:11.5px">${a.role}</span></td>
      <td><span class="chip ${a.action==='EXPORT'?'c-warn':a.action==='SALE_REVERSED'?'c-crit':'c-neutral'}">
        ${a.action.replace(/_/g,' ').toLowerCase()}</span></td>
      <td class="code" style="font-size:12px">${a.entity}</td>
      <td style="font-size:12.5px">${a.detail||''}
        ${a.exportId?`<br><span class="dim" style="font-size:11.5px">
          <b>${a.exportId}</b> · ${a.rows} rows · ${a.sheets}<br>
          cost columns: ${a.includedCost} · margin: ${a.includedMargin}</span>`:''}</td>
      <td class="dim" style="font-size:11.5px">${a.ip}<br>${a.agent}<br>${a.device}</td>
    </tr>`).join('')}
    </tbody></table>`:`<div class="empty">Nothing logged yet this session. Run an export or reverse a sale.</div>`}
    <div class="note"><b>“Who downloaded” on its own is close to useless.</b> Knowing that someone exported
      at 3pm does not tell you whether they took five rows or your entire cost book. Every export row
      records the sheet names, the row counts, and whether cost and margin columns were in the file.</div>
    <div class="note"><b>Each export carries its own id, and that id is written into the file.</b>
      Open the Reference sheet of any export and you will find ${'`export_id`'} — so a workbook that turns
      up somewhere it should not can be traced back to one download, one person, one machine.</div>
    <div class="note bad">The IP, browser and device above are shown as the server would capture them.
      A browser cannot know its own public IP, and anything the client reports can be forged — so in the
      real build these are written by the server at request time and never accepted from the page.</div>
  </div>`;
}

/* =====================================================================
   RENDER
   ===================================================================== */
const TITLES={dash:'Dashboard',stock:'Stock',count:'Stock Count',repairs:'Repairs',
  melt:'Melt',styles:'Design Library',reports:'Reports & Margin',
  data:'Import / Export',audit:'Audit Log',admin:'Users & Settings'};

function render(){
  if(!ROLES[role].tabs.includes(page)) page=ROLES[role].tabs[0];
  renderNav(); renderTicker(); renderBrand(); renderLiveFlag();
  document.getElementById('pagetitle').textContent = sel?sel:TITLES[page];
  const v=document.getElementById('view');
  if(sel) v.innerHTML=pgDetail();
  else v.innerHTML=({dash:pgDashboard,stock:pgStock,count:pgCount,repairs:pgRepairs,
    melt:pgMelt,styles:pgStyles,reports:pgReports,data:pgData,
    audit:pgAudit,admin:pgAdmin}[page]||pgDashboard)();

  v.querySelectorAll('[data-code]').forEach(r=>
    r.onclick=async ()=>{
      sel=r.dataset.code; detailTab='overview';
      if(LIVE){ try{ await loadPieceDetail(sel); }catch(e){ toast('Could not load that piece. '+e.message,true); } }
      render();
    });
  v.querySelectorAll('.tabs button[data-tab]').forEach(b=>
    b.onclick=()=>{detailTab=b.dataset.tab;render()});
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(LIVE && a==='editbom') return liveBomModal(sel);
    if(LIVE && ['repair','melt','pastsale','sellvid','addpoint','link'].includes(a))
      return liveBlocked({repair:'Send for repair',melt:'Melt',editbom:'Edit BOM',
        pastsale:'Add a past sale',sellvid:'Upload a video',addpoint:'Talking points',
        link:'Linking pieces'}[a]);
    if(a==='delete')  return deleteModal(sel);
    if(b.dataset.act==='repair') repairModal(sel);
    if(b.dataset.act==='melt') meltModal(sel);
    if(b.dataset.act==='compare') compareModal(sel);
    if(b.dataset.act==='link') linkModal(sel);
    if(b.dataset.act==='sellvid') sellVideoModal(sel);
    if(b.dataset.act==='addpoint') addPointModal(sel);
    if(b.dataset.act==='editbom') editBomModal(sel);
    if(b.dataset.act==='pastsale') pastSaleModal(sel);
  });
  v.querySelectorAll('[data-link]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();
    doLink(sel,btn.dataset.link,'Goes with'); render();});
  v.querySelectorAll('[data-rev]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();
    reverseSaleModal(sel,+btn.dataset.rev);});
  v.querySelectorAll('[data-unlink]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();
    doUnlink(sel,btn.dataset.unlink); render();});
  /* live upload wiring */
  const dz=document.getElementById('dropzone'), fi=document.getElementById('upfile');
  if(dz&&fi){
    dz.onclick=()=>fi.click();
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');
      if(e.dataTransfer.files[0]) takeWorkbook(e.dataTransfer.files[0]);};
    fi.onchange=e=>{ if(e.target.files[0]) takeWorkbook(e.target.files[0]); };
  }
  const ug=document.getElementById('upgo');
  if(ug) ug.onclick=async()=>{ ug.disabled=true; ug.textContent='Importing…';
    try{ await runUpload(document.getElementById('upover').checked); }
    catch(err){ toast('Import stopped. '+err.message,true);
      ug.disabled=false; ug.textContent='Try again'; } };

  bindEdits();
  if(page==='admin' && setTab==='access') drawAccess();
  if(page==='admin' && setTab==='users')  drawUsers();
  if(page==='admin' && setTab==='locs')   drawLocs();
  if(page==='admin' && setTab==='mats')   drawMats();
  if(page==='admin' && setTab==='charts') drawCharts();
  if(page==='admin' && setTab==='scen')   drawScenarios();
  { const mr=document.getElementById('mk_rate'), mb=document.getElementById('mk_basis');
    const save = async (key,val,onOk) => {
      try{ await sbRpc('set_setting',{p:{key,value:String(val)}}); onOk();
           toast('Making default saved. Existing lines are untouched.'); }
      catch(e){ toast(e.message, true); render(); } };
    if(mr) mr.onchange = () => save('making_rate_default', mr.value, ()=>{ MAKING_RATE=+mr.value; });
    if(mb) mb.onchange = () => save('making_basis_default', mb.value, ()=>{ MAKING_BASIS=mb.value; }); }
  if(page==='stock' && sel && detailTab==='pricing') drawPieceScenarios(sel);
  { const ep=document.getElementById('editpiece');
    if(ep) ep.onclick=()=>editPieceModal(sel); }
  { const rb=document.getElementById('refresh-chart');
    if(rb) rb.onclick=()=>refreshFromChart(sel); }
  if(page==='admin' && setTab==='cats')   drawCats();
  /* Each kind has its own add tile; the picker only offers that kind's file
     types, and the kind decides whether it lands on the piece or the design. */
  const mf = document.getElementById('mfile');
  document.querySelectorAll('.madd').forEach(btn => btn.onclick = () => {
    const spec = MEDIA_KINDS.find(x => x.k === btn.dataset.kind);
    if(!mf || !spec) return;
    mf.accept = spec.accept;
    mf.onchange = async e => {
      const files=[...e.target.files]; e.target.value='';
      if(!files.length) return;
      const j = DB.jewels.find(x=>x.code===sel);
      const label = btn.querySelector('.maddlabel');
      const was = label.textContent; label.textContent = 'Uploading…'; btn.disabled = true;
      try{
        const n = await uploadFiles(files, j.code, j.style, spec.k);
        await loadMedia(); render();
        toast(`<b>${n}</b> ${spec.label.toLowerCase()} file${n===1?'':'s'} uploaded.`);
      }catch(err){
        toast('Upload failed. '+err.message, true);
        label.textContent = was; btn.disabled = false;
      }
    };
    mf.click();
  });

  document.querySelectorAll('[data-dl]').forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); downloadMedia(a.dataset.dl); });
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=ev=>{
    ev.preventDefault(); openViewer(el.dataset.open); });
  document.querySelectorAll('[data-hero]').forEach(a=>a.onclick=async ev=>{
    ev.preventDefault();
    try{
      await sbRpc('set_display_photo',{p:{media_ref:a.dataset.hero}});
      await loadMedia(); render(); toast('Display picture set.');
    }catch(err){ toast('Not set. '+err.message, true); }
  });
  document.querySelectorAll('[data-unhero]').forEach(a=>a.onclick=async ev=>{
    ev.preventDefault();
    try{
      await sbRpc('clear_display_photo',{p:{jewel_code:a.dataset.unhero}});
      await loadMedia(); render(); toast('Display picture cleared.');
    }catch(err){ toast(err.message, true); }
  });
  const dlall=document.getElementById('mdlall');
  if(dlall) dlall.onclick=()=>downloadAll(sel);
  document.querySelectorAll('[data-drop]').forEach(a=>a.onclick=async ev=>{
    ev.preventDefault();
    if(!confirm('Remove this file from the piece? The object stays in R2.')) return;
    try{ await sbRpc('detach_media',{p:{media_ref:a.dataset.drop}});
         await loadMedia(); render(); toast('Removed.'); }
    catch(err){ toast('Not removed. '+err.message, true); }
  });
  const ap=document.getElementById('addpiece');
  if(ap) ap.onclick=newPieceModal;

  /* ---- stock count ---- */
  v.querySelectorAll('[data-startloc]').forEach(b =>
    b.onclick = () => beginCount(b.dataset.startloc));
  v.querySelectorAll('[data-openresult]').forEach(r =>
    r.onclick = () => { const c = COUNTS.find(x => x.count_id == r.dataset.openresult);
                        if(c && c.result) countResultModal(c.result); });
  const si = document.getElementById('scanin');
  if(si){
    si.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); doScan(); } };
    setTimeout(focusScan, 0);
  }
  const sg = document.getElementById('scango');   if(sg) sg.onclick = doScan;
  const stg= document.getElementById('soundtog');
  if(stg) stg.onclick = () => { SCANSOUND = !SCANSOUND;
                                stg.textContent = 'Sound ' + (SCANSOUND?'on':'off');
                                toast(SCANSOUND?'A tone on every scan.':'Scans are silent now.'); };
  const cc = document.getElementById('countcancel'); if(cc) cc.onclick = abandonCount;
  const fc = document.getElementById('countfinish'); if(fc) fc.onclick = finishCount;
  if(document.getElementById('cpanel')) wireCountPanel();
  v.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{setTab=b.dataset.stab;render()});
  v.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{
    const r=b.dataset.role, c=b.dataset.cap;
    ROLES[r][c]=ROLES[r][c]?0:1;
    audit('PERMISSION_CHANGED',`${ROLES[r].name}`,`${c} → ${ROLES[r][c]?'YES':'no'}`);
    render();
    toast(`<b>${ROLES[r].name}</b> ${ROLES[r][c]?'can now':'can no longer'} ${c==='cost'?'see cost prices':c==='melt'?'melt pieces':'use “'+c+'”'}.`,
      ROLES[r][c]&&(c==='cost'||c==='melt'||c==='margin'));});
  v.querySelectorAll('[data-tab2]').forEach(b=>b.onclick=()=>{
    const r=b.dataset.role, t=b.dataset.tab2, arr=ROLES[r].tabs, i=arr.indexOf(t);
    i<0?arr.push(t):arr.splice(i,1);
    audit('TAB_VISIBILITY_CHANGED',ROLES[r].name,`${t} → ${i<0?'visible':'hidden'}`);
    render();});
  const g=id=>document.getElementById(id);
  if(g('add-cat'))  g('add-cat').onclick=()=>catModal({});
  if(g('add-loc'))  g('add-loc').onclick=()=>locModal({});
  if(g('add-mat'))  g('add-mat').onclick=()=>matModal({});
  if(g('add-user')) g('add-user').onclick=()=>userModal({});
  if(g('exp-xlsx'))  g('exp-xlsx').onclick=exportWorkbook;
  if(g('exp-media')) g('exp-media').onclick=exportMediaManifest;
  if(g('loadfiles')) g('loadfiles').onclick=()=>{g('filebox').value=SAMPLE_FILES();};
  if(g('dorelink'))  g('dorelink').onclick=()=>{
    const t=(g('filebox').value||'').trim();
    if(!t){toast('Paste a folder listing first.',1);return}
    relinkResult=relink(t); render();};
  if(g('exp-tmpl'))  g('exp-tmpl').onclick=()=>{
    audit('EXPORT','import_template.csv','Blank template — no data',{exportId:'TEMPLATE',rows:0,
      sheets:'template',includedCost:'no',includedMargin:'no'});
    download('nornament_import_template.csv',csv([IMPORT_COLS]));};
  if(g('exp-audit')) g('exp-audit').onclick=()=>{
    const rows=[['timestamp','user','role','action','entity','detail','export_id','rows',
      'sheets','cost_included','margin_included','ip','browser','device']]
      .concat(AUDIT.map(a=>[a.ts,a.user,a.role,a.action,a.entity,a.detail||'',a.exportId||'',
        a.rows??'',a.sheets||'',a.includedCost||'',a.includedMargin||'',a.ip,a.agent,a.device]));
    downloadXlsx('nornament_audit_log.xlsx',[{name:'Audit log',rows}]);};
  if(g('loadsample'))g('loadsample').onclick=()=>{g('pastebox').value=SAMPLE_PASTE;};
  if(g('validate'))  g('validate').onclick=()=>{
    const t=(g('pastebox').value||'').trim();
    if(!t){toast('Paste some rows first.',1);return}
    importRows=validateImport(t); render();};
  if(g('commit'))    g('commit').onclick=commitImport;
  ['pieces','photos','mb','vidmb','cadmb','growth'].forEach(k=>{
    const el=g('st-'+k); if(el) el.onchange=()=>{ST[k]=+el.value||0;render();};});
}

/* The role is whatever your login says it is. There is no picker: a switch that
   let anyone view as Admin would make every permission on these screens a
   decoration. What you can see is decided by the database. */
document.getElementById('themebtn').onclick=()=>{
  document.documentElement.dataset.theme =
    document.documentElement.dataset.theme==='dark'?'light':'dark';};
document.getElementById('signoutbtn').onclick=()=>{
  if(confirm('Sign out of Nornament?')) location.reload(); };
document.getElementById('gatego').onclick = gateSubmit;
document.getElementById('gpass').addEventListener('keydown', e=>{ if(e.key==='Enter') gateSubmit(); });
document.getElementById('gemail').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('gpass').focus(); } });
setTimeout(()=>{ const n=document.getElementById('gemail'); if(n) n.focus(); }, 60);

/* Nothing is loaded until someone signs in. An empty shell, not a pretend shop. */
const BLANK = () => ({materials:{}, rates:{}, locations:{}, styles:{}, jewels:[],
                      materialStock:{}, counts:[], repairs:[], melts:[], tags:{}, collections:{}});
DB = enrich(BLANK());
if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.dataset.theme='dark';
render();
</script>
