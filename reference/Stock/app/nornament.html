/* A running total under the materials table. Not decoration: a piece whose
   cost comes out at zero almost always means the rates were left blank, and
   that is much cheaper to notice here than after a thousand imports. */
function newPieceSummary(){
  const el = document.getElementById('npsum');
  if(!el) return;
  const karat = (document.getElementById('n_karat')||{}).value || '';
  const metalG = newLines.filter(l=>l.material_class==='METAL')
                         .reduce((t,l)=>t+(+l.qty||0),0);
  let cost = 0, unpriced = 0;
  newLines.forEach(l=>{
    if(l.material_class==='LABOUR'){
      if(l.basis==='FLAT') cost += (+l.cost_rate||0);
      else cost += (+l.cost_rate||0) * metalG;
      if(!l.cost_rate) unpriced++;
      return;
    }
    if(!l.material && !l.material_name) return;
    if(l.material_class==='METAL'){
      const r = (+l.cost_rate) || alloyCostRate(karat);
      if(!r) unpriced++;
      cost += r * (+l.qty||0);
      return;
    }
    if(!l.cost_rate) unpriced++;
    cost += (+l.cost_rate||0) * (+l.qty||0);
  });
  el.innerHTML = `<span class="dim">Cost so far</span> <b>${inr(Math.round(cost))}</b>
    <span class="dim" style="margin-left:14px">Metal</span> <b>${metalG.toFixed(3)} g</b>
    ${unpriced?`<span class="chip c-warn" style="margin-left:14px">${unpriced} line${unpriced===1?'':'s'} with no rate</span>`:''}`;
}

function materialDatalist(){
  const seen=new Map();
  (REF.material||[]).forEach(m=>seen.set(m.code,m.label));
  return `<datalist id="matlist">${[...seen].map(([c,n])=>
    `<option value="${c}">${n}</option>`).join('')}</datalist>`;
}
function lineTable(lines, host, onchange){
  /* The kinds and units offered are the ones your material master actually
     uses, plus the standing set — so a class you add to a material shows up
     here without this file being edited. */
  const known=['DIAMOND','POLKI','COLOUR_STONE','PEARL','METAL','LABOUR','FINDING','OTHER'];
  const fromMaster=[...new Set((REF.material||[]).map(m=>(m.extra||'|').split('|')[0]).filter(Boolean))];
  const cls=[...new Set([...known, ...fromMaster])];
  const uoms=((REF.uom||[]).map(u=>u.code).filter(Boolean));
  const UOM = uoms.length?uoms:['CT','GM','RATTI','PCS'];
  host.innerHTML = `${materialDatalist()}
    <table class="mattab"><thead><tr><th>Item code</th><th>Item name</th>
      <th>Kind</th><th class="num">Pcs</th><th class="num">Qty</th><th>Unit</th>
      <th class="num">Cost rate</th>
      <th class="num">Sale rate</th><th></th></tr></thead>
    <tbody>${lines.map((l,i)=>`<tr>
      <td><input list="matlist" value="${l.material||''}" data-f="material" data-i="${i}"
           style="text-transform:uppercase"></td>
      <td><input value="${l.material_name||''}" data-f="material_name" data-i="${i}"></td>
      <td><select data-f="material_class" data-i="${i}">
        ${cls.map(c=>`<option value="${c}" ${l.material_class===c?'selected':''}>${c.replace('_',' ').toLowerCase()}</option>`).join('')}</select></td>
      <td class="num"><input type="number" value="${l.pcs??''}" data-f="pcs" data-i="${i}" style="width:64px"></td>
      <td class="num">${l.material_class==='LABOUR'
        ? `<select data-f="basis" data-i="${i}" style="width:112px"
             title="On net weight, the amount is the rate per gram of metal. Fixed amount is the whole charge.">
             <option value="BY_NET_METAL_WT" ${l.basis!=='FLAT'?'selected':''}>on net weight</option>
             <option value="FLAT" ${l.basis==='FLAT'?'selected':''}>fixed amount</option></select>`
        : `<input type="number" step="0.001" value="${l.qty??''}" data-f="qty" data-i="${i}" style="width:88px">`}</td>
      <td><select data-f="uom" data-i="${i}">${UOM.map(u=>
        `<option value="${u}" ${l.uom===u?'selected':''}>${u}</option>`).join('')}</select></td>
      <td class="num"><input type="number" step="0.01" value="${l.cost_rate??''}" data-f="cost_rate" data-i="${i}" style="width:92px"></td>
      <td class="num">${l.material_class==='METAL'
        ? `<input value="live" readonly style="width:92px" title="gold is priced from the pure rate at the moment anyone looks">`
        : `<input type="number" step="0.01" value="${l.sale_rate??''}" data-f="sale_rate" data-i="${i}" style="width:92px">`}</td>
      <td><button class="btn sm" data-del="${i}">✕</button></td></tr>`).join('')}
    </tbody></table>
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <button class="btn sm" data-add="1">+ Material line</button>
      <span class="dim" style="font-size:12px">Rate is <b>per unit</b> — except a making line set to
        <i>fixed amount</i>, where it is the whole charge. An item code you have not used before is
        registered the first time you save it.</span></div>`;
  host.querySelectorAll('[data-f]').forEach(el=>el.onchange=e=>{
    const i=+e.target.dataset.i, f=e.target.dataset.f, v=e.target.value;
    lines[i][f] = v===''?null:(['pcs','qty','cost_rate','sale_rate'].includes(f)?+v:v);
    if(f==='material_class'){ lines[i].uom = v==='METAL'?'GM':(v==='LABOUR'?'GM':'CT');
      if(v==='LABOUR'){ lines[i].basis = lines[i].basis==='FLAT'?'FLAT':'BY_NET_METAL_WT';
                        lines[i].qty=null; }
      else delete lines[i].basis; }
    if(f==='basis'){ lines[i].qty=null; }
    if(f==='material' && !lines[i].material_name){
      const m=(REF.material||[]).find(x=>x.code===v.toUpperCase());
      if(m){ lines[i].material_name=m.label;
             const [c,u]=(m.extra||'|').split('|'); lines[i].material_class=c; lines[i].uom=u; } }
    onchange();
  });
  host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    lines.splice(+b.dataset.del,1); onchange(); });
  const add=host.querySelector('[data-add]');
  if(add) add.onclick=()=>{ lines.push({material_class:'DIAMOND',uom:'CT'}); onchange(); };
}
const drawNewLines = () => { lineTable(newLines, document.getElementById('nlines'), drawNewLines);
                             newPieceSummary(); };

function cleanLines(lines){
  return lines.filter(l=>l.material||l.material_name).map(l=>{
    const o={material:(l.material||l.material_name||'').toUpperCase(),
             material_name:l.material_name||null, material_class:l.material_class||null,
             uom:l.uom||'CT', basis:l.basis||'BY_QTY'};
    if(l.size_band) o.size_band=l.size_band;
    if(l.pcs) o.pcs=l.pcs;
    if(o.basis!=='BY_NET_METAL_WT' && o.basis!=='FLAT' && l.qty) o.qty=l.qty;
    if(l.cost_rate) o.cost_rate=l.cost_rate;
    if(l.sale_rate && l.material_class!=='METAL') o.sale_rate=l.sale_rate;
    Object.keys(o).forEach(k=>o[k]==null&&delete o[k]);
    return o;});
}
async function saveNewPiece(e){
  const btn=e.target; btn.disabled=true; btn.textContent='Adding…';
  const v=id=>{const n=document.getElementById(id); return n&&n.value.trim()!==''?n.value.trim():null;};
  try{
    const body={jewel_code:(v('n_code')||'').toUpperCase(), style_code:(v('n_style')||'').toUpperCase(),
      design_name:v('n_name'), category:v('n_cat'), sub_category:v('n_sub'), collection:v('n_coll'),
      karat:v('n_karat'), colour:v('n_colour'), gross_wt:v('n_wt'), quality:v('n_qual'),
      size_label:v('n_size'),
      location:v('n_loc'), received_on:v('n_date'), lines:cleanLines(newLines)};
    Object.keys(body).forEach(k=>body[k]===null&&delete body[k]);
    if(!body.jewel_code) throw new Error('A jewel code is needed.');
    const res=await sbRpc('add_piece',{p:body});
    closeModal(); await liveRefresh(); sel=res.jewel_code; render();
    toast(`<b>${res.jewel_code}</b> added.`+(res.cost_price?` Cost ${inr(res.cost_price)} · price ${inr(res.sale_price)}.`:'')
      +(res.missing.length?` Still waiting on: ${res.missing.join(', ')}.`:''));
  }catch(err){
    document.getElementById('npmsg').innerHTML=
      `<div class="note" style="border-color:var(--critical)">${err.message}</div>`;
    btn.disabled=false; btn.textContent='Add this piece';
  }
}

let liveBomDraft=null;

        :`<p class="hint">No materials recorded yet. This will be version 1.</p>`}
    ${j._summary?`<div class="note" style="border-color:var(--warning)">

      costs. Replacing them with the real breakup clears that flag.</div>`:''}
    <div id="lbmsg"></div>
    <div id="lblines" style="margin-top:12px"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="lbsave">Save materials</button>

  const draw=()=>lineTable(liveBomDraft, document.getElementById('lblines'), draw);
  draw();
  document.getElementById('lbsave').onclick=async e=>{
    const btn=e.target; btn.disabled=true; btn.textContent='Saving…';
    try{
      const lines=cleanLines(liveBomDraft);
      if(!lines.length) throw new Error('No material lines to save.');
      const res=await sbRpc('set_bom',{p:{jewel_code:code, lines, is_summary:false,
        note:'Edited in Nornament'}});
      closeModal(); await liveRefresh(); sel=code; render();
      toast(`<b>${code}</b> — materials saved as version ${res.bom_version}. `
        +`Cost ${inr(res.cost_price)} · price ${inr(res.sale_price)}.`);
    }catch(err){
      document.getElementById('lbmsg').innerHTML=
        `<div class="note" style="border-color:var(--critical)">${err.message}</div>`;
      btn.disabled=false; btn.textContent='Save materials';
    }
  };
}

/* ═══════════════ LIVE: delete a piece ═══════════════ */
function deleteModal(code){
  const j = DB.jewels.find(x=>x.code===code); if(!j) return;
  openModal(`<h3>Delete ${code}</h3>
    <div class="note" style="border-color:var(--critical)">
      This removes the piece, its bill of materials and its movement history from stock.
      The whole record is written to the <b>audit log</b> first, so it can be put back by hand —
      but nothing in the app will do that for you.</div>
    <p class="hint">Use this for a piece keyed in by mistake or entered twice. A piece that has
      been <b>sold, melted or lost</b> cannot be deleted at all — that record is the only evidence
      of what happened to it.</p>
    <label class="lbl" style="margin-top:10px">Why is it being deleted? <span class="dim">required</span></label>
    <input id="delreason" placeholder="e.g. entered twice during the migration">
    <div id="delmsg"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn danger" id="delgo">Delete ${code}</button>
      <button class="btn" onclick="closeModal()">Keep it</button></div>`);
  document.getElementById('delgo').onclick = async e => {
    const btn=e.target; btn.disabled=true; btn.textContent='Deleting…';
    try{
      await sbRpc('delete_piece',{p:{jewel_code:code,
        reason:document.getElementById('delreason').value}});
      closeModal(); sel=null; page='stock'; await liveRefresh();
      toast(`<b>${code}</b> deleted. The full record is in the audit log.`);
    }catch(err){
      document.getElementById('delmsg').innerHTML =
        `<div class="note" style="border-color:var(--critical)">${err.message}</div>`;
      btn.disabled=false; btn.textContent='Delete '+code;
    }
  };
}

/* ═══════════════ The sign-in gate ═══════════════
   Nothing renders until someone signs in. Not a banner over a pretend
   dashboard — the application simply is not there yet. */
async function openApp(){
  document.getElementById('gate').hidden = true;
  document.getElementById('appshell').hidden = false;
  render();
}
async function gateSubmit(){
  const btn = document.getElementById('gatego');
  const msg = document.getElementById('gatemsg');
  const email = document.getElementById('gemail').value.trim();
  const pass  = document.getElementById('gpass').value;
  if(!email || !pass){ msg.innerHTML = '<div class="gateerr">Email and password, please.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…'; msg.innerHTML = '';
  try{
    TOKEN = await sbSignIn(email, pass);
    const me = await sbFetch('me?select=*');
    if(!me.length) throw new Error(
      'That login works, but it is not linked to a Nornament user yet. An admin has to add you.');
    ME = me[0];
    role = ME.role_code || 'ADMIN';
    DB = enrich(await liveLoad());
    try{ await loadMedia(); }catch(e){ console.warn('media list unavailable', e); }
    try{ await loadCounts(); }catch(e){ console.warn('counts unavailable', e); }
    LIVE = true; sel = null; page = 'dash'; COUNT = null; LASTSCAN = null;
    /* an open count is picked back up where it was left, on whichever device */
    const resume = COUNTS.find(c => c.status === 'OPEN');
    if(resume){ try{ COUNT = await sbRpc('count_state', {p:{count_id:resume.count_id}}); }
                catch(e){ console.warn('could not resume count', e); } }
    await openApp();
    toast(`Welcome, <b>${ME.full_name||ME.username}</b>. `
        + `${DB.jewels.length} piece${DB.jewels.length===1?'':'s'} in stock.`);
  }catch(err){
    /* a rendering fault must never be mistaken for a bad password */
    if(TOKEN && ME){
      console.error('after sign-in:', err);
      await openApp();
      toast('Signed in, but a screen failed to draw: '+err.message, true);
      return;
    }
    if(err instanceof Unreachable || /failed to fetch|load failed|networkerror/i.test(err.message)){
      const host = SUPA.url.replace('https://','');
      const state = await reachability();
      msg.innerHTML = `<div class="gateerr">
        <b>Your browser could not reach the database.</b> This is not your password —
        the request never got a reply from <span style="font-family:var(--mono)">${host}</span>.
        <div style="margin-top:8px">Most likely, in this order:</div>
        <div style="margin-top:4px">1. An ad-blocker or privacy extension. Try an Incognito window.</div>
        <div>2. Office wifi, a VPN, or a captive portal.</div>
        <div>3. No internet at all.</div>
        <div style="margin-top:8px">Quick check:
          <a href="${SUPA.url}/auth/v1/health" target="_blank" rel="noopener">open this link</a> —
          if it also fails, it is the network, not the app.</div>
        <div style="margin-top:6px;opacity:.75">Probe result: ${state}</div></div>`;
      TOKEN=null; LIVE=false; ME=null;
      return;
    }
    msg.innerHTML = '<div class="gateerr">'+err.message+'</div>';
    TOKEN = null; LIVE = false; ME = null;
    document.getElementById('gpass').value = '';
    document.getElementById('gpass').focus();
  }finally{ btn.disabled = false; btn.textContent = 'Sign in'; }
}

/* ═══════════════ LIVE: users ═══════════════
   Two records, one person. auth.users holds the password; app_user holds the
   role and the locations. Nothing joined them, so a login made in the Supabase
   dashboard authenticated perfectly and then arrived as nobody. Everything
   below exists to make that pairing visible and repairable. */
async function sbFn(name, payload){
  const r = await fetch(`${SUPA.url}/functions/v1/${name}`, {
    method:'POST',
    headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+TOKEN,
              'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  });
  const d = await r.json().catch(()=>({error:'The server sent something unreadable.'}));
  if(!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status}).`);
  return d;
}

const ROLE_BLURB = {
  ADMIN:'Everything, including cost, melt and exports.',
  ACCOUNTS:'Cost, margin and reports. No melt.',
  SALES:'Sale price only. No cost, no vendor, no planning.',
  GRAPHIC:'Designs and media. No prices at all.',
  PRODUCTION:'Materials, repairs and vendors. No prices.'
};

async function drawUsers(){
  const host = document.getElementById('userrows');
  if(!host || !LIVE) return;
  let rows = [], pending = [];
  try{
    [rows, pending] = await Promise.all([
      sbFetch('app_users?select=*&order=username'),
      sbFetch('pending_logins?select=*&order=created_at').catch(()=>[])
    ]);
  }catch(e){
    host.innerHTML = `<tr><td colspan="8" class="dim">${e.message}</td></tr>`; return;
  }

  /* A login with no user behind it is the failure this whole screen is about,
     so it is shown first and loudly rather than left to be discovered. */
  const orph = document.getElementById('orphans');
  if(orph){
    orph.innerHTML = !pending.length ? '' :
      `<div class="note bad" style="margin-top:12px">
        <b>${pending.length} login${pending.length===1?'':'s'} with no user record.</b>
        ${pending.length===1?'This person can':'These people can'} type the right password and
        the app still will not know who they are. Give each one a role:
        <div style="margin-top:8px">${pending.map(pl=>
          `<div class="row" style="align-items:center;gap:8px;margin-top:6px">
             <span class="code">${pl.email}</span>
             <button class="btn sm" data-adopt="${pl.email}">Set them up</button></div>`).join('')}</div>
      </div>`;
    orph.querySelectorAll('[data-adopt]').forEach(b=>
      b.onclick = () => userModal({ email:b.dataset.adopt, adopt:true }));
  }

  const locs = (REF.location||[]);
  const activeAdmins = rows.filter(u=>u.role_code==='ADMIN'&&u.is_active).length;

  host.innerHTML = rows.map(u=>{
    const sees = u.all_locations ? '<span class="chip c-neutral">everywhere</span>'
      : [u.home_location, ...(u.extra_locations||[])].filter(Boolean)
          .map(c=>`<span class="chip c-neutral">${c}</span>`).join(' ')
        || '<span class="chip c-crit">nowhere</span>';
    const lastAdmin = u.role_code==='ADMIN' && u.is_active && activeAdmins===1;
    return `<tr style="${u.is_active?'':'opacity:.5'}">
      <td class="code">${u.username}</td>
      <td>${u.full_name||''}</td>
      <td class="dim" style="font-size:12px">${u.email||'—'}</td>
      <td>${u.role_name}<div class="dim" style="font-size:11px">${ROLE_BLURB[u.role_code]||''}</div></td>
      <td>${sees}</td>
      <td>${u.has_login ? '<span class="chip c-good">yes</span>'
                        : '<span class="chip c-crit">no password</span>'}</td>
      <td>${u.is_active ? '<span class="chip c-good">active</span>'
                        : '<span class="chip c-neutral">disabled</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn sm" data-uedit="${u.username}">Edit</button>
        <button class="btn sm" data-upwd="${u.email||''}" ${u.has_login?'':'disabled title="No login to reset"'}>Password</button>
        <button class="btn sm" data-utoggle="${u.username}" data-to="${u.is_active?0:1}"
          ${lastAdmin?'disabled title="The last active admin cannot be switched off"':''}>
          ${u.is_active?'Disable':'Enable'}</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" class="dim">No users yet.</td></tr>';

  host.querySelectorAll('[data-uedit]').forEach(b=>b.onclick=()=>{
    const u = rows.find(x=>x.username===b.dataset.uedit);
    userModal({ ...u, edit:true });
  });
  host.querySelectorAll('[data-upwd]').forEach(b=>b.onclick=()=>resetPwdModal(b.dataset.upwd));
  host.querySelectorAll('[data-utoggle]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{
      await sbRpc('set_user_active',{p:{username:b.dataset.utoggle, is_active:b.dataset.to==='1'}});
      toast(`<b>${b.dataset.utoggle}</b> ${b.dataset.to==='1'?'enabled':'disabled'}.`);
      await drawUsers();
    }catch(e){ toast(e.message, true); b.disabled=false; }
  });
}

/* One form for all three cases: a new person, an existing person, and a login
   that already exists and needs a role attached. They differ only in which
   fields are locked. */

  const roles = Object.entries(ROLES);
  const isEdit  = !!u.edit;
  const isAdopt = !!u.adopt;
  const title = isEdit ? `Edit ${u.username}`
              : isAdopt ? 'Set up an existing login'

  openModal(`
    <header style="margin:0 0 2px"><h3 style="margin:0">${title}</h3>
      <p class="hint" style="margin:6px 0 0">${isAdopt
        ? `<b>${u.email}</b> already has a password. It needs a role and a location before
           that person can actually use the app.`
        : isEdit
        ? 'Changing the role changes what they see the moment they next load the page.'
        : 'This creates the password <i>and</i> the app record together. The password is shown once.'}</p>
    </header>
    <div id="umsg"></div>

    <section class="npsec">
      <div class="nphead">Person</div>
      <div class="npgrid npgrid2">
        <div class="npf"><label class="lbl">Full name <span class="req">required</span></label>
          <input id="u_full" value="${u.full_name||''}" placeholder="Ravi Sharma"></div>
        <div class="npf"><label class="lbl">Username</label>
          <input id="u_user" value="${u.username||suggest}" ${isEdit?'readonly':''}
            style="text-transform:lowercase" placeholder="ravi">
          <span class="npnote">${isEdit?'Fixed once created — it is on their audit trail.'
                                       :'Short, no spaces. Used in the audit log.'}</span></div>
        <div class="npf"><label class="lbl">Email <span class="req">signs in with this</span></label>
          <input id="u_email" type="email" value="${u.email||''}" ${(isEdit||isAdopt)?'readonly':''}
            placeholder="ravi@karigar.live"></div>
        <div class="npf"><label class="lbl">Role <span class="req">required</span></label>
          <select id="u_role">
            ${u.role_code?'':'<option value="">— choose a role —</option>'}
            ${roles.map(([k,r])=>
              `<option value="${k}" ${u.role_code===k?'selected':''}>${r.name}</option>`).join('')}</select></div>
      </div>

      <div class="nphead">What they can see</div>
      <div class="npgrid npgrid2">
        <div class="npf" style="display:flex;align-items:flex-end;padding-bottom:8px">
          <label class="sw"><input type="checkbox" id="u_all" ${u.all_locations!==false?'checked':''}>
            Sees every location</label></div>
        <div class="npf"><label class="lbl">Home location</label>
          <select id="u_home" ${u.all_locations!==false?'disabled':''}>
            <option value="">—</option>
            ${locs.map(l=>`<option value="${l.code}" ${u.home_location===l.code?'selected':''}>${l.code} — ${l.label}</option>`).join('')}
          </select>
          <span class="npnote">Extra locations on top of this are set on the
            <b>Location access</b> tab.</span></div>
      </div>

    ${(isEdit||isAdopt)?'':`
    <section class="npsec">
      <div class="nphead">Password</div>
      <div class="npgrid npgrid2">
        <div class="npf"><label class="lbl">Set one, or leave blank</label>
          <input id="u_pwd" placeholder="generated for you">
          <span class="npnote">Shown to you once, on the next screen. Have them change it.</span></div>
        <div class="npf"></div>
      </div>
    </section>`}

    <div class="npfoot">
      <div class="npsum dim" style="font-size:12px">${isEdit ? ''
        : isAdopt ? 'The login already exists — this adds the role behind it.'
        : 'Creates the login and the app record together.'}</div>
      <div class="row">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" id="usave">${isEdit?'Save':'Create'}</button></div>
    </div>`, 1);

  const hint = () => {
    const r = document.getElementById('u_role').value;
    if(!r){ document.getElementById('u_rolehint').innerHTML =

            document.getElementById('u_all').disabled = false; return; }
    document.getElementById('u_rolehint').innerHTML =
      `<b>${(ROLES[r]||{}).name||r}</b> — ${ROLE_BLURB[r]||''}` +

            <button class="btn primary" onclick="closeModal()">Done</button></div>`, 0);
      } else {
        toast(res.note || `<b>${payload.username}</b> saved.`);
      }
      await drawUsers();
    }catch(e){
      msg.innerHTML = `<div class="note bad">${e.message}</div>`;

    }
  };

/* ═══════════════ Edit the piece as a form ═══════════════
   Click-to-edit is fine when you know it is there and are changing one thing.
   It is useless when you sit down to fill in eight fields at once, which is
   what actually happens. This is the same fields, all at once, with a Save. */
const PIECE_FORM = [
  ['Identity', [
    ['design_name','Design name','text'],
    ['collection','Collection','text'],
    ['sub_category','Sub category','text'],
  ]],
  ['Metal and stones', [
    ['karat','Karat','ref:karat'],
    ['colour','Metal colour','ref:colour'],
    ['quality','Diamond quality','text'],
  ]],
  ['Weights and size', [
    ['gross_wt','Gross weight (g)','number'],
    ['size','Size','text'],
    ['length_mm','Length (mm)','number'],
    ['breadth_mm','Breadth (mm)','number'],
    ['height_mm','Height (mm)','number'],
  ]],
  ['Compliance and origin', [
    ['huid','HUID','text'],
    ['hallmarked_on','Hallmarked on','date'],
    ['hallmark_centre','Hallmark centre','text'],
    ['vendor','Manufacturer','text'],
  ]],
  ['Other', [
    ['website_url','Website link','text'],
    ['remarks','Remarks','text'],
  ]],
];

function editPieceModal(code){
  const j = DB.jewels.find(x=>x.code===code);
  if(!j) return;
  const val = f => {
    const v = FIELD_VALUE[f] ? FIELD_VALUE[f](j) : '';
    return (v===null||v===undefined||v==='—') ? '' : v;
  };
  const field = ([f,label,type]) => {
    const cur = val(f);
    if(type.startsWith('ref:')){
      const list = REF[type.slice(4)]||[];
      return `<div class="npf"><label class="lbl">${label}</label>
        <select data-pf="${f}"><option value="">—</option>
        ${list.map(o=>`<option value="${o.code}" ${o.code===cur?'selected':''}>${o.label}</option>`).join('')}
        </select></div>`;
    }
    return `<div class="npf"><label class="lbl">${label}</label>
      <input data-pf="${f}" type="${type}" ${type==='number'?'step="0.001"':''}
             value="${String(cur).replace(/"/g,'&quot;')}"></div>`;
  };

  openModal(`
    <header style="margin:0 0 2px"><h3 style="margin:0">Edit ${code}</h3>
      <p class="hint" style="margin:6px 0 0">Change anything here and press Save. Only the fields
        you actually alter are sent — the rest are left exactly as they are.</p></header>
    <div id="pfmsg"></div>
    ${PIECE_FORM.map(([sec,fields])=>`
      <section class="npsec">
        <div class="nphead">${sec}</div>
        <div class="npgrid">${fields.map(field).join('')}</div>
      </section>`).join('')}
    <section class="npsec">
      <div class="nphead">Jewel code</div>
      <div class="dim" style="font-size:12.5px;max-width:80ch;line-height:1.55">
        <b class="mono">${code}</b> cannot be changed. It is the identity of a physical object, and
        renaming it would move every movement, sale and photograph onto a different piece.
        Delete and re-add instead.</div>
    </section>
    <div class="npfoot">
      <div class="dim" style="font-size:12px" id="pfcount">Nothing changed yet</div>
      <div class="row"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="pfsave">Save</button></div>
    </div>`, 1);

  const before = {};
  PIECE_FORM.flatMap(x=>x[1]).forEach(([f])=>before[f]=String(val(f)));
  const dirty = () => PIECE_FORM.flatMap(x=>x[1])
    .filter(([f])=>{ const el=document.querySelector(`[data-pf="${f}"]`);
                     return el && el.value.trim() !== before[f]; })
    .map(([f])=>f);
  const sync = () => {
    const n = dirty().length;
    document.getElementById('pfcount').textContent =
      n ? `${n} field${n===1?'':'s'} changed` : 'Nothing changed yet';
  };
  document.querySelectorAll('[data-pf]').forEach(el=>{ el.oninput=sync; el.onchange=sync; });

  document.getElementById('pfsave').onclick = async () => {
    const btn = document.getElementById('pfsave');
    const changed = dirty();
    if(!changed.length){ closeModal(); return; }
    const patch = {jewel_code: code};
    changed.forEach(f => {
      const v = document.querySelector(`[data-pf="${f}"]`).value.trim();
      patch[f] = v === '' ? null : v;      // an emptied box clears the field
    });
    btn.disabled = true; btn.textContent = 'Saving…';
    try{
      await sbRpc('update_piece', {p:patch});
      closeModal();
      await liveRefresh();
      toast(`<b>${code}</b> — ${changed.length} field${changed.length===1?'':'s'} saved.`);
    }catch(e){
      document.getElementById('pfmsg').innerHTML = `<div class="note bad">${e.message}</div>`;
      btn.disabled = false; btn.textContent = 'Save';
    }
  };
}

/* ── the piece's Pricing tab ─────────────────────────────────────────── */
async function drawPieceScenarios(code){
  const host = document.getElementById('screns');
  if(!host || !LIVE) return;
  let d;
  try{ d = await sbRpc('piece_scenarios', {p:{jewel_code:code}}); }
  catch(e){ host.innerHTML=`<tr><td colspan="8" class="dim">${e.message}</td></tr>`; return; }

  const rows = d.scenarios||[];
  host.innerHTML = rows.map(r=>{
    const m = r.price - d.cost_today;
    const cls = m<=0 ? 'c-crit' : (m/r.price < 0.25 ? 'c-ser' : 'c-good');
    return `<tr${r.in_use?' style="background:var(--brand-soft)"':''}>
      <td>${r.may_switch?`<input type="radio" name="scpick" ${r.in_use?'checked':''}
             data-sc="${r.scenario_id}">`:''}</td>
      <td><b>${r.scenario_name}</b>${r.in_use?' <span class="chip c-good" style="font-size:10px">in use</span>'
          :(r.is_default?' <span class="chip c-neutral" style="font-size:10px">default</span>':'')}
        ${r.capped?`<span class="chip c-warn" style="font-size:10px">${r.capped}</span>`:''}
        <div class="dim" style="font-size:11.5px">${r.method==='CHART'
          ? 'sale rates from the chart' : 'value added target, absorbed by stones'}</div></td>
      <td class="num">${inr(r.metal_sale)}</td>
      <td class="num">${inr(r.stone_sale)}</td>
      <td class="num">${inr(r.making_sale)}</td>
      <td class="num" style="font-weight:600">${inr(r.price)}</td>
      <td class="num"><span class="chip ${cls}">${(100*m/r.price).toFixed(1)}%</span></td>
      <td class="num">${r.stone_multiple?r.stone_multiple+'×':'—'}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="dim">No scenarios you may see.</td></tr>';

  /* the stored price sits underneath as the thing being compared against */
  /* Until a piece is put on a scenario its price is the one written on its
     own lines. Saying so is the difference between a comparison and a lie. */
  const sm = d.stored_sale_price - d.cost_today;
  host.insertAdjacentHTML('beforeend', `<tr${d.on_scenario?'':' style="background:var(--brand-soft)"'}>
    <td></td>
    <td><b>Rates on the piece's own lines</b>
      ${d.on_scenario?'':' <span class="chip c-good" style="font-size:10px">in use</span>'}
      <div class="dim" style="font-size:11.5px">what this piece is quoted at today</div></td>
    <td class="num dim">—</td><td class="num dim">—</td><td class="num dim">—</td>
    <td class="num" style="font-weight:600">${inr(d.stored_sale_price)}</td>
    <td class="num"><span class="chip ${sm<=0?'c-crit':sm/d.stored_sale_price<0.25?'c-ser':'c-good'}">
      ${(100*sm/d.stored_sale_price).toFixed(1)}%</span></td>
    <td class="num dim">—</td></tr>`);

  host.querySelectorAll('[data-sc]').forEach(r=>r.onchange=async()=>{
    r.disabled = true;
    try{
      const res = await sbRpc('set_piece_scenario', {p:{jewel_code:code, scenario_id:+r.dataset.sc}});
      toast(`<b>${code}</b> now priced on <b>${res.scenario}</b> — ${inr(res.price)}.`);
      await liveRefresh(); await drawPieceScenarios(code);
    }catch(e){
      document.getElementById('scmsg').innerHTML=`<div class="note bad">${e.message}</div>`;
      r.checked = false; r.disabled = false;
    }
  });
}

/* ── refresh a BOM's rates from the chart ────────────────────────────── */
async function refreshFromChart(code){
  let d;
  try{ d = await sbRpc('refresh_bom_rates', {p:{jewel_code:code}}); }
  catch(e){ return toast(e.message, true); }
  if(!d.lines_differing) return toast('Every line already matches the chart.');
  const rows = (d.changes||[]).map(c=>`<tr>
    <td class="code">${c.material}</td><td class="dim mono" style="font-size:12px">${c.size_band||'—'}</td>
    <td class="num dim">${c.cost_now==null?'—':(+c.cost_now).toLocaleString('en-IN')}</td>
    <td class="num">${c.cost_chart==null?'—':(+c.cost_chart).toLocaleString('en-IN')}</td>
    <td class="num dim">${c.sale_now==null?'—':(+c.sale_now).toLocaleString('en-IN')}</td>
    <td class="num">${c.sale_chart==null?'—':(+c.sale_chart).toLocaleString('en-IN')}</td></tr>`).join('');
  openModal(`<header><h3>Refresh ${code} from the rate chart</h3>
      <p>${d.lines_differing} line${d.lines_differing===1?'':'s'} differ. Metal is not listed —
        it prices from its live rate and a chart cannot override it.</p></header>
    <div class="content">
      <table><thead><tr><th>Material</th><th>Size</th>
        <th class="num">Cost now</th><th class="num">Chart</th>
        <th class="num">Sale now</th><th class="num">Chart</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div class="note">Applying this rewrites the rates on the current BOM version and recosts
        the piece. The frozen cost figure changes with it — this is an edit, not a view.</div>
    </div>
    <footer><button class="btn" onclick="closeModal()">Leave it</button>
      <button class="btn primary" id="dorefresh">Apply to ${d.lines_differing} line${d.lines_differing===1?'':'s'}</button></footer>`);
  document.getElementById('dorefresh').onclick = async e => {
    e.target.disabled = true; e.target.textContent = 'Applying…';
    try{
      const r = await sbRpc('refresh_bom_rates', {p:{jewel_code:code, apply:true}});
      closeModal(); toast(r.note);
      DB.jewels.forEach(j=>{ if(j.code===code) j._bomLoaded=false; });
      await liveRefresh();
    }catch(err){ toast(err.message, true); e.target.disabled=false; }
  };
}

/* ── rate charts ─────────────────────────────────────────────────────── */
let CHARTS = [], CHART_ID = null;
async function drawCharts(){
  const host = document.getElementById('chartrows');
  if(!host || !LIVE) return;
  try{ CHARTS = await sbFetch('rate_chart?select=*'); }
  catch(e){ host.innerHTML=`<tr><td colspan="5" class="dim">${e.message}</td></tr>`; return; }
  if(!CHARTS.length){ host.innerHTML='<tr><td colspan="5" class="dim">No rate charts yet.</td></tr>'; return; }
  if(!CHART_ID || !CHARTS.some(c=>c.chart_id===CHART_ID))
    CHART_ID = (CHARTS.find(c=>c.is_default)||CHARTS[0]).chart_id;

  const pick = document.getElementById('chartpick');
  if(pick){
    pick.innerHTML = CHARTS.map(c=>`<option value="${c.chart_id}" ${c.chart_id===CHART_ID?'selected':''}>
      ${c.name}${c.is_default?' · default':''}${c.is_locked?' · locked':''} (${c.lines})</option>`).join('');
    pick.onchange = () => { CHART_ID = +pick.value; drawCharts(); };
  }
  const fork = document.getElementById('fork-chart');
  if(fork) fork.onclick = async () => {
    fork.disabled = true;
    try{ const r = await sbRpc('fork_chart',{p:{chart_id:CHART_ID}});
         CHART_ID = r.chart_id; toast(`Forked to <b>${r.code} v${r.version_no}</b>.`); await drawCharts(); }
    catch(e){ toast(e.message, true); }
    fork.disabled = false;
  };

  let rows;
  try{ rows = await sbFetch(`rate_chart_line?chart_id=eq.${CHART_ID}&select=*&order=category_order,material,size_band`); }
  catch(e){ host.innerHTML=`<tr><td colspan="5" class="dim">${e.message}</td></tr>`; return; }

  const locked = (CHARTS.find(c=>c.chart_id===CHART_ID)||{}).is_locked;
  let last = null, html = '';
  rows.forEach(r=>{
    if(r.category_name !== last){
      last = r.category_name;
      html += `<tr><td colspan="5" style="background:var(--surface-2);padding:5px 10px;
        font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
        color:var(--ink-2)">${r.category_name}</td></tr>`;
    }
    const box = (side,val) => locked
      ? `<span class="mono">${val==null?'—':(+val).toLocaleString('en-IN')}</span>`
      : `<input class="rin" data-side="${side}" data-mat="${r.material}" data-band="${r.size_band}"
                value="${val==null?'':val}" inputmode="decimal">`;
    html += `<tr>
      <td><span class="code">${r.material}</span> <span class="dim">${r.material_name}</span></td>
      <td class="dim mono" style="font-size:12px">${r.size_band||'—'}</td>
      <td class="num">${box('cost', r.cost_rate)}</td>
      <td class="num">${box('sale', r.sale_rate)}</td>
      <td class="num">${r.multiple?r.multiple+'×':'—'}</td></tr>`;
  });
  host.innerHTML = html || '<tr><td colspan="5" class="dim">This chart has no lines.</td></tr>';

  host.querySelectorAll('.rin').forEach(el=>el.onchange=async()=>{
    const body = {chart_id:CHART_ID, material:el.dataset.mat, size_band:el.dataset.band};
    body[el.dataset.side+'_rate'] = el.value===''?null:+el.value;
    el.disabled = true;
    try{ await sbRpc('set_chart_rate',{p:body}); await drawCharts(); }
    catch(e){ document.getElementById('chartmsg').innerHTML=`<div class="note bad">${e.message}</div>`;
              el.disabled=false; }
  });
}

      toast(`Category <b>${res.name}</b> ${res.created?'added':'updated'}.`);
      await liveRefresh(); await drawCats();
    }catch(e){
      document.getElementById('cmsg').innerHTML = `<div class="note bad">${e.message}</div>`;
      btn.disabled=false; btn.textContent = edit?'Save':'Add';
    }
  };
  setTimeout(()=>document.getElementById('c_name').focus(),30);
}

/* ═══════════════ Location access ═══════════════ */
async function drawAccess(){
  const host = document.getElementById('accrows');
  if(!host || !LIVE) return;
  let rows;
  try{ rows = await sbFetch('user_access?select=*&order=username'); }
  catch(e){ host.innerHTML = `<tr><td colspan="7" class="dim">${e.message}</td></tr>`; return; }
  const locs = (REF.location||[]);
  host.innerHTML = rows.map((u,i)=>`<tr>
    <td class="code">${u.username}<div class="dim" style="font-size:11.5px">${u.full_name||''}</div></td>
    <td>${u.role_name}</td>
    <td><label class="sw"><input type="checkbox" data-accall="${i}" ${u.all_locations?'checked':''}
      ${u.role_code==='ADMIN'?'disabled title="Admins always see everything"':''}> every</label></td>
    <td><select data-acchome="${i}" ${u.all_locations?'disabled':''} style="font-size:12.5px;padding:3px 6px">
        <option value="">—</option>
        ${locs.map(l=>`<option value="${l.code}" ${u.home_location===l.code?'selected':''}>${l.code}</option>`).join('')}
      </select></td>
    <td>${locs.map(l=>`<label class="sw" style="display:inline-flex;margin-right:9px">
        <input type="checkbox" data-accextra="${i}" value="${l.code}"
          ${(u.extra_locations||[]).includes(l.code)?'checked':''}
          ${u.all_locations?'disabled':''}> ${l.code}</label>`).join('')}</td>
    <td>${(u.can_see||[]).map(c=>`<span class="chip c-neutral">${c}</span>`).join(' ')||'<span class="chip c-crit">nowhere</span>'}</td>
    <td><button class="btn sm" data-accsave="${i}" data-user="${u.username}">Save</button></td>
  </tr>`).join('');

  host.querySelectorAll('[data-accall]').forEach(cb=>cb.onchange=()=>{
    const i=cb.dataset.accall, off=cb.checked;
    const h=host.querySelector(`[data-acchome="${i}"]`); if(h) h.disabled=off;
    host.querySelectorAll(`[data-accextra="${i}"]`).forEach(x=>x.disabled=off);
  });
  host.querySelectorAll('[data-accsave]').forEach(btn=>btn.onclick=async()=>{
    const i=btn.dataset.accsave;
    const all = host.querySelector(`[data-accall="${i}"]`).checked;
    const home = host.querySelector(`[data-acchome="${i}"]`).value;
    const extra = [...host.querySelectorAll(`[data-accextra="${i}"]`)]
                    .filter(x=>x.checked).map(x=>x.value);
    if(!all && !home){ toast('Choose a home location, or tick "every".', true); return; }
    btn.disabled=true; btn.textContent='Saving…';
    try{
      await sbRpc('set_user_locations',{p:{username:btn.dataset.user, all_locations:all,
                                           home_location:home||null, locations:extra}});
      toast(`<b>${btn.dataset.user}</b> updated.`);
      await drawAccess();
    }catch(e){ toast('Not saved. '+e.message, true); btn.disabled=false; btn.textContent='Save'; }
  });
}

/* One piece, fetched when you actually look at it. The catalogue list carries
   only the totals; the material lines and movement history are pulled per
   piece, which is what stopped every refresh sending the whole shop. */
async function loadPieceDetail(code){
  const j = DB.jewels.find(x=>x.code===code);
  if(!j || j._bomLoaded) return;
  const q = encodeURIComponent(code);
  const [lines, moves] = await Promise.all([
    sbFetch('bom_line?jewel_code=eq.'+q+'&select=*&order=version_no,line_no').catch(()=>[]),
    sbFetch('movement?jewel_code=eq.'+q+'&select=*&order=moved_at').catch(()=>[])
  ]);
  j.boms = [];
  lines.forEach(l=>{
    let bom = j.boms.find(b=>b.v===l.version_no);
    if(!bom){ bom={v:l.version_no, reason:l.version_reason||'INITIAL', note:'',
                   when:j.received, lines:[]}; j.boms.push(bom); }
    bom.lines.push({no:l.line_no, m:l.material_code, band:l.size_band||'',
      pcs:l.pcs, qty:l.qty_value==null?null:+l.qty_value, uom:l.qty_uom, basis:l.basis,
      cr:l.cost_rate==null?null:+l.cost_rate, sr:l.sale_rate==null?null:+l.sale_rate});
    if(!DB.materials[l.material_code])
      DB.materials[l.material_code] = {name:l.material_name||l.material_code,
        cls:l.material_class||'OTHER', uom:l.qty_uom||'CT'};
  });
  if(!j.boms.length) j.boms=[{v:j.ver, reason:'INITIAL', note:'', when:j.received, lines:[]}];
  j.boms.sort((a,b)=>a.v-b.v);
  const codeOf = n => Object.entries(DB.locations).find(([,v])=>v===n)?.[0] || n;
  j.moves = moves.map(m=>({t:m.move_type, from:m.from_location?codeOf(m.from_location):null,
    to:m.to_location?codeOf(m.to_location):null, state:m.resulting_state,
    when:(m.moved_at||'').slice(0,10), by:m.by_user||'—', why:m.reason||''}));
  if(!j.moves.length) j.moves=[{t:'RECEIPT',from:null,to:j.loc,state:j.state,
    when:j.received,by:'—',why:'Not received yet'}];
  j._bomLoaded = true;
}

  try{ await loadCounts(); }catch(e){ console.warn('counts unavailable', e); }

/* "Can make" from your sheet: is every material in this BOM actually on hand? */
function canMake(j){
  const need={};
  curBom(j).lines.forEach(l=>{ if((DB.materials[l.m]||{}).cls==='LABOUR') return;
    need[l.m]=(need[l.m]||0)+(l.qty||0); });
  const missing=Object.entries(need).filter(([m,q])=>(DB.materialStock[m]??0) < q)
    .map(([m,q])=>({m,need:q,have:DB.materialStock[m]??0}));
  return {ok:!missing.length,missing};
}

function renderTicker(){
  /* One box per metal. It used to be a single gold field, which is exactly
     how silver ended up priced from it. */
  const codes = Object.keys(METALS);
  const box = code => {
    const m = METALS[code];
    /* The pure rate only. Every karat derives from it, and listing them all
       made the bar a wall of numbers nobody read. */
    return `<span class="tgroup">
      <span class="tl">${m.name} ${code==='GOLD'?'24K':'999'}</span>
      <input type="number" id="rate_${code}" value="${m.rate}"
             step="${code==='GOLD'?50:1}" title="Pure rate per gram for ${m.name}">
      <span class="tl" style="letter-spacing:0">/g</span></span>`;
  };
  const t = document.getElementById('ticker');
  t.innerHTML = codes.map(box).join('<span class="msep"></span>');

  codes.forEach(code => {
    const el = document.getElementById('rate_'+code);
    if(!el) return;
    el.onchange = async e => {
      const was = METALS[code].rate, now = +e.target.value;
      if(!now || now <= 0){ e.target.value = was; return; }
      METALS[code].rate = now;
      if(code === 'GOLD') PURE_GOLD = now;
      RATE_AS_ON = rateStamp();
      if(LIVE){
        try{
          await sbRpc('set_metal_rate', {p:{code, pure_rate:now}});
          toast(`<b>${METALS[code].name}</b> now ₹${now}/g. `
              + PURITY.filter(p=>p[3]===code).map(p=>`${p[0]} ₹${alloyRate(p[0])}`).join(' · ')
              + '. Frozen costs did not move.');
        }catch(err){
          METALS[code].rate = was; e.target.value = was;
          toast('Rate not saved. '+err.message, true);
        }
      }
      render();
    };
  });
}

function renderBrand(){
  /* The mark is part of the application. It used to be dropped in by hand and
     kept in browser memory, which meant it vanished on refresh and every
     machine showed something different. */
  document.getElementById('brand').innerHTML =
    `<img class="brandimg" src="${BRAND_LOGO}" alt="Nornament">`;
}
function readLogo(f){
  if(!/^image\//.test(f.type)){toast('That is not an image file.',1);return}
  if(f.size>2*1024*1024){toast('Keep the logo under 2 MB — it sits on every screen.',1);return}
  const r=new FileReader();
  r.onload=()=>{LOGO=r.result;renderBrand();
    toast('<b>Logo set.</b> In the real build this saves to settings; here it resets on reload.');};
  r.readAsDataURL(f);
}

/* ---------- nav ---------- */
function renderNav(){
  const allowed=ROLES[role].tabs;
  document.getElementById('nav').innerHTML = NAV.map(n=>{
    if(n.grp) return `<div class="navgrp">${n.grp}</div>`;
    const ok=allowed.includes(n.id);
    return `<button data-page="${n.id}" ${ok?'':'disabled'} ${page===n.id?'aria-current="page"':''}>
      <span class="ico">${n.ico}</span>${n.label}${ok?'':'<span class="lockicon">🔒</span>'}</button>`;
  }).join('');
  document.querySelectorAll('#nav button[data-page]').forEach(b=>
    b.onclick=()=>{page=b.dataset.page;sel=null;render()});
  document.getElementById('whoami').innerHTML =
    `<b style="color:var(--ink)">${ROLES[role].name}</b><br>
     ${allowed.length} of ${NAV.filter(n=>!n.grp).length} tabs visible`;
}

function pgDashboard(){
  const start = (can('editBom')?`<div class="row" style="margin-bottom:16px">
      <button class="btn primary" id="addpiece">+ Add a piece</button>
      <span class="dim" style="font-size:13px">or bring a spreadsheet in from Import / Export</span>
    </div>`:'');
  const live=DB.jewels.filter(isLive);
  const inStock=live.filter(j=>j.state==='IN_STOCK');
  const unpriced=live.filter(j=>costed(j).cost===0);
  const value=live.reduce((s,j)=>s+costed(j).cost,0);
  const shortfalls=Object.values(DB.styles).map(s=>{
    const n=DB.jewels.filter(j=>j.style===s.code&&j.state==='IN_STOCK').length;
    return {...s,live:n,short:s.nos-n};}).filter(x=>x.short>0);

  return `${start}
  <div class="kpis">
    <div class="kpi"><div class="lbl">Pieces in stock</div><div class="val">${inStock.length}</div>
      <div class="sub">${live.length} live overall</div></div>
    <div class="kpi"><div class="lbl">On approval</div><div class="val">${live.filter(j=>j.state==='ON_APPROVAL').length}</div>
      <div class="sub">out with customers</div></div>
    <div class="kpi"><div class="lbl">In repair</div><div class="val">${live.filter(j=>j.state==='IN_REPAIR').length}</div>
      <div class="sub">at the workshop</div></div>
    ${can('cost')?`<div class="kpi"><div class="lbl">Stock value at cost</div>
      <div class="val" style="font-size:24px">${inr(value)}</div>
      <div class="sub">current BOM versions</div></div>`:
      `<div class="kpi"><div class="lbl">Stock value at cost</div><div class="val" style="font-size:19px;color:var(--muted)">🔒 hidden</div>
      <div class="sub">your role cannot see cost</div></div>`}
    <div class="kpi ${unpriced.length?'alert':''}"><div class="lbl">Unpriced pieces</div>
      <div class="val">${unpriced.length}</div>
      <div class="sub">${unpriced.length?'valued at zero above':'all costed'}</div></div>
  </div>

  ${unpriced.length?`<div class="card" style="border-color:var(--serious)">
    <div class="spread"><div>
      <h3>⚠ ${unpriced.length} piece${unpriced.length>1?'s have':' has'} no costed bill of materials</h3>
      <p class="hint" style="margin-bottom:0">These contribute <b>zero</b> to the stock value above.
      A half-imported catalogue reports a healthy-looking total that is badly understated —
      this is the number to watch when you load your 1000 codes.</p></div>
      <button class="btn" onclick="goStock('unpriced')">Show them</button></div>
  </div>`:''}

  <div class="card">
    <div class="spread"><h3>Needs making</h3></div>
    <p class="hint">Counted per <b>design</b>, not per jewel code — a jewel code is one piece and can never be restocked.</p>
    ${shortfalls.length?`<table><thead><tr><th>Style</th><th>Design</th>
      <th class="num">Floor</th><th class="num">Live pieces</th><th class="num">Shortfall</th></tr></thead><tbody>
      ${shortfalls.map(s=>{const ex=anyOfStyle(s.code);return `<tr>
        <td><span class="cellrow">${ex?thumb(ex,40):''}<span class="code">${s.code}</span></span></td><td>${s.name}</td>
        <td class="num">${s.nos}</td><td class="num">${s.live}</td>
        <td class="num"><span class="chip c-ser">${s.short}</span></td></tr>`}).join('')}
      </tbody></table>`:`<div class="empty">Every design is at or above its floor.</div>`}
  </div>

  <div class="card"><h3>Recent activity</h3>
    <p class="hint">Every movement is a ledger row. Nothing is edited in place.</p>
    <table><thead><tr><th>Jewel code</th><th>Event</th><th>From → To</th><th>Date</th><th>By</th></tr></thead><tbody>
    ${DB.jewels.flatMap(j=>j.moves.map(m=>({...m,code:j.code})))
      .sort((a,b)=>b.when.localeCompare(a.when)).slice(0,7)
      .map(m=>{const jj=DB.jewels.find(x=>x.code===m.code);return `<tr>
        <td><span class="cellrow">${thumb(jj,38)}<span class="code">${m.code}</span></span></td>
        <td>${m.t.replace(/_/g,' ').toLowerCase()}</td>
        <td class="dim">${m.from?DB.locations[m.from]:'—'} → ${m.t==='APPROVAL_OUT'?'with customer':(m.to?DB.locations[m.to]:'—')}</td>
        <td class="dim">${m.when}</td><td class="dim">${m.by}</td></tr>`}).join('')}
    </tbody></table>
  </div>`;
}

let F={cat:[],loc:[],state:[],price:[]};
const PRICE_BANDS=[['0 – 1 lakh',0,100000],['1 – 2 lakh',100000,200000],
                   ['2 – 5 lakh',200000,500000],['5 lakh +',500000,Infinity]];
function goStock(f){F={cat:[],loc:[],state:[],price:[]};
  if(f==='unpriced')F.special='unpriced';page='stock';sel=null;render();}
function toggleF(k,v){const a=F[k];const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);
  F.special=null;render();}
function clearF(){F={cat:[],loc:[],state:[],price:[]};render();}

function matches(j){
  const st=DB.styles[j.style], c=costed(j);
  if(F.special==='unpriced') return isLive(j)&&c.cost===0;
  if(F.cat.length && !F.cat.includes(st.cat)) return false;
  if(F.loc.length && !F.loc.includes(j.loc)) return false;
  if(F.state.length && !F.state.includes(j.state)) return false;
  if(F.price.length){
    const p=c.sale;
    const ok=F.price.some(i=>{const[,lo,hi]=PRICE_BANDS[i];return p>=lo&&p<hi});
    if(!ok) return false;
  }
  return true;
}

function pgStock(){
  const addBtn = LIVE && can('editBom')
    ? `<div class="row" style="margin-bottom:14px"><button class="btn primary" id="addpiece">+ Add a piece</button>
       <span class="dim" style="font-size:13px">or bring a spreadsheet in from Import / Export</span></div>` : '';
  const cats=[...new Set(Object.values(DB.styles).map(s=>s.cat))];
  const locs=Object.keys(DB.locations).filter(k=>k!=='WS1');
  const states=['IN_STOCK','ON_APPROVAL','SOLD','IN_REPAIR'];
  const list=DB.jewels.filter(matches);
  const active=F.cat.length+F.loc.length+F.state.length+F.price.length;

  const chipRow=(label,items)=>`<div class="frow"><div class="flabel">${label}</div><div class="fchips">${items}</div></div>`;

  return `${addBtn}
  <div class="filterbar">
    ${chipRow('Category',cats.map(c=>
      `<button class="fchip" aria-pressed="${F.cat.includes(c)}" onclick="toggleF('cat','${c}')">${c}</button>`).join(''))}
    ${chipRow('Location',locs.map(k=>
      `<button class="fchip" aria-pressed="${F.loc.includes(k)}" onclick="toggleF('loc','${k}')">${DB.locations[k]}</button>`).join(''))}
    ${chipRow('Status',states.map(k=>
      `<button class="fchip" aria-pressed="${F.state.includes(k)}" onclick="toggleF('state','${k}')">${STATE_CHIP[k][1]}</button>`).join(''))}
    ${can('sale')?chipRow('Price',PRICE_BANDS.map((b,i)=>
      `<button class="fchip" aria-pressed="${F.price.includes(i)}" onclick="toggleF('price',${i})">${b[0]}</button>`).join('')):''}
    <div class="fsummary">
      <span><b>${list.length}</b> piece${list.length===1?'':'s'}${active?` · ${active} filter${active>1?'s':''} on`:''}</span>
      ${active||F.special?`<button class="btn sm" onclick="clearF()">Clear all</button>`:''}
      ${F.special==='unpriced'?'<span class="chip c-ser">showing unpriced only</span>':''}
      <span style="margin-left:auto">Location and status are separate questions, so they filter together —
        <b>Mumbai + On approval</b> is a valid ask.</span>
    </div>
  </div>

  ${list.length?`<div class="masonry">
    ${list.map(j=>{const c=costed(j),st=DB.styles[j.style];return `
      <article class="pin ${isLive(j)?'':'dead'}" data-code="${j.code}">
        ${jewelArt(j)}
        <div class="badge">${chip(j.state)}</div>
        ${j.loc?`<div class="locbadge">${DB.locations[j.loc]}</div>`:''}
        <div class="meta">
          <div class="pcode">${j.code}</div>
          <div class="pname">${st.name}</div>
          <div class="prow">
            <span class="price">${can('sale')?(c.sale?inr(c.sale):'<span class="chip c-ser">not costed</span>'):''}</span>
            ${j.ver>1?'<span class="chip c-ser">repaired</span>':''}
          </div>
          <div class="sub"><span>${metalLabel(j)}</span><span>·</span>
            <span>${j.grossWt.toFixed(2)} g</span>
            ${can('cost')&&c.cost?`<span>·</span><span>cost ${inr(c.cost)}</span>`:''}</div>
        </div>
      </article>`}).join('')}
  </div>`:`<div class="card"><div class="empty">Nothing matches those filters.<br><br>
    <button class="btn" onclick="clearF()">Clear all filters</button></div></div>`}
  ${!can('cost')?`<div class="note">Signed in as <b>${ROLES[role].name}</b> — no cost figure appears
    on any card, and the cost filter is not offered.</div>`:''}`;
}

function pgDetail(){
  const j=DB.jewels.find(x=>x.code===sel);
  if(!j) return `<div class="card"><h3>${sel} is not here</h3>
    <p class="hint">That jewel code is not in the catalogue you are looking at. It may have been
      deleted, or it may not have been imported.</p>
    <button class="btn" onclick="sel=null;page='stock';render()">← Back to stock</button></div>`;
  if(LIVE && !j._bomLoaded){
    loadPieceDetail(j.code).then(()=>{ if(sel===j.code) render(); })
      .catch(()=>{ j._bomLoaded = true; });
    return `<div class="card"><h3>${j.code}</h3>
      <p class="hint">Fetching this piece's materials and history…</p></div>`;
  }
  const c=costed(j); const bom=curBom(j);
  const st=DB.styles[j.style] || {name:j.style||'(no design)', cat:'—', nos:0};
  const tab=(id,label)=>`<button data-tab="${id}" aria-selected="${detailTab===id}">${label}</button>`;

  let inner='';
  if(detailTab==='overview'){
    const diff=+(j.grossWt-c.bomWt).toFixed(3);
    const cm=canMake(j);
    const liveN=DB.jewels.filter(x=>x.style===j.style&&x.state==='IN_STOCK').length;
    const row=(k,v,mono)=>`<div class="biorow"><dt>${k}</dt><dd class="${mono?'mono':''}">${v??'—'}</dd></div>`;

    inner=`
    ${can('sale')?`<div class="card">
      <div class="pricerow">
        <div>
          <div class="lbl">Sale price</div>
          <div class="bignum">${c.sale?inr(c.sale):'—'}</div>
          <div class="asof" style="margin-top:6px"><span class="livedot"></span>
            ${METALS[metalOf(j.purity)]?.name||'Metal'} ₹${pureRate(j.purity)}/g
            × ${(saleFactor(j.purity)*100).toFixed(1)}% = ₹${alloyRate(j.purity)}/g
            for ${j.purity} · as on ${RATE_AS_ON}</div>
        </div>
        ${can('cost')?`
        <div class="pcell">
          <div class="lbl">Cost — frozen on BOM v${bom.v}</div>
          <div class="midnum">${inr(c.cost)}</div>
          <div class="dim" style="font-size:11.5px;margin-top:4px">as the piece was made</div>
        </div>
        <div class="pcell now">
          <div class="lbl" style="color:var(--brand)">Cost — today
            <span class="ro">read only</span></div>
          <div class="midnum" style="color:var(--brand)">${c.cur!=null?inr(c.cur):'—'}</div>
          <div class="dim" style="font-size:11.5px;margin-top:4px">
            ${metalLabel2(j)} at ₹${alloyCostRate(j.purity)}/g today</div>
        </div>`:''}
      </div>
      ${can('margin')&&c.cost!=null&&c.cur!=null?`
      <div class="marginrow">
        <div><span class="lbl">Margin on frozen cost</span>
          <b class="mono">${inr(c.sale-c.cost)} · ${pct(c.sale-c.cost,c.sale)}</b></div>
        <div><span class="lbl">Margin at today's metal</span>
          <b class="mono ${c.sale-c.cur<=0?'bad':(c.sale-c.cur)/c.sale<0.25?'warn':'good'}">
            ${inr(c.sale-c.cur)} · ${pct(c.sale-c.cur,c.sale)}</b></div>
        ${c.cur>c.cost?`<div><span class="lbl">Metal has moved</span>
          <b class="mono">+${inr(c.cur-c.cost)}</b></div>`:''}
      </div>`:''}
      <div class="note">The frozen figure is what this piece <b>did</b> cost. The one beside it is
        what an identical piece would cost to make this morning — the only one worth quoting
        against. Sale follows the live ${(METALS[metalOf(j.purity)]?.name||'metal').toLowerCase()}
        rate; neither cost figure is ever written back.</div>
    </div>`:''}

    <div class="card"><h3>Identity</h3>
      <div class="bio">
        <dl>${row('Jewel code',j.code+(LIVE?' <span class="dim" style="font-size:11px">· cannot be changed</span>':''),1)}
          ${row('Style / design no',st.code,1)}
          ${row('Design name',st.name)}${row('Category',st.cat)}
          ${erow('collection',j.collection)}${erow('sub_category',j.subCat)}</dl>
        <dl>${erow('karat',j.purity)}${erow('colour',j.colour)}
          ${erow('quality',j.quality)}${erow('size',j.size)}
          ${row('FG date',j.received)}${erow('vendor',j.vendorName)}</dl>
      </div>
    </div>

    <div class="card"><h3>Weights &amp; dimensions</h3>
      <div class="bio">
        <dl>${erow('gross_wt',j.grossWt?j.grossWt.toFixed(3):null,1)}
          ${row('Net metal weight (NWT)',c.metal?c.metal.toFixed(3)+' g':'—',1)}
          ${row('BOM-derived weight',c.bomWt?c.bomWt.toFixed(3)+' g':'—',1)}
          ${row('Difference',(diff>0?'+':'')+diff.toFixed(3)+' g '+(Math.abs(diff)<=0.05
            ?'<span class="chip c-good">in tolerance</span>':'<span class="chip c-crit">out of tolerance</span>'),1)}</dl>
        <dl>${erow('length_mm',j.lengthMm)}${erow('breadth_mm',j.breadthMm)}
          ${erow('height_mm',j.heightMm)}${erow('huid',j.huid)}
          ${row('Material classes',[...new Set(c.lines.map(l=>DB.materials[l.m].cls))]
            .filter(x=>x!=='LABOUR').length+' in this piece')}</dl>
      </div>
    </div>

    <div class="card"><h3>Compliance</h3>
      <div class="bio">
        <dl>${row('Hallmarked', (j.huid || j.hallmarkedOn)
              ? '<span class="chip c-good">Yes</span>'
              : '<span class="chip c-warn">not recorded</span>')}
          ${row('HUID', j.huid || '<span class="dim">not recorded</span>', 1)}</dl>
        <dl>${row('Certificate company',j.certCompany)}${row('Certificate code',j.certNo,1)}</dl>
      </div>
      <div class="note">HUID is engraved per individual article by BIS rule — it is the one identifier
        that legally cannot live at design level.</div>
    </div>

    <div class="card"><h3>Availability</h3>
      <div class="bio">
        <dl>${row('Status',chip(j.state))}${row('Location',j.loc?DB.locations[j.loc]:'—')}</dl>
        <dl>${row('Received on',j.received)}${row('Party approval',j.partyApproval||'—')}</dl>
      </div>
    </div>

    ${can('planning')?`<div class="card"><h3>Planning</h3>
      <div class="bio">
        <dl>${row('NOS floor (this design)',st.nos)}
          ${row('Live pieces of design',liveN)}</dl>
        <dl>${row('Should make',liveN<st.nos
            ?`<span class="chip c-ser">yes — ${st.nos-liveN} short</span>`
            :'<span class="chip c-good">no</span>')}
          ${row('Can make',cm.ok?'<span class="chip c-good">yes</span>'
            :`<span class="chip c-crit">no</span>`)}</dl>
      </div>
      ${!cm.ok?`<div class="note bad"><b>Cannot make another.</b> Short on:
        ${cm.missing.map(x=>`${DB.materials[x.m].name} — need ${x.need.toFixed(2)}, have ${x.have.toFixed(2)}`).join(' · ')}.
        “Should make” is a demand question; “can make” is a materials question. They disagree constantly.</div>`:''}
    </div>`:''}

    ${can('vendor')?`<div class="card"><h3>Vendor &amp; turnaround</h3>
      <div class="bio">
        <dl>${row('Vendor', j.vendorName
              ? j.vendorName + (j.vendorCode?' ('+j.vendorCode+')':'')
              : '<span class="dim">not recorded</span>')}
          ${row('Job card', j.jobCard || '<span class="dim">not recorded</span>', 1)}</dl>
        <dl>${row('Vendor average TAT', j.vendorTat!=null
              ? j.vendorTat+' days' : '<span class="dim">no completed jobs yet</span>')}
          ${row('This design, average TAT', j.avgTat!=null
              ? j.avgTat+' days' : '<span class="dim">no completed jobs yet</span>')}</dl>
      </div>
    </div>`:''}`;
  }

  if(detailTab==='pricing'){
    inner = `<div class="card">
      <div class="spread"><div>
        <h3>This piece under every scenario</h3>
        <p class="hint" style="margin:0;max-width:82ch">The scenarios kept in Settings, priced
          against this piece as it stands now. Nothing is stored until you put the piece on one.
          Metal and making repeat down every row because a scenario cannot touch them.</p>
      </div></div>
      <div id="scmsg"></div>
      <table style="margin-top:14px"><thead><tr>
        <th style="width:26px"></th><th>Scenario</th>
        <th class="num" style="width:106px">Metal</th>
        <th class="num" style="width:100px">Stones</th>
        <th class="num" style="width:100px">Making</th>
        <th class="num" style="width:112px">Price</th>
        <th class="num" style="width:86px">Margin</th>
        <th class="num" style="width:78px">Stone ×</th>
      </tr></thead><tbody id="screns">
        <tr><td colspan="8" class="dim">Working it out…</td></tr></tbody></table>
      <div class="note">Margin is measured against <b>cost today</b>, not the frozen figure —
        it is what you would make if you replaced the piece at this morning's metal rate.</div>
    </div>`;
  }

  if(detailTab==='bom'){
    if(!can('materials')){
      inner=`<div class="card"><div class="empty">🔒 The material breakup is not available to
        <b>${ROLES[role].name}</b>.<br><br>Switch the role selector at the top right.</div></div>`;
    } else {
      // Customer-facing sale breakup: grouped by material class, sale side only.
      /* Same six categories as the bill of materials below and the Materials
         tab — one vocabulary everywhere, so a customer breakup and an internal
         one describe the piece with the same words. */
      const METALNAME = (METALS[metalOf(j.purity)]||{}).name || 'Metal';
      const GROUPS=[['METAL', METALNAME+' ('+j.purity+')','GM'],
                    ['DIAMOND','Diamond','CT'],['POLKI','Diamond Polki','CT'],
                    ['COLOUR_STONE','Setting Stones','CT'],['PEARL','Setting Stones','CT'],
                    ['FINDING','Other Materials','GM'],['OTHER','Other Materials','CT'],
                    ['LABOUR','Making','GM']];
      const groups=GROUPS.map(([cls,label,u])=>{
        const ls=c.lines.filter(l=>DB.materials[l.m].cls===cls);
        if(!ls.length) return null;
        const showPcs=!['METAL','LABOUR','FINDING'].includes(cls);
        return {label,u,pcs:showPcs?ls.reduce((a,l)=>a+(l.pcs||0),0):0,
                qty:+ls.reduce((a,l)=>a+(l.qty||0),0).toFixed(3),
                cost:ls.reduce((a,l)=>a+l.cost,0), sale:ls.reduce((a,l)=>a+l.sale,0)};
      }).filter(Boolean);

      const money = can('sale') ? 'sale' : (can('cost')?'cost':null);

      inner=`
      ${c.lines.length&&money?`<div class="card">
        <h3>Sale breakup</h3>
        <p class="hint">What the customer is shown. Rolled up by material, ${can('cost')?'no cost figures — ':''}this is
          the ${money==='sale'?'sale':'cost'} side only.</p>
        <div class="breakup">
          <div class="brow bhead"><span>Component</span><span class="n">Pcs</span>
            <span class="n">Weight</span><span class="n">Amount</span></div>
          ${groups.map(g=>`<div class="brow"><span>${g.label}</span>
            <span class="n">${g.pcs||'—'}</span>
            <span class="n">${g.qty?g.qty.toFixed(2)+' '+g.u:'—'}</span>
            <span class="n">${inr(g[money])}</span></div>`).join('')}
          <div class="brow btot"><span>Total${money==='sale'?' sale price':' cost'}</span><span></span>
            <span class="n">${j.grossWt.toFixed(3)} g gross</span>
            <span class="n">${inr(money==='sale'?c.sale:c.cost)}</span></div>
        </div>
        ${money==='sale'?`<div class="note">Gold rate is derived from the pure rate, never typed in:
          <b>₹${pureRate(j.purity)}/g pure ${(METALS[metalOf(j.purity)]?.name||'metal').toLowerCase()} × ${(saleFactor(j.purity)*100).toFixed(1)}% (${j.purity} sale purity) = ₹${alloyRate(j.purity)}/g</b>.
          True fineness of ${j.purity} is ${(trueFineness(j.purity)*100).toFixed(2)}% — the
          ${((saleFactor(j.purity)-trueFineness(j.purity))*100).toFixed(2)} point spread is deliberate margin, not a rounding error.</div>`:''}
        <div class="note">Charged on <b>${c.metal} g net metal</b>; the making charge follows the same weight —
          ₹${rate('MAKING','',money==='sale'?1:0,j.purity)}/g × ${c.metal} g.
          Gross weight (${j.grossWt.toFixed(3)} g) includes the stones, so it is never the basis for making.</div>
      </div>`:''}

      <div class="card">
        <div class="spread" style="margin-bottom:10px">
          <div><h3>Full bill of materials — version ${bom.v}
            <span class="chip ${bom.reason==='REPAIR'?'c-ser':'c-neutral'}">${bom.reason}</span></h3>
            <p class="hint" style="margin:0">${bom.note||'Line-level detail behind the breakup above.'}</p></div>
          <div class="row" style="gap:8px">
            ${can('editBom')?`<button class="btn sm" id="refresh-chart">↻ Refresh rates from chart</button>
            <button class="btn sm" data-act="editbom">✎ Edit BOM</button>`:''}
            ${j.ver>1?`<button class="btn sm" data-act="compare">Compare with v${j.ver-1}</button>`:''}
          </div>
        </div>
        ${c.lines.length?`
        <div style="overflow-x:auto">
        <table class="bomtab" style="min-width:${can('cost')&&can('sale')?'1046':'760'}px">
        <thead>
          <tr class="band">
            <th colspan="5"></th>
            ${can('cost')?'<th colspan="2" class="c-old">Cost — frozen on BOM v'+bom.v+'</th>'
                          +'<th colspan="2" class="c-new">Cost — today</th>':''}
            ${can('sale')?'<th colspan="3">Sale</th>':''}
          </tr>
          <tr>
            <th style="width:82px">Code</th><th style="min-width:120px">Material</th>
            <th style="width:64px">Size</th>
            <th class="num" style="width:44px">Pcs</th>
            <th class="num" style="width:82px">Weight</th>
            ${can('cost')?'<th class="num c-old" style="width:72px">Rate</th>'
                          +'<th class="num c-old" style="width:86px">Cost</th>'
                          +'<th class="num c-new" style="width:72px">Rate</th>'
                          +'<th class="num c-new" style="width:86px">Cost</th>':''}
            ${can('sale')?'<th class="num" style="width:72px">Rate</th>'
                          +'<th class="num" style="width:88px">Sale</th>'
                          +'<th class="num" style="width:74px">%</th>':''}
          </tr>
        </thead><tbody>
        ${(()=>{
          /* Grouped by material category, the way a breakup is read. Lines
             keep their own row so nothing is hidden inside a subtotal. */
          const CATS=[['METAL','Metal'],['DIAMOND','Diamond'],['POLKI','Diamond Polki'],
                      ['COLOUR_STONE','Setting Stones'],['PEARL','Setting Stones'],
                      ['FINDING','Other Materials'],['OTHER','Other Materials'],
                      ['LABOUR','Making']];
          const nameOf = m => (CATS.find(x=>x[0]===(DB.materials[m]||{}).cls)||[,'Other Materials'])[1];
          const order = ['Metal','Diamond','Diamond Polki','Setting Stones','Purai Stones',
                         'Other Materials','Making'];
          const seen = {};
          c.lines.forEach(l=>{ const g=nameOf(l.m); (seen[g]=seen[g]||[]).push(l); });
          const total = can('sale') ? c.sale : c.cost;
          const COL = {'Metal':'#b8912f','Diamond':'#8a6d9e','Diamond Polki':'#6b7f9e',
                       'Setting Stones':'#4f8a6b','Purai Stones':'#a8894f',
                       'Other Materials':'#8c8a83','Making':'#b06a4a'};
          let out='';
          order.filter(g=>seen[g]).forEach(g=>{
            const span = 5 + (can('cost')?4:0) + (can('sale')?3:0);
            out += `<tr class="grp"><td colspan="${span}">${g}</td></tr>`;
            seen[g].forEach(l=>{
              const mat = DB.materials[l.m]||{name:l.m};
              const moved = can('cost') && l.curCost!=null && l.curCost!==l.cost;
              const share = total ? (100*(can('sale')?l.sale:l.cost)/total) : 0;
              const cRate = (l.cr!=null)?l.cr:rate(l.m,l.band,0,j.purity);
              const nRate = mat.cls==='METAL' ? alloyCostRate(j.purity) : cRate;
              out += `<tr>
                <td class="code">${l.m}</td>
                <td>${mat.name}${l.basis==='BY_NET_METAL_WT'
                    ?' <span class="dim" style="font-size:11px">· on net metal weight</span>':''}
                    ${l.offChart?' <span class="chip c-warn" style="font-size:10px">off chart</span>':''}</td>
                <td class="dim mono" style="font-size:12px">${l.band||'—'}</td>
                <td class="num">${l.pcs??'<span class="dim">—</span>'}</td>
                <td class="num">${l.qty!=null?l.qty.toFixed(l.uom==='GM'?3:2)+' '+l.uom.toLowerCase():'—'}</td>
                ${can('cost')?`<td class="num c-old">${cRate?Math.round(cRate).toLocaleString('en-IN'):'—'}</td>
                  <td class="num c-old">${inr(l.cost)}</td>
                  <td class="num c-new"${moved?' style="font-weight:600;color:var(--brand)"':' class="num c-new dim"'}>${nRate?Math.round(nRate).toLocaleString('en-IN'):'—'}</td>
                  <td class="num c-new"${moved?' style="font-weight:600;color:var(--brand)"':''}>${l.curCost!=null?inr(l.curCost):'—'}</td>`:''}
                ${can('sale')?`<td class="num">${Math.round(mat.cls==='METAL'?alloyRate(j.purity)
                      :((l.sr!=null)?l.sr:rate(l.m,l.band,1,j.purity))).toLocaleString('en-IN')}</td>
                  <td class="num">${inr(l.sale)}</td>
                  <td class="num"><span style="display:flex;align-items:center;gap:7px;justify-content:flex-end">
                    <span class="sbar" style="width:${Math.max(2,Math.round(share*0.38))}px;
                      background:${COL[g]||'#8c8a83'}"></span>${share.toFixed(1)}%</span></td>`:''}
              </tr>`;
            });
          });
          return out;
        })()}
        <tr class="btotrow">
          <td colspan="5" style="text-align:right">Total</td>
          ${can('cost')?`<td class="num c-old"></td><td class="num c-old"><b>${inr(c.cost)}</b></td>
            <td class="num c-new"></td>
            <td class="num c-new"><b style="color:var(--brand)">${c.cur!=null?inr(c.cur):'—'}</b></td>`:''}
          ${can('sale')?`<td class="num"></td><td class="num"><b>${inr(c.sale)}</b></td>
            <td class="num"><b>100%</b></td>`:''}
        </tr>
        </tbody></table></div>
        ${!money?`<div class="note">Your role sees <b>what is in the piece</b> but no rates or amounts —
          production needs the material list, not the pricing.</div>`:''}
        ${can('cost')?`<div class="note">Only the <b>metal</b> rows differ between the two cost columns.
          Everything else carries the rate written on its line and does not drift.</div>`:''}
        `:`<div class="empty">This piece has no costed BOM. It contributes zero to stock valuation.</div>`}
      </div>`;
    }
  }

  if(detailTab==='history'){
    inner=`<div class="card"><h3>BOM versions</h3>
      <p class="hint">A repair forks the bill of materials. Old versions stay readable so past valuations don't silently rewrite themselves.</p>
      <table><thead><tr><th>Version</th><th>Reason</th><th>Note</th><th>Date</th>
