<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nornament — Stock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a6d2f'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ec;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --line:#e1e0d9; --rule:#c3c2b7; --ring:rgba(11,11,11,.10);
  --brand:#8a6d2f; --brand-soft:#f4eee0;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --critical-ink:#a32a2a; --serious-ink:#9c4a22; --warning-ink:#7a5600;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px rgba(11,11,11,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --rule:#383835; --ring:rgba(255,255,255,.10);
  --brand:#d4af62; --brand-soft:#2a241a;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#0ca30c; --critical-ink:#e06a6a; --serious-ink:#ec835a; --warning-ink:#fab219;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}


.brand{position:relative;cursor:pointer}
.brand.drag{outline:2px dashed var(--brand);outline-offset:-6px;background:var(--brand-soft)}
.brand .logoimg{max-width:100%;max-height:64px;display:block}
.brand .drop{border:1.5px dashed var(--rule);border-radius:9px;padding:14px 10px;text-align:center;
  color:var(--muted);font-size:11.5px;line-height:1.45}
.brand .drop b{display:block;color:var(--ink-2);font-size:13px;margin-bottom:2px}
.brand .rm{position:absolute;top:6px;right:6px;background:var(--surface);border:1px solid var(--rule);
  border-radius:6px;padding:1px 6px;font-size:11px;color:var(--muted);opacity:0;transition:.15s}
.brand:hover .rm{opacity:1}

/* ---------- sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:16px;margin:0;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.nav{padding:10px 10px;overflow:auto;flex:1}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:8px 10px;border-radius:7px;color:var(--ink-2);font-size:14px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav button:disabled{opacity:.34;cursor:not-allowed}
.nav .ico{width:17px;text-align:center;font-size:14px}
.nav .lockicon{margin-left:auto;font-size:10.5px;color:var(--muted)}
.navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  padding:14px 10px 5px;font-weight:600}
.whoami{border-top:1px solid var(--line);padding:12px 14px;font-size:12.5px;color:var(--muted)}

/* ---------- topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:12px 26px;display:flex;align-items:center;gap:12px}
.top h2{font-size:17px;margin:0;letter-spacing:-.01em;flex:1}
.roleswitch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{
  background:var(--surface);color:var(--ink);border:1px solid var(--rule);
  border-radius:7px;padding:6px 9px;font:inherit;font-size:13.5px}
textarea{width:100%;resize:vertical;line-height:1.5}
.iconbtn{background:var(--surface);border:1px solid var(--rule);border-radius:7px;
  padding:5px 9px;color:var(--ink-2);font-size:13px}
.body{padding:24px 26px 72px;max-width:1180px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 3px;font-size:14.5px;letter-spacing:-.005em}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}

/* stat tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 17px}
.kpi .lbl{font-size:12px;color:var(--ink-2);margin-bottom:6px}
.kpi .val{font-size:29px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi.alert{border-color:var(--serious)}
.kpi.alert .val{color:var(--serious-ink)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
td.code{font-family:var(--mono);font-size:13px;font-weight:600}
.dim{color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2.5px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:99px;flex:none}
.c-good{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 34%,transparent)}
.c-warn{background:color-mix(in srgb,var(--warning) 17%,transparent);color:var(--warning-ink);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.c-ser{background:color-mix(in srgb,var(--serious) 15%,transparent);color:var(--serious-ink);border-color:color-mix(in srgb,var(--serious) 40%,transparent)}
.c-crit{background:color-mix(in srgb,var(--critical) 13%,transparent);color:var(--critical-ink);border-color:color-mix(in srgb,var(--critical) 36%,transparent)}
.c-neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  padding:7px 13px;font-size:13.5px;color:var(--ink);font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a1a19}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.danger:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}

/* masked values */
.masked{display:inline-flex;align-items:center;gap:5px;color:var(--muted);
  font-size:12px;font-style:italic}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;
  color:var(--ink-2);font-size:13.5px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(11,11,11,.42);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:60}
.scrim.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);width:min(660px,100%);max-height:88vh;overflow:auto}
.modal header{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0 0 2px;font-size:16px}
.modal header p{margin:0;font-size:12.5px;color:var(--muted)}
.modal .content{padding:18px 22px}
.modal footer{padding:14px 22px 18px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:9px}
label.f{display:block;font-size:12px;color:var(--ink-2);margin:0 0 5px;font-weight:600}
.field{margin-bottom:15px}

/* misc */
.note{border-left:3px solid var(--brand);padding:1px 0 1px 14px;margin:14px 0;
  font-size:13px;color:var(--ink-2)}
.note.bad{border-left-color:var(--critical)}
.note.ok{border-left-color:var(--good)}
.toast{position:fixed;right:22px;bottom:22px;z-index:80;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--good);border-radius:10px;
  padding:12px 16px;box-shadow:var(--shadow);font-size:13.5px;max-width:380px;
  opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.err{border-left-color:var(--critical)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--brand);padding:0;font-size:12.5px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
.scanlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.scanpill{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;
  padding:4px 11px;font-family:var(--mono);font-size:12.5px}
.legendkey{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.diff-add{color:var(--good-ink);font-weight:600}
.diff-rm{color:var(--critical-ink);font-weight:600}


.th{display:inline-block;border-radius:9px;overflow:hidden;border:1px solid var(--line);
  flex:none;vertical-align:middle;background:var(--surface-2)}
.th .thart{width:100%;height:100%;display:block}
.cellrow{display:flex;align-items:center;gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  cursor:pointer;transition:.15s}
.dcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.dcard .thart{width:100%;height:150px;display:block}
.dcard .m{padding:11px 13px 13px}
.mediagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.mtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.mtile .thart{width:100%;height:118px;display:block}
.mtile .cap{padding:7px 9px;font-size:11px;color:var(--muted)}
.hero{display:flex;gap:16px;align-items:center}


.ticker{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--rule);
  border-radius:9px;padding:4px 10px 4px 12px;font-size:12.5px}
.ticker .tl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ticker .tv{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.ticker .derived{font-family:var(--mono);font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:9px}
.ticker input{width:86px;padding:3px 7px;font-size:12.5px;font-family:var(--mono)}
.ticker .up{color:var(--good-ink);font-weight:600;font-size:11.5px}
.ticker .down{color:var(--critical-ink);font-weight:600;font-size:11.5px}
.asof{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.livedot{width:6px;height:6px;border-radius:99px;background:var(--good);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.bio{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 26px}
.bio dl{margin:0}
.biorow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.biorow dt{color:var(--muted);flex:none}
.biorow dd{margin:0;text-align:right;font-weight:500}
.biorow dd.mono{font-family:var(--mono);font-size:12.5px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tagchip{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;
  padding:3px 10px;font-size:12px;color:var(--ink-2)}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}


.videoblock{display:flex;gap:16px;align-items:stretch;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;background:var(--surface-2)}
.vidart{position:relative;width:210px;flex:none;background:var(--surface)}
.vidart .thart{width:100%;height:100%;display:block;filter:brightness(.92)}
.playbtn{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:99px;
  background:color-mix(in srgb,var(--ink) 82%,transparent);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:17px;padding-left:3px}
.vidmeta{padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.points{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.points li{margin-bottom:5px}
.points li::marker{color:var(--brand);font-weight:600}
.picker{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.pickrow{display:flex;align-items:center;gap:11px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pickrow:last-child{border-bottom:0}
.pickrow:hover{background:var(--surface-2)}
.pickrow.on{background:var(--brand-soft)}


.btn.perm{padding:3px 10px;font-size:12px;border-radius:99px}
.btn.perm.on{background:color-mix(in srgb,var(--good) 14%,transparent);
  border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--good-ink);font-weight:600}

/* ---------- filter bar ---------- */
.filterbar{position:sticky;top:53px;z-index:15;background:color-mix(in srgb,var(--page) 92%,transparent);
  backdrop-filter:blur(8px);padding:14px 0 12px;margin:-4px 0 18px;border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.frow:last-of-type{margin-bottom:0}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:600;width:74px;flex:none}
.fchips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.fchip{background:var(--surface);border:1px solid var(--rule);border-radius:99px;
  padding:5px 14px;font-size:13px;color:var(--ink-2);transition:.12s}
.fchip:hover{border-color:var(--brand);color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
:root[data-theme="dark"] .fchip[aria-pressed="true"]{color:#1a1a19}
.modal.wide{max-width:1120px;width:94vw}
.mgroup{border-top:1px solid var(--line);padding:18px 0 4px}
.mgroup:first-of-type{border-top:0;padding-top:8px}
.mghead h4{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.mgico{color:var(--brand);font-size:15px}
.mgcount{font-size:11px;color:var(--muted);font-weight:500}
.mgnote{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.mgscope{display:block;font-size:11.5px;color:var(--muted);opacity:.85}
/* Cards were stretching to whatever the tallest caption happened to be, so a
   long filename or a fifth action link left the grid ragged. Every card is
   now the same height, the name gets one line, and the actions wrap into a
   fixed block instead of pushing the card taller. */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
  gap:14px;margin-top:14px;align-items:start}
.mcard{margin:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--surface);display:flex;flex-direction:column;height:246px}
.mshot{position:relative;height:140px;flex:none;background:var(--surface-2);display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.mshot img,.mshot video{width:100%;height:100%;object-fit:cover;display:block}
.mext{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.mhero{position:absolute;top:7px;left:7px;background:var(--brand);color:#fff;font-size:10px;
  padding:2px 7px;border-radius:99px;letter-spacing:.04em;max-width:calc(100% - 14px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard figcaption{padding:8px 10px 9px;display:flex;flex-direction:column;gap:2px;
  flex:1;min-height:0}
.mname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.35}
.mmeta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.macts{font-size:11px;display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:auto;
  padding-top:6px;border-top:1px solid var(--line)}
.macts a{color:var(--brand);text-decoration:none;white-space:nowrap}
.macts a:hover{text-decoration:underline}
.macts a.mdel{color:var(--critical-ink)}
.madd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  height:246px;border:1.5px dashed var(--rule);border-radius:11px;
  background:none;cursor:pointer;color:var(--muted);font:inherit;padding:12px;text-align:center}
.madd:hover{border-color:var(--brand);color:var(--ink);background:var(--surface-2)}
.maddplus{font-size:22px;line-height:1;color:var(--brand)}
.maddlabel{font-size:12.5px;font-weight:600}
.maddtypes{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;opacity:.75;
  word-break:break-all;line-height:1.5}
.mph{height:150px;border-radius:8px;background:var(--surface-2);display:flex;
  align-items:center;justify-content:center;color:var(--muted);font-size:12px;
  text-transform:uppercase;letter-spacing:.06em}
.editable{cursor:text;border-bottom:1px dashed var(--rule);padding-bottom:1px}
.editable:hover,.editable:focus{border-bottom-color:var(--brand);outline:none}
.editable .pen{opacity:0;margin-left:7px;font-size:11px;color:var(--brand)}
.editable:hover .pen,.editable:focus .pen{opacity:1}
.unset{color:var(--muted);font-style:italic;font-weight:400}
input.inplace,select.inplace{width:auto;min-width:110px;max-width:230px;padding:3px 7px;
  font-size:13px;border:1px solid var(--brand);border-radius:6px;text-align:right;
  background:var(--surface);color:var(--ink);font-family:inherit}
.gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;background:var(--page);padding:24px}
.gate[hidden]{display:none}
.gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:34px 30px 28px;box-shadow:var(--shadow)}
.gatelogo{display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.gatelogo img{width:232px;height:auto;display:block}
/* the mark is black artwork; on a dark screen it has to be flipped */
:root[data-theme="dark"] .gatelogo img,:root[data-theme="dark"] .brandimg{filter:invert(1)}
.glbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.gate input{width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:9px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.gate input:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:var(--brand)}
.gatebtn{width:100%;margin-top:22px;padding:12px;font-size:15px}
.gatefoot{font-size:12px;color:var(--muted);line-height:1.6;margin:16px 0 0}
.brandimg{display:block;width:100%;max-width:150px;height:auto;margin:0 auto}
.gateerr{background:#fdeaea;border:1px solid #f2c4c4;color:var(--critical-ink);
  padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:16px}
:root[data-theme="dark"] .gateerr{background:#2a1313;border-color:#4a1e1e}
.dropzone{border:2px dashed var(--rule);border-radius:14px;padding:40px 22px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:.15s}
.dropzone:hover,.dropzone.over{border-color:var(--brand);background:var(--surface)}
.livepill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand);
  border:1px solid var(--brand)}
.fsummary{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--muted)}
.fsummary b{color:var(--ink)}

/* ---------- pinterest / masonry grid ---------- */
.masonry{columns:4;column-gap:16px}
@media(max-width:1250px){.masonry{columns:3}}
@media(max-width:900px){.masonry{columns:2}}
@media(max-width:560px){.masonry{columns:1}}
.pin{break-inside:avoid;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.pin:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.pin .art{display:block;width:100%;background:var(--surface-2)}
.pin .meta{padding:11px 13px 13px}
.pin .pcode{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.01em}
.pin .pname{font-size:12.5px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin .prow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
.pin .price{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pin .sub{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.pin .badge{position:absolute;top:10px;left:10px}
.pin .locbadge{position:absolute;top:10px;right:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(4px);border:1px solid var(--ring);border-radius:99px;
  padding:3px 9px;font-size:11px;color:var(--ink-2);font-weight:600}
.pin.dead .art{filter:grayscale(1);opacity:.5}

/* customer breakup */
.breakup{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.breakup .brow{display:grid;grid-template-columns:1.6fr .9fr .9fr 1fr;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.breakup .brow:last-child{border-bottom:0}
.breakup .bhead{background:var(--surface-2);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);font-weight:600}
.breakup .btot{background:var(--brand-soft);font-weight:600}
.breakup .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}

@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}}

/* ── Add-a-piece form ──────────────────────────────────────────────────────
   The old version was one flat 3-column grid of twelve boxes with no labels
   worth the name. Grouping them into Identity / Metal / Where / Materials is
   the whole fix: you can see what a section is for before reading its fields. */
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
     text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.lbl .req{margin-left:6px;font-size:9.5px;letter-spacing:.04em;color:var(--critical);
     background:color-mix(in srgb,var(--critical) 11%,transparent);
     border-radius:3px;padding:1px 5px;text-transform:uppercase}
.npsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.npsec:first-of-type{border-top:0;padding-top:4px}
.nphead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
        color:var(--muted);margin-bottom:12px}
.nphead .nphint{display:block;text-transform:none;letter-spacing:0;font-weight:400;
        font-size:12px;color:var(--muted);margin-top:5px;max-width:74ch;line-height:1.5}
.npgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;margin-bottom:12px}
.npgrid.npgrid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.npf input[readonly]{opacity:.62;cursor:not-allowed}
.npgrid:last-child{margin-bottom:0}
.npf input:not([type=checkbox]),.npf select{width:100%;box-sizing:border-box}
.npnote{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.npwarn{font-size:12.5px;color:var(--muted);line-height:1.55;
        border-left:3px solid var(--warning);padding:2px 0 2px 12px;margin-top:4px}
.npfoot{position:sticky;bottom:0;margin:20px -22px -20px;padding:14px 22px;
        background:var(--surface);border-top:1px solid var(--line);
        display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.npsum{font-size:13px}
.npsum b{font-variant-numeric:tabular-nums}
.npscroll{overflow-x:auto;margin:0 -2px;padding:0 2px}
.mattab{min-width:920px;width:100%}
.mattab th{font-size:10.5px;white-space:nowrap}
.mattab td{padding:5px 6px;vertical-align:middle}
.mattab td input,.mattab td select{width:100%;box-sizing:border-box;font-size:12.5px;padding:5px 7px}
.mattab col.c-code{width:17%} .mattab col.c-name{width:19%}

@media (max-width:900px){ .npgrid{grid-template-columns:1fr} }

/* ── real photographs in list thumbnails ──────────────────────────────── */
.th.thpic{padding:0;overflow:hidden;background:var(--surface-2,#f2f0ea)}
.th.thpic img{width:100%;height:100%;object-fit:cover;display:block}

/* ── media tiles ──────────────────────────────────────────────────────── */
.mshot.clickable{cursor:zoom-in}
.mshot video{width:100%;height:100%;object-fit:cover;display:block}
.mcard.ishero{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
.mhero{position:absolute;left:8px;top:8px;background:var(--brand);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px}
.mconv{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;
  font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 6px;border-radius:4px}
.mnoview{position:absolute;left:0;right:0;bottom:0;padding:7px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;
  font-size:10.5px;font-weight:700;line-height:1.35;text-align:center}
.mnoview span{display:block;font-weight:400;opacity:.85;font-size:9.5px;margin-top:2px}

/* ── viewer ───────────────────────────────────────────────────────────── */
.vwrap{margin:-20px -22px;display:flex;flex-direction:column;min-height:0}
.vstage{position:relative;background:#14140f;display:flex;align-items:center;
  justify-content:center;min-height:52vh;max-height:74vh;border-radius:12px 12px 0 0}
.vstage img,.vstage video{max-width:100%;max-height:74vh;display:block;object-fit:contain}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;
  border-radius:99px;border:0;background:rgba(255,255,255,.14);color:#fff;
  font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}
.vnav:hover{background:rgba(255,255,255,.26)}
.vprev{left:12px} .vnext{right:12px}
.vnone{color:#e8e5dc;text-align:center;padding:60px 24px;font-size:14px;line-height:1.6}
.vnone span{display:block;opacity:.7;font-size:12.5px;margin-top:8px}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 20px;background:var(--surface);border-radius:0 0 12px 12px;flex-wrap:wrap}
.vmeta{font-size:13px;min-width:0}
.vmeta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52ch}
.vmeta .dim{font-size:11.5px}

/* a real photograph standing in for the generated artwork */
.jart{display:block;width:100%;height:auto;background:var(--surface-2)}
.jart.sq{aspect-ratio:1/1;height:100%;object-fit:cover}
.pin .jart{aspect-ratio:auto;object-fit:cover}
.dcard .jart{aspect-ratio:1/1;object-fit:cover}
.hero .th.thpic img,.th.thpic img{object-fit:cover}
.vidart .jart{aspect-ratio:1/1;object-fit:cover}

/* ── piece price header: sale, frozen cost, today's cost ──────────────── */
.pricerow{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pricerow>div{background:var(--surface);padding:15px 17px}
.pricerow .lbl{font-size:11.5px;color:var(--ink-2);font-weight:600;
  letter-spacing:.03em;display:flex;align-items:center;gap:7px}
.pricerow .bignum{font-family:var(--mono);font-size:30px;font-weight:600;
  letter-spacing:-.025em;margin-top:5px;line-height:1.05}
.pricerow .midnum{font-family:var(--mono);font-size:22px;font-weight:600;
  letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.pricerow .pcell.now{background:var(--brand-soft)}
.pricerow .ro{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);
  border-radius:4px;padding:1px 5px}
.marginrow{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line)}
.marginrow .lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:600;margin-bottom:2px}
.marginrow b{font-size:16px;font-weight:600}
.marginrow b.good{color:var(--good-ink)} .marginrow b.warn{color:var(--serious-ink)}
.marginrow b.bad{color:var(--critical-ink)}
@media (max-width:820px){ .pricerow{grid-template-columns:1fr} }

.tgroup{display:inline-flex;align-items:center;gap:7px}
.msep{display:inline-block;width:1px;height:18px;background:var(--rule);margin:0 12px}

.rin{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;
  font-size:12.5px;font-family:var(--mono);text-align:right;width:96px;color:var(--ink)}
.rin:disabled{opacity:.5}

/* ── full bill of materials ───────────────────────────────────────────── */
.bomtab th{font-size:9.5px;padding:6px 6px}
.bomtab td{padding:6px 6px;font-size:12.5px}
.bomtab td.num,.bomtab th.num{font-size:11.5px}
.bomtab .band th{border-bottom:0;padding-bottom:2px;text-align:center;font-size:9.5px;color:var(--muted)}
.bomtab .c-old{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.bomtab .c-new{background:var(--brand-soft)}
.bomtab thead th.c-new{color:var(--brand)}
.bomtab tr.grp td{background:var(--surface-2);padding:4px 8px;font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.bomtab tr.btotrow td{border-top:2px solid var(--rule);border-bottom:0;background:var(--surface)}
.sbar{height:7px;border-radius:2px;display:block;flex:none}

/* ── physical stock count ─────────────────────────────────────────────── */
.lcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0 4px}
.loccard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 15px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:3px;
  transition:border-color .12s,box-shadow .12s}
.loccard:hover{border-color:var(--rule);box-shadow:var(--shadow)}
.loccard.resume{border-color:var(--warning);background:color-mix(in srgb,var(--warning) 7%,var(--surface))}
.loccard .lcname{font-size:14.5px;font-weight:600}
.loccard .lccode{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.loccard .lcn{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.loccard .chip,.loccard .dim{margin-top:8px;align-self:flex-start}

.scanbar{display:flex;gap:9px;align-items:center;margin:16px 0 12px;flex-wrap:wrap}
.scanbar input{flex:1;min-width:240px;background:var(--surface);border:2px solid var(--rule);
  border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:16px;color:var(--ink);
  letter-spacing:.03em}
.scanbar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.scanbar input:disabled{opacity:.55}

.vbanner{border-radius:8px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:baseline;
  gap:11px;flex-wrap:wrap;border:1px solid transparent;animation:vpop .16s ease-out}
@keyframes vpop{from{transform:translateY(-3px);opacity:.4}to{transform:none;opacity:1}}
.vbanner .vcode{font-family:var(--mono);font-size:15px;font-weight:600}
.vbanner .vsay{font-size:13px}
.vb-good{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--good-ink)}
.vb-warn{background:color-mix(in srgb,var(--warning) 13%,var(--surface));border-color:color-mix(in srgb,var(--warning) 45%,transparent);color:var(--warning-ink)}
.vb-crit{background:color-mix(in srgb,var(--critical) 10%,var(--surface));border-color:color-mix(in srgb,var(--critical) 40%,transparent);color:var(--critical-ink)}
.vb-mute{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}

.ctally{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){ .ctally{grid-template-columns:repeat(2,1fr)} }
.tcard{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.tcard .tl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:700}
.tcard .tv{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:3px;display:block}
.tcard.good .tv{color:var(--good-ink)} .tcard.crit .tv{color:var(--critical-ink)}
.tcard.warn .tv{color:var(--warning-ink)}

.cbar{height:6px;border-radius:3px;background:var(--surface-2);margin:13px 0 0;overflow:hidden}
.cbar span{display:block;height:100%;background:var(--good);transition:width .2s}

.cscroll{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:9px}
.cpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;
  padding:4px 6px 4px 11px;font-size:12.5px;margin:0 5px 5px 0;background:var(--surface)}
.cpill .pc{font-family:var(--mono);font-weight:600}
.cpill .pn{color:var(--muted);font-size:11px}
.cpill.p-good{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.cpill.p-warn{border-color:color-mix(in srgb,var(--warning) 55%,transparent);background:color-mix(in srgb,var(--warning) 7%,var(--surface))}
.cpill.p-crit{border-color:color-mix(in srgb,var(--critical) 45%,transparent)}
.cpill .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;
  padding:0 5px;border-radius:50%}
.cpill .x:hover{color:var(--critical-ink);background:var(--surface-2)}
.ccols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media (max-width:820px){ .ccols{grid-template-columns:1fr} }
.ccols h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
</style>
</head>

let DB, role='ADMIN', page='dash', sel=null, detailTab='overview';
/* Gold moves; the sale price follows it. Cost does NOT — it stays at the
   rate frozen on the BOM version, which is why margin history stays true. */
/* ONE input: the 24K / pure rate. Every alloy rate is derived from it.
   SALE factors are a COMMERCIAL number, deliberately above true fineness —
   that spread is margin. Never conflate the two columns. */
/* A purity belongs to a METAL, and each metal has its own live rate. This
   used to be one flat list multiplied by a single gold rate, which is how
   925 silver came to be priced at 92.5% of gold. */
let METALS = {                    // code -> { name, rate, asOn }
  GOLD:   {name:'Gold',   rate:15481, asOn:''},
  SILVER: {name:'Silver', rate:260,   asOn:''}
};
let PURITY=[              // karat, sale factor, true fineness, metal
  ['24K',1.0000,1.0000,'GOLD'],
  ['22K',0.9250,0.9167,'GOLD'],
  ['18K',0.7600,0.7500,'GOLD'],
  ['14K',0.5900,0.5833,'GOLD'],
  ['999',1.0000,1.0000,'SILVER'],
  ['925',1.0000,0.9250,'SILVER']];
const purityOf   = k => PURITY.find(p=>p[0]===k) || null;
const metalOf    = k => (purityOf(k)||[])[3] || 'GOLD';
const pureRate   = k => (METALS[metalOf(k)]||{}).rate || 0;
/* an unknown purity returns 0 rather than silently borrowing 14K gold —
   a zero is visible, a wrong rate is not */
const saleFactor   = k => { const p=purityOf(k); return p ? p[1] : 0; };
const trueFineness = k => { const p=purityOf(k); return p ? p[2] : 0; };
let PURE_GOLD=15481, BASE_PURE=15481;   // gold only, for the ticker
/* Making is charged per gram by default. Changing it here changes what a NEW
   line starts at; it never rewrites a line already on a piece. */
let MAKING_RATE = 1500, MAKING_BASIS = 'BY_NET_METAL_WT';
/* Live per-gram rate for a purity, from ITS OWN metal. */
const alloyRate     = k => Math.round(pureRate(k)*saleFactor(k));
const alloyCostRate = k => Math.round(pureRate(k)*trueFineness(k));
const rateStamp=()=>new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',
  year:'numeric',hour:'2-digit',minute:'2-digit'});
let RATE_AS_ON=rateStamp();

/* ---------- costing engine — mirrors recost_jewel() ---------- */
const GRAMS={GM:1,CT:0.2,RATTI:0.1215,PCS:0};
const R0 = n => Math.round(n);           // line_rounding_dp = 0

function rate(m,band,which,karat){
  const r=DB.rates[m+'|'+(band||'')]; if(!r) return 0;
  const base=r[which];
  if(which===0) return base;                          // COST: frozen, never live
  const cls=DB.materials[m]?.cls;
  if(cls==='METAL') return alloyRate(karat||'14K');   // pure rate × sale purity factor
  return base;                                        // stones & making: policy rates
}
const goldDelta=()=>PURE_GOLD-BASE_PURE;

function costBom(j,bom){
  const cls0 = m => (DB.materials[m]||{cls:'OTHER'}).cls;
  const metal = bom.lines.filter(l=>cls0(l.m)==='METAL')
                 .reduce((s,l)=>s+(l.qty||0)*GRAMS[l.uom],0);
  let cost=0,sale=0,cur=0,making=0,goods=0,bomWt=0;
  const lines = bom.lines.map(l=>{
    const cls=cls0(l.m);
    let qty=l.qty, uom=l.uom;
    if(l.basis==='BY_NET_METAL_WT'){ qty=metal; uom='GM'; }
    /* Diamonds, stones and making carry their own rate on the line — the same
       item code can be a different rate on a different piece, so a shared rate
       card would quietly reprice other people's stock. Gold is the exception:
       it is always the live pure rate x sale purity. */
    const cRate = (l.cr!==undefined && l.cr!==null) ? l.cr : rate(l.m,l.band,0,j.purity);
    const sRate = cls==='METAL' ? alloyRate(j.purity)
                : ((l.sr!==undefined && l.sr!==null) ? l.sr : rate(l.m,l.band,1,j.purity));
    /* Current cost reprices metal at today's rate and leaves every other
       line exactly as the BOM froze it. It is the replacement cost. */
    const nRate = cls==='METAL' ? alloyCostRate(j.purity) : cRate;
    const c=R0(cRate*(qty||0));
    const s=R0(sRate*(qty||0));
    const n=R0(nRate*(qty||0));
    cost+=c; sale+=s; cur+=n;
    if(cls==='LABOUR') making+=s; else { goods+=s; bomWt+=(qty||0)*GRAMS[uom]; }
    return {...l,qty,uom,cost:c,sale:s,curCost:n};
  });
  return {lines,cost,sale,cur,making,goods,metal:+metal.toFixed(3),bomWt:+bomWt.toFixed(3)};
}
const curBom = j => j.boms.find(b=>b.v===j.ver);
/* Before a piece is opened we have no material lines, only the totals the
   database computed. Use those rather than fetching 800 lines to redraw a grid. */
const costed = j => (j._live && !j._bomLoaded)
  ? {lines:[], cost:j._cost??null, sale:j._sale??null, cur:j._curCost??null,
     making:0, goods:0, metal:j.netMetal??0, bomWt:j.bomWt??0}
  : costBom(j, curBom(j));
const isLive = j => !['SOLD','MELTED','LOST'].includes(j.state);
const pct = (n,d) => (d? (100*n/d).toFixed(1) : '0.0')+'%';
/* "18K gold" / "925 silver" — the purity alone stopped being enough the day
   two metals shared the table */
const metalLabel2 = j => j.purity
  ? j.purity+' '+((METALS[metalOf(j.purity)]||{}).name||'metal').toLowerCase()
  : 'metal';
const inr = n => n==null?'—':'₹'+Number(n).toLocaleString('en-IN');
/* A piece that has not been told its karat must not be shown wearing one. */
const metalLabel = j => !j.purity ? 'karat not recorded'

/* ---- deterministic placeholder artwork so the grid reads like a catalogue ---- */
const METAL={Yellow:['#e8c877','#c9a24a'],Rose:['#e9b7a2','#c98d72'],White:['#e2e4e6','#b9bec4']};
const STONE=['#7fb5d8','#8fc9a8','#c98fb0','#d8c47f','#9aa7d8'];
function drawnArt(j,square){
  const st=DB.styles[j.style], cat=st.cat, [m1,m2]=METAL[j.colour]||METAL.Yellow;
  const seed=[...j.code].reduce((a,c)=>a+c.charCodeAt(0),0);
  const sc=STONE[seed%STONE.length];
  const h=square?300:[300,340,380,420][seed%4], w=300;
  const g=`<defs><linearGradient id="g${j.code}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${m1}"/><stop offset="1" stop-color="${m2}"/></linearGradient>
    <linearGradient id="bg${j.code}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--surface-2)"/><stop offset="1" stop-color="var(--surface)"/></linearGradient></defs>`;
  const cx=w/2, cy=h/2; let body='';
  const S=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${sc}" stroke="url(#g${j.code})" stroke-width="2"/>`;
  if(cat==='Rings'){
    body=`<circle cx="${cx}" cy="${cy+34}" r="62" fill="none" stroke="url(#g${j.code})" stroke-width="13"/>
      ${S(cx,cy-42,26)}${S(cx-34,cy-22,10)}${S(cx+34,cy-22,10)}`;
  } else if(cat==='Bangles / Bracelets'){
    body=`<circle cx="${cx}" cy="${cy}" r="88" fill="none" stroke="url(#g${j.code})" stroke-width="17"/>
      ${[0,60,120,180,240,300].map(a=>S(cx+88*Math.cos(a*Math.PI/180),cy+88*Math.sin(a*Math.PI/180),11)).join('')}`;
  } else if(cat==='Necklaces'){
    body=`<path d="M${cx-96} ${cy-72} Q${cx} ${cy+62} ${cx+96} ${cy-72}" fill="none"
        stroke="url(#g${j.code})" stroke-width="7"/>
      ${[-72,-40,0,40,72].map((o,i)=>S(cx+o, cy+40-Math.abs(o)*0.62, i===2?21:12)).join('')}
      <path d="M${cx} ${cy+58} l0 26" stroke="url(#g${j.code})" stroke-width="4"/>${S(cx,cy+96,17)}`;
  } else if(cat==='Brooch'){
    body=`<path d="M${cx} ${cy-64} L${cx+56} ${cy} L${cx} ${cy+64} L${cx-56} ${cy} Z"
        fill="none" stroke="url(#g${j.code})" stroke-width="9"/>${S(cx,cy,24)}
      ${S(cx,cy-64,9)}${S(cx,cy+64,9)}${S(cx-56,cy,9)}${S(cx+56,cy,9)}`;
  } else {
    body=`${[-42,42].map(o=>`<g><circle cx="${cx+o}" cy="${cy-46}" r="9" fill="none"
        stroke="url(#g${j.code})" stroke-width="4"/>
      <path d="M${cx+o} ${cy-37} l0 20" stroke="url(#g${j.code})" stroke-width="3"/>
      ${S(cx+o,cy+2,25)}${S(cx+o,cy+44,13)}</g>`).join('')}`;
  }
  return `<svg class="${square?'thart':'art'}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"
    role="img" aria-label="${st.name}" ${square?'preserveAspectRatio="xMidYMid slice"':`style="aspect-ratio:${w}/${h}"`}>
    ${g}<rect width="${w}" height="${h}" fill="url(#bg${j.code})"/>${body}</svg>`;
}


/* A piece is drawn as its display photograph when it has one, and as
   generated artwork when it does not. Everything that shows a piece goes
   through here, so setting a display picture updates the stock grid, the
   design library, the piece header and the similar-pieces strip at once. */
const HERO = {};                 // jewel code -> storage_key of its display picture
function heroUrl(j){
  const k = j && HERO[j.code];
  return k ? (MEDIA_URL[k] || null) : null;
}
function jewelArt(j, square){
  const u = heroUrl(j);
  if(!u) return drawnArt(j, square);
  /* object-fit keeps a portrait photograph from being stretched into the
     square the artwork used to fill. */
  return `<img class="jart${square?' sq':''}" src="${u}" alt="${j.code}"
               loading="lazy" decoding="async">`;
}
const thumb=(j,px)=>{
  const u = heroUrl(j);
  return `<span class="th${u?' thpic':''}" style="width:${px||44}px;height:${px||44}px">${
    u ? `<img src="${u}" alt="" loading="lazy" decoding="async">` : drawnArt(j,1)}</span>`;
};

/* Every field your ERP workflow sheet lists for a design. Derived where a
   demo can derive it, so all 24 pieces carry a complete record. */
function enrich(db){
  DB = db;                       // costed() reads the global; bind it first
  db.materialStock = db.materialStock || {};
  db.counts = db.counts || []; db.repairs = db.repairs || []; db.melts = db.melts || [];
  db.jewels.forEach(j=>{
    const st = db.styles[j.style] || {};
    /* Nothing here is invented. A field the database has not been told is
       left empty and shows as "not recorded", because a plausible-looking
       placeholder is worse than a blank — you cannot tell it from a fact. */
    j.internalName  = j.internalName  ?? null;
    j.story         = j.story         ?? null;
    j.webDesc       = j.webDesc       ?? null;
    j.keywords      = j.keywords      || [];
    j.social        = j.social        || [];
    j.certCompany   = j.certCompany   ?? null;
    j.certNo        = j.certNo        ?? null;
    j.vendorCode    = j.vendorCode    ?? null;
    j.vendorName    = j.vendorName    || null;
    j.vendorTat     = j.vendorTat     ?? null;
    j.avgTat        = j.avgTat        ?? null;
    j.lastMade      = j.lastMade      || j.received || null;
    j.onWebsite     = j.onWebsite     ?? false;
    j.jobCard       = j.jobCard       ?? null;
    j.modVersion    = j.modVersion    ?? null;
    j.linked        = j.linked        || [];
    j.sellVideo     = j.sellVideo     || null;

    j.partyApproval = j.state==='ON_APPROVAL'

  });
  return db;
}

async function sbFetch(path, opts={}){
  const r = await fetch(SUPA.url+'/rest/v1/'+path, {...opts, headers:{
    'apikey':SUPA.key, 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json',
    'Accept-Profile':'api', 'Content-Profile':'api', ...(opts.headers||{})}});
  const t = await r.text(); let b; try{ b = t?JSON.parse(t):null }catch{ b = t }
  if(!r.ok) throw new Error((b&&(b.message||b.error_description||b.msg))||r.statusText);
  return b;
}

/* "Failed to fetch" is what a browser says when the request never left, or never
   came back. It is not a wrong password — it means something between here and
   Supabase refused to carry it: an ad-blocker or privacy extension, a VPN, an
   office firewall, a captive wifi portal, or simply no connection. Saying so is
   more use than repeating the browser's own vague words. */
class Unreachable extends Error {}
async function sbSignIn(email, password){
  let r;
  try{
    r = await fetch(SUPA.url+'/auth/v1/token?grant_type=password', {method:'POST',
      headers:{'apikey':SUPA.key,'Content-Type':'application/json'},
      body:JSON.stringify({email, password})});
  }catch(netErr){
    throw new Unreachable(netErr.message);
  }
  let d = {}; try{ d = await r.json(); }catch{}
  if(!r.ok || !d.access_token) throw new Error(d.msg||d.error_description||('Sign in failed ('+r.status+').'));
  return d.access_token;
}

/* ═══════════════ LIVE: add details to a jewel code, over time ═══════════════
   The whole point of the system: a jewel code is a place that collects what
   is known about a piece as it is found out. Only the fields you actually
   type are sent, so this can be used twenty times over six months without
   ever disturbing what is already recorded. */
const DETAIL_FIELDS = [
  ['karat','Karat','select','karat'],
  ['colour','Metal colour','select','colour'],
  ['gross_wt','Gross weight (g)','number'],
  ['quality','Diamond quality','text'],
  ['size','Size','text'],
  ['huid','HUID','text'],
  ['hallmarked_on','Hallmarked on','date'],
  ['hallmark_centre','Hallmark centre','text'],
  ['length_mm','Length mm','number'],
  ['breadth_mm','Breadth mm','number'],
  ['height_mm','Height mm','number'],
  ['website_url','Website link','text'],
  ['remarks','Remarks','text'],
];
const CUR = {karat:'purity', colour:'colour', gross_wt:'grossWt', quality:'quality',
             huid:'huid', remarks:'remarks'};

function detailsModal(code){
  const j = DB.jewels.find(x=>x.code===code); if(!j) return;
  const opts = kind => (REF[kind]||[]).map(o=>`<option value="${o.code}">${o.label}</option>`).join('');
  const cur  = f => { const k=CUR[f]; const v=k?j[k]:null;
                      return (v===undefined||v===null||v==='—'||v===0)?'':v; };
  openModal(`<h3>Add details — ${code}</h3>
    <p class="hint">Fill in only what you now know. Anything left blank is left exactly as it is,
      so you can come back to this as often as you like.</p>
    ${j._missing&&j._missing.length?`<div class="note">Still waiting on:
      <b>${j._missing.join(' · ')}</b></div>`:''}
    <div id="dmsg"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px">
      ${DETAIL_FIELDS.map(([f,lab,type,ref])=>`
        <div><label class="lbl">${lab}${cur(f)!==''?` <span class="dim">· now ${cur(f)}</span>`:''}</label>
        ${type==='select'
          ? `<select id="d_${f}"><option value="">— leave as is —</option>${opts(ref)}</select>`
          : `<input id="d_${f}" type="${type}" ${type==='number'?'step="0.001"':''}
               placeholder="${cur(f)!==''?'leave blank to keep '+cur(f):'not known yet'}">`}
        </div>`).join('')}
    </div>
    ${j.state==='NOT_RECEIVED'?`
      <div class="note" style="margin-top:14px">This piece is <b>not in stock</b> yet. Choose where
        it physically is and it becomes stock from that moment.
        <div style="margin-top:8px"><select id="d_location"><option value="">— not received yet —</option>
          ${(REF.location||[]).map(l=>`<option value="${l.code}">${l.label}</option>`).join('')}
        </select></div></div>`:''}
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="dsave">Save what I have</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>`);

  document.getElementById('dsave').onclick = async e => {
    const btn=e.target; btn.disabled=true; btn.textContent='Saving…';
    try{
      const patch = {jewel_code: code};
      DETAIL_FIELDS.forEach(([f])=>{
        const n=document.getElementById('d_'+f);
        if(n && n.value.trim()!=='') patch[f]=n.value.trim(); });
      if(Object.keys(patch).length>1) await sbRpc('update_piece',{p:patch});
      const loc=document.getElementById('d_location');
      if(loc && loc.value) await sbRpc('receive_piece',{p:{jewel_code:code, location:loc.value}});
      if(Object.keys(patch).length===1 && !(loc&&loc.value)){
        document.getElementById('dmsg').innerHTML =
          `<div class="note">Nothing was filled in, so nothing was saved.</div>`;
        btn.disabled=false; btn.textContent='Save what I have'; return;
      }
      closeModal(); await liveRefresh();
      const upd = DB.jewels.find(x=>x.code===code);
      toast(`<b>${code}</b> updated.` + (upd&&upd._missing.length
        ? ` Still waiting on: ${upd._missing.join(', ')}.` : ' Nothing missing now.'));
    }catch(err){
      document.getElementById('dmsg').innerHTML =
        `<div class="note" style="border-color:var(--critical)">${err.message}</div>`;
      btn.disabled=false; btn.textContent='Save what I have';
    }
  };
}

/* ═══════════════ Media, stored in Cloudflare R2 ═══════════════
   The file goes straight from this browser to R2. It never passes through
   the database, and the signing key is never in this file — a short-lived
   link is fetched from the media-url function, which keeps the key in
   Supabase's secret store.

   A photograph belongs to the piece. A CAD or 3DM file belongs to the
   design, because that is what it describes. */
const MEDIA_KINDS = [
  {k:'PHOTO',            label:'Photographs',    on:'piece',  icon:'▣',
   accept:'.jpg,.jpeg,.png,.heic,.heif,.webp,.tif,.tiff',
   note:'JPEG, PNG, HEIC or TIFF. iPhone HEIC and studio TIFF get a JPEG copy on upload so they can be seen; the original is kept untouched.'},
  {k:'VIDEO',            label:'Video',          on:'piece',  icon:'▶',
   accept:'.mp4,.mov,.m4v,.webm',
   note:'MP4 or MOV. A slow turn on a plain background sells better than a clip.'},
  {k:'RENDER',           label:'Renders',        on:'piece',  icon:'◈',
   accept:'.jpg,.jpeg,.png,.webp,.tif,.tiff',
   note:'Output from CAD, before the piece exists.'},
  {k:'GRAPH',            label:'Graph',          on:'design', icon:'▦',
   accept:'.jpg,.jpeg,.png,.pdf,.tif,.tiff',
   note:'The setting layout the karigar works from — stone placement on graph paper.'},
  {k:'CAD',              label:'CAD / 3DM',      on:'design', icon:'◧',
   accept:'.3dm,.stl,.obj,.step,.stp,.iges,.igs,.zip,.rar,.dwg,.dxf',
   note:'Rhino, Matrix and the like. Full size — R2 takes them whole.'},
  {k:'PENCIL_DRAWING',   label:'Pencil drawing', on:'design', icon:'✎',
   accept:'.jpg,.jpeg,.png,.pdf,.heic,.tif,.tiff',
   note:'The original sketch.'},
  {k:'CERTIFICATE_SCAN', label:'Certificate',    on:'piece',  icon:'▤',
   accept:'.pdf,.jpg,.jpeg,.png',
   note:'IGI, SGL, GIA. One per stone if there are several.'},
  {k:'JOB_CARD_SCAN',    label:'Job card',       on:'piece',  icon:'▥',
   accept:'.pdf,.jpg,.jpeg,.png,.heic',
   note:'The paper this piece was made from.'},
];
let MEDIA = {};        // jewel_code / style_code -> rows
let MEDIA_URL = {};    // storage_key -> signed link

const fnUrl = () => SUPA.url.replace('.supabase.co', '.functions.supabase.co') + '/media-url';
async function mediaFn(body){
  const r = await fetch(fnUrl(), {method:'POST', headers:{
    'apikey':SUPA.key, 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  const d = await r.json().catch(()=>({error:'the media service did not answer'}));
  if(!r.ok) throw new Error(d.error || ('media service error '+r.status));
  return d;
}
async function loadMedia(){
  if(!TOKEN) return;          // not LIVE — that is only set after this runs
  const rows = await sbFetch('media?select=*&order=kind,rank_order');
  MEDIA = {};
  rows.forEach(m => { const k = m.jewel_code || m.style_code;
    if(k) (MEDIA[k] = MEDIA[k] || []).push(m); });
  DB.jewels.forEach(j => { j.media = MEDIA[j.code] || []; });

  /* Work out one display picture per piece, then sign them all in a single
     request. Signing per thumbnail would be one round trip per row in the
     stock list; this is one for the whole catalogue.

     A piece with no chosen display picture falls back to its first showable
     photograph, so uploading a photo is enough — picking a favourite is only
     needed when there is more than one and the order is wrong. */
  Object.keys(HERO).forEach(k => delete HERO[k]);
  const wanted = [];
  const showKey = m => browserCanShow(m.mime_type, m.file_name)
                       ? m.storage_key : (m.view_key || null);
  const pick = list => {
    /* The chosen flag can sit on a generated JPEG copy — set_display_photo
       redirects to it, because the HEIC it came from cannot be drawn. So the
       flag is looked for across every row, copies included, before falling
       back. */
    const flagged = list.find(m => m.is_catalogue_default);
    if(flagged){ const k = showKey(flagged); if(k) return k; }
    /* No choice made: the first photograph that can actually be shown. Skip
       past ones that cannot rather than giving up on the first. */
    for(const m of list){
      if(!['PHOTO','RENDER','GRAPH'].includes(m.kind) || m.derivative_of) continue;
      const k = showKey(m); if(k) return k;
    }
    return null;
  };
  DB.jewels.forEach(j => {
    const key = pick((MEDIA[j.code] || []).concat(MEDIA[j.style] || []));
    if(key){ HERO[j.code] = key; if(!(key in MEDIA_URL)) wanted.push(key); }
  });
  if(wanted.length){
    try{
      const d = await mediaFn({action:'get_many', storage_keys:wanted.slice(0,400)});
      Object.assign(MEDIA_URL, d.urls || {});
      wanted.forEach(k => { if(!(k in MEDIA_URL)) MEDIA_URL[k] = null; });
    }catch(e){ wanted.forEach(k => MEDIA_URL[k] = null); }
  }
}

/* What a browser will actually draw. HEIC is what an iPhone shoots and TIFF
   is what a studio delivers, and no desktop browser can decode either — an
   <img> pointing at one is a blank box, and a link to one downloads instead
   of opening. Knowing the difference is the whole fix. */
const SHOWABLE = ['image/jpeg','image/png','image/webp','image/gif','image/avif','image/svg+xml'];
const UNSHOWABLE_EXT = /\.(heic|heif|tiff?|3dm|stl|obj|step|stp|iges|igs|dwg|dxf|zip|rar|cr2|nef|arw|dng|psd|ai)$/i;
function browserCanShow(mime, name){
  if(name && UNSHOWABLE_EXT.test(name)) return false;
  if(mime && SHOWABLE.includes(mime.toLowerCase())) return true;
  if(!mime && name) return /\.(jpe?g|png|webp|gif|avif|svg)$/i.test(name);
  return false;
}
const isVideo = (mime,name) => (mime||'').startsWith('video/') || /\.(mp4|webm|mov|m4v)$/i.test(name||'');
/* signed links come in one batch, not one request per thumbnail */
async function signMedia(rows){
  const need = rows.map(m=>m.storage_key).filter(k=>k && !(k in MEDIA_URL));
  if(!need.length) return 0;                 // nothing to do — and nothing to redraw
  try{
    const d = await mediaFn({action:'get_many', storage_keys:need});
    Object.assign(MEDIA_URL, d.urls||{});
    /* remember the failures too, as null, so we do not ask again on every
       redraw — that turned into an endless render loop the first time */
    need.forEach(k=>{ if(!(k in MEDIA_URL)) MEDIA_URL[k]=null; });
    return Object.keys(d.urls||{}).length;
  }catch(e){
    need.forEach(k=>MEDIA_URL[k]=null);
    return 0;
  }
}
/* Download saves the file instead of opening it — the link R2 returns carries
   Content-Disposition: attachment, which is the only thing that behaves the
   same on a phone as on a laptop. A cross-origin <a download> is ignored. */
async function downloadMedia(ref){
  const m = Object.values(MEDIA).flat().find(x=>x.media_ref===ref);
  if(!m) return;
  try{
    const d = await mediaFn({action:'download', storage_key:m.storage_key,
                             file_name:m.file_name || (m.media_ref+'.bin')});
    const a = document.createElement('a');
    a.href = d.url; a.rel='noopener'; a.target='_blank';
    document.body.append(a); a.click(); a.remove();
  }catch(err){ toast('Could not build a download link. '+err.message, true); }
}
async function downloadAll(code){
  const rows = (MEDIA[code]||[]).concat(MEDIA[(DB.jewels.find(j=>j.code===code)||{}).style]||[]);
  if(!rows.length) return toast('Nothing to download on this piece.', true);
  toast(`Starting ${rows.length} download${rows.length===1?'':'s'}…`);
  for(const m of rows){ await downloadMedia(m.media_ref); await new Promise(r=>setTimeout(r,400)); }
}
/* ═══════════════ Viewer ═══════════════
   Clicking a photograph used to open a new browser tab, which for a HEIC or a
   TIFF meant a download instead. It now opens here, over the piece, with the
   arrow keys moving through the set. */
let VIEW_SET = [], VIEW_AT = 0;
function openViewer(ref){
  const all = Object.values(MEDIA).flat();
  const m = all.find(x=>x.media_ref===ref);
  if(!m) return;
  const j = DB.jewels.find(x=>x.code===sel) || {};
  VIEW_SET = (MEDIA[j.code]||[]).concat(MEDIA[j.style]||[])
    .filter(x=>!x.derivative_of)
    .filter(x=>{
      const own = browserCanShow(x.mime_type, x.file_name);
      const k = own ? x.storage_key : x.view_key;
      return k && MEDIA_URL[k];
    });
  VIEW_AT = Math.max(0, VIEW_SET.findIndex(x=>x.media_ref===ref));
  if(!VIEW_SET.length){ VIEW_SET=[m]; VIEW_AT=0; }
  drawViewer();
}
function drawViewer(){
  const m = VIEW_SET[VIEW_AT]; if(!m) return;
  const own = browserCanShow(m.mime_type, m.file_name);
  const key = own ? m.storage_key : m.view_key;
  const url = key ? MEDIA_URL[key] : null;
  const vid = isVideo(m.mime_type, m.file_name);
  const mb  = m.bytes ? (m.bytes/1048576).toFixed(m.bytes<1048576?2:1)+' MB' : '';
  const n   = VIEW_SET.length;
  openModal(`<div class="vwrap">
    <div class="vstage">
      ${n>1?`<button class="vnav vprev" data-vgo="-1" aria-label="Previous">‹</button>`:''}
      ${url ? (vid ? `<video src="${url}" controls autoplay playsinline></video>`
                   : `<img src="${url}" alt="${m.file_name||''}">`)
            : `<div class="vnone">This file cannot be shown in a browser.<br>
                 <span>${(m.file_name||'').split('.').pop().toUpperCase()} — download it to open
                 in Photos, Preview or Rhino.</span></div>`}
      ${n>1?`<button class="vnav vnext" data-vgo="1" aria-label="Next">›</button>`:''}
    </div>
    <div class="vbar">
      <div class="vmeta">
        <b>${m.file_name||m.media_ref}</b>
        <span class="dim">${mb}${mb&&' · '}<span class="mono">${m.media_ref}</span>${
          n>1?` · ${VIEW_AT+1} of ${n}`:''}${
          !own && m.view_key ? ' · showing the JPEG copy' : ''}</span>
      </div>
      <div class="row">
        <button class="btn sm" data-vdl="${m.media_ref}">⇩ Download original</button>
        <button class="btn sm" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>`, 1);
  document.querySelectorAll('[data-vgo]').forEach(b=>b.onclick=()=>{
    VIEW_AT = (VIEW_AT + (+b.dataset.vgo) + VIEW_SET.length) % VIEW_SET.length;
    drawViewer(); });
  const dl = document.querySelector('[data-vdl]');
  if(dl) dl.onclick = () => downloadMedia(dl.dataset.vdl);
}
document.addEventListener('keydown', e=>{
  if(!document.getElementById('scrim').classList.contains('open')) return;
  if(!VIEW_SET.length || !document.querySelector('.vwrap')) return;
  if(e.key==='ArrowLeft'){ VIEW_AT=(VIEW_AT-1+VIEW_SET.length)%VIEW_SET.length; drawViewer(); }
  if(e.key==='ArrowRight'){ VIEW_AT=(VIEW_AT+1)%VIEW_SET.length; drawViewer(); }
});

/* ═══════════════ HEIC and TIFF become viewable ═══════════════
   An iPhone shoots HEIC and a studio delivers TIFF. No desktop browser can
   decode either, so the original alone is a file nobody in the office can
   look at. The original is still uploaded untouched — it is the archive and
   the print master — and a JPEG copy goes up beside it for the screen.

   The decoders are fetched from a CDN only when such a file is actually
   chosen, so the app does not carry two megabytes it almost never needs. If
   the CDN cannot be reached the upload still succeeds with the original only,
   and says so rather than failing. */
const CONV = {
  heic: {test:/\.(heic|heif)$/i, mime:['image/heic','image/heif'],
         url:'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js',
         has:()=>typeof heic2any!=='undefined'},
  tiff: {test:/\.tiff?$/i, mime:['image/tiff','image/tif'],
         url:'https://cdnjs.cloudflare.com/ajax/libs/UTIF.js/3.1.0/UTIF.min.js',
         has:()=>typeof UTIF!=='undefined'},
};
function needsCopy(f){
  const n = f.name||'';
  for(const [k,c] of Object.entries(CONV))
    if(c.test.test(n) || c.mime.includes((f.type||'').toLowerCase())) return k;
  return null;
}
function loadScript(src){
  return new Promise((ok,bad)=>{
    const t = document.createElement('script');
    t.src = src; t.onload = ok;
    t.onerror = () => bad(new Error('could not reach '+new URL(src).hostname));
    document.head.append(t);
  });
}
/** Returns a JPEG File, or null if it could not be made. Never throws. */
async function makeViewable(f, which){
  try{
    const c = CONV[which];
    if(!c.has()) await loadScript(c.url);
    const base = (f.name||'photo').replace(/\.[^.]+$/,'');
    if(which==='heic'){
      let out = await heic2any({blob:f, toType:'image/jpeg', quality:0.88});
      if(Array.isArray(out)) out = out[0];
      return new File([out], base+'.jpg', {type:'image/jpeg'});
    }
    const buf = await f.arrayBuffer();
    const ifds = UTIF.decode(buf);
    UTIF.decodeImage(buf, ifds[0], ifds);
    const rgba = UTIF.toRGBA8(ifds[0]);
    const cv = document.createElement('canvas');
    cv.width = ifds[0].width; cv.height = ifds[0].height;
    cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba), cv.width, cv.height), 0, 0);
    const blob = await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));
    return blob ? new File([blob], base+'.jpg', {type:'image/jpeg'}) : null;
  }catch(e){ return null; }
}

async function uploadFiles(files, code, styleCode, kind){
  const spec = MEDIA_KINDS.find(x=>x.k===kind) || MEDIA_KINDS[0];
  const owner = spec.on==='design' ? {style_code: styleCode} : {jewel_code: code};
  const send = async (file, extra) => {
    const res = await mediaFn({action:'upload', ...owner, kind,
      file_name:file.name, mime_type:file.type||'application/octet-stream',
      bytes:file.size, ...(extra||{})});
    const put = await fetch(res.upload_url, {method:'PUT', body:file,
      headers:{'Content-Type': file.type || 'application/octet-stream'}});
    if(!put.ok) throw new Error(`R2 refused ${file.name} (${put.status}). `
      + 'If this says 403 the API token is probably read-only.');
    await mediaFn({action:'confirm', media_ref:res.media_ref, bytes:file.size});
    return res.media_ref;
  };

  let done=0, copies=0, failed=[];
  for(const f of files){
    toast(`Uploading <b>${f.name}</b> (${(f.size/1048576).toFixed(1)} MB)…`);
    const ref = await send(f);
    done++;

    /* The archive copy is in. Now a copy the office can actually look at.
       This is deliberately after the original: if conversion fails, the
       photograph is still safely stored. */
    const which = needsCopy(f);
    if(which){
      toast(`Making a viewable copy of <b>${f.name}</b>…`);
      const jpg = await makeViewable(f, which);
      if(jpg){
        try{ await send(jpg, {derivative_of:ref, derivative_kind:'VIEW'}); copies++; }
        catch(e){ failed.push(f.name); }
      } else failed.push(f.name);
    }
  }
  if(failed.length) toast(`Uploaded, but no viewable copy could be made for `
    + `<b>${failed.join(', ')}</b>. The original is safe — it just will not `
    + `preview in a browser.`, true);
  return done;
}
function mediaPanel(j){
  const st = DB.styles[j.style] || {};
  const mine  = MEDIA[j.code]  || [];
  const design= MEDIA[j.style] || [];
  const rows  = mine.concat(design);
  signMedia(rows).then(n=>{ if(n && sel===j.code && detailTab==='media') render(); });
  const may = can('editBom') || (ME && ME.role_code==='GRAPHIC') || can('melt');
  const mb  = b => b ? (b/1048576).toFixed(b<1048576?2:1)+' MB' : '—';

  const tile = m => {
    /* Three cases, and conflating them is what made this confusing:
       the file itself is showable; it is not, but a JPEG copy exists; or it
       is not and there is no copy. Only the third is a dead end, and it now
       says so instead of showing a broken image and a link that downloads. */
    const own   = browserCanShow(m.mime_type, m.file_name);
    const key   = own ? m.storage_key : (m.view_key || null);
    const url   = key ? MEDIA_URL[key] : null;
    const vid   = isVideo(m.mime_type, m.file_name);
    const ext   = (m.file_name||'').split('.').pop().toUpperCase() || 'FILE';
    const isHero= m.is_catalogue_default;
    const canBeHero = ['PHOTO','RENDER','GRAPH'].includes(m.kind) && (own || m.view_key);

    const shot = url
      ? (vid ? `<video src="${url}" muted playsinline preload="metadata"></video>`
             : `<img src="${url}" alt="${m.file_name||''}" loading="lazy" decoding="async">`)
      : `<span class="mext">${ext}</span>
         ${!own && !m.view_key ? `<span class="mnoview">no preview<br><span>${ext} — browsers cannot draw this</span></span>` : ''}`;

    return `<figure class="mcard${isHero?' ishero':''}">
      <div class="mshot${url?' clickable':''}" ${url?`data-open="${m.media_ref}"`:''}
           ${url?'title="Click to view"':''}>
        ${shot}
        ${isHero?'<span class="mhero">display</span>':''}
        ${!own && m.view_key ? '<span class="mconv">JPEG copy</span>':''}
      </div>
      <figcaption>
        <span class="mname" title="${m.file_name||''}">${m.file_name||m.media_ref}</span>
        <span class="mmeta">${mb(m.bytes)} · <span class="mono">${m.media_ref}</span></span>
        <span class="macts">
          ${url?`<a href="#" data-open="${m.media_ref}">view</a>`:''}
          <a href="#" data-dl="${m.media_ref}">save</a>
          ${may && canBeHero && !isHero ? `<a href="#" data-hero="${m.media_ref}"
              title="Use this as the picture shown wherever the piece is listed">display</a>`:''}
          ${may && isHero ? `<a href="#" data-unhero="${j.code}" class="dim">unset</a>`:''}
          ${may ? `<a href="#" data-drop="${m.media_ref}" class="mdel">remove</a>`:''}
        </span>
      </figcaption></figure>`;
  };

  const section = spec => {
    const list = (spec.on==='design' ? design : mine)
                   .filter(m=>m.kind===spec.k && !m.derivative_of);
    return `<section class="mgroup">
      <header class="mghead">
        <div>
          <h4><span class="mgico">${spec.icon}</span>${spec.label}
            <span class="mgcount">${list.length||''}</span></h4>
          ${list.length ? `<p class="mgnote"><span class="mgscope">${spec.on==='design'
              ? 'on the design <b>'+(st.code||j.style)+'</b> — shared by every piece of it'
              : 'on this piece'}</span></p>`
            : `<p class="mgnote">${spec.note}
            <span class="mgscope">${spec.on==='design'
              ? 'kept on the design <b>'+(st.code||j.style)+'</b> — shared by every piece of it'
              : 'kept on this piece'}</span></p>`}
        </div>
      </header>
      <div class="mgrid">
        ${list.map(tile).join('')}
        ${may?`<button class="madd" data-kind="${spec.k}">
          <span class="maddplus">+</span>

  };

  return `<div class="card">

        CAD included. Each name carries its own reference

        still finds its way home.</p></div></div>

}

/* ═══════════════ Editing in place ═══════════════
   A field is edited where it is shown. Click the value, type, press Enter.
   Escape puts it back. Only what actually changed is sent, so a stray click
   costs nothing.

   The jewel code is the one thing that cannot be edited: it is the identity
   of a physical object, and renaming it would silently move every movement,
   sale and photograph onto a different piece. Delete and re-add instead. */
const EDITABLE = {
  karat:        {label:'Karat',            type:'select', ref:'karat'},
  colour:       {label:'Metal colour',     type:'select', ref:'colour'},
  gross_wt:     {label:'Gross weight',     type:'number', step:'0.001', suffix:' g'},
  quality:      {label:'Diamond quality',  type:'text'},
  size:         {label:'Size',             type:'text'},
  sub_category: {label:'Sub category',     type:'text'},
  collection:   {label:'Collection',       type:'text'},
  huid:         {label:'HUID',             type:'text'},
  hallmarked_on:{label:'Hallmarked on',    type:'date'},
  hallmark_centre:{label:'Hallmark centre',type:'text'},
  length_mm:    {label:'Length',           type:'number', step:'0.1', suffix:' mm'},
  breadth_mm:   {label:'Breadth',          type:'number', step:'0.1', suffix:' mm'},
  height_mm:    {label:'Height',           type:'number', step:'0.1', suffix:' mm'},
  vendor:       {label:'Manufacturer',     type:'text'},
  website_url:  {label:'Website link',     type:'text'},
  remarks:      {label:'Remarks',          type:'text'},
};
/* where each editable field currently lives on the piece object */
const FIELD_VALUE = {
  design_name:j=>(DB.styles[j.style]||{}).name,
  karat:j=>j.purity, colour:j=>j.colour, gross_wt:j=>j.grossWt, quality:j=>j.quality,
  size:j=>j.size, sub_category:j=>j.subCat, collection:j=>j.collection, huid:j=>j.huid,
  hallmarked_on:j=>j.hallmarkedOn, hallmark_centre:j=>j.hallmarkCentre,
  length_mm:j=>j.lengthMm, breadth_mm:j=>j.breadthMm, height_mm:j=>j.heightMm,
  vendor:j=>j.vendorName, website_url:j=>j.websiteUrl, remarks:j=>j.remarks,
};
/* a biodata row that can be edited in place when signed in */
function erow(field, value, mono){
  const spec = EDITABLE[field];
  const shown = (value===null||value===undefined||value===''||value==='—')
    ? '<span class="unset">not recorded</span>'
    : value + (spec && spec.suffix && !String(value).includes(spec.suffix) ? spec.suffix : '');
  if(!LIVE || !can('editBom') || !spec)
    return `<div class="biorow"><dt>${spec?spec.label:field}</dt>
      <dd class="${mono?'mono':''}">${shown}</dd></div>`;
  return `<div class="biorow"><dt>${spec.label}</dt>
    <dd class="${mono?'mono':''} editable" data-edit="${field}" tabindex="0"
        title="Click to edit">${shown}<span class="pen">✎</span></dd></div>`;
}
function startEdit(dd){
  if(dd.querySelector('input,select')) return;
  const field = dd.dataset.edit, spec = EDITABLE[field];
  const j = DB.jewels.find(x=>x.code===sel);
  const cur = FIELD_VALUE[field] ? FIELD_VALUE[field](j) : '';
  const old = dd.innerHTML;
  let el;
  if(spec.type==='select'){
    el = document.createElement('select');
    el.innerHTML = `<option value="">—</option>` +
      (REF[spec.ref]||[]).map(o=>`<option value="${o.code}" ${o.code===cur?'selected':''}>${o.label}</option>`).join('');
  } else {
    el = document.createElement('input');
    el.type = spec.type; if(spec.step) el.step = spec.step;
    el.value = (cur===null||cur===undefined||cur==='—')?'':cur;
  }
  el.className='inplace';
  dd.innerHTML=''; dd.append(el); el.focus(); if(el.select) el.select();

  let done=false;
  const cancel = () => { if(done) return; done=true; dd.innerHTML=old; bindEdits(); };
  const save = async () => {
    if(done) return; done=true;
    const val = el.value.trim();
    const was = (cur===null||cur===undefined||cur==='—')?'':String(cur);
    if(val === was){ dd.innerHTML=old; bindEdits(); return; }
    dd.innerHTML = '<span class="dim">saving…</span>';
    try{
      await sbRpc('update_piece', {p:{jewel_code: sel, [field]: val}});
      await liveRefresh();
      toast(`<b>${sel}</b> · ${spec.label} ${val===''?'cleared':'set to '+val}.`);
    }catch(err){
      dd.innerHTML=old; bindEdits();
      toast('Not saved. '+err.message, true);
    }
  };
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); save(); }
    if(e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
  el.addEventListener('blur', save);
  if(spec.type==='select') el.addEventListener('change', save);
}
function bindEdits(){
  document.querySelectorAll('dd.editable').forEach(dd=>{
    dd.onclick = () => startEdit(dd);
    dd.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); startEdit(dd); } };
  });
}

/* ═══════════════ LIVE: add one piece by hand, with its BOM ═══════════════
